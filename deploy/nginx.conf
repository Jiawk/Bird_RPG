# /etc/nginx/sites-available/orc-arena
# 反向代理 + 安全加固（Node 只监听 127.0.0.1:3000，不对外暴露）

limit_req_zone $binary_remote_addr zone=orc_login:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=orc_api:10m  rate=120r/m;
limit_conn_zone $binary_remote_addr zone=orc_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # certbot 用
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # 其余全部 301 到 https（配好证书后取消注释）
    # location / { return 301 https://$host$request_uri; }

    root /opt/orc-arena/public;

    # ---------- 通用安全 ----------
    server_tokens off;
    client_max_body_size 12m;
    limit_conn orc_conn 20;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- 登录/注册：严格限流 ----------
    location ~ ^/api/(login|register)$ {
        limit_req zone=orc_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 其他 API ----------
    location /api/ {
        limit_req zone=orc_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 游戏页面（Node 里做登录校验）----------
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 禁止访问隐藏文件
    location ~ /\. { deny all; }
}
