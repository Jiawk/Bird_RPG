<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>兽人永不为奴 · 登录</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--gold:#d4af37;--gold-lt:#ffd98a;--bronze:#8a6d3f;--bg:#0b0906}
  html,body{height:100%}
  body{display:flex;align-items:center;justify-content:center;padding:20px;
    background:radial-gradient(ellipse at 50% 0%,#241c10 0%,#0b0906 62%);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#e8e0cc}
  .box{width:min(380px,100%);padding:26px 24px 22px;border-radius:6px;
    background:linear-gradient(170deg,#312818,#17120a 55%,#0c0905);
    border:2px solid var(--bronze);box-shadow:0 18px 60px rgba(0,0,0,.85)}
  h1{font-family:"KaiTi",serif;font-size:24px;color:var(--gold-lt);letter-spacing:.2em;
    text-align:center;text-shadow:0 0 18px rgba(212,175,55,.45)}
  .sub{text-align:center;font-size:11px;color:#8f8570;margin:6px 0 18px;letter-spacing:.14em}
  label{display:block;font-size:12px;color:#b8ad93;margin:12px 0 5px;letter-spacing:.08em}
  input{width:100%;padding:11px 12px;font-size:15px;border-radius:3px;
    background:#0d0a06;border:1px solid #4a3d28;color:#f0e8d6;outline:none}
  input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,175,55,.18)}
  .btn{width:100%;margin-top:18px;padding:12px;font-size:15px;font-family:"KaiTi",serif;
    letter-spacing:.2em;border-radius:3px;cursor:pointer;color:#ffe6a8;
    background:linear-gradient(180deg,#6b5520,#2a1e0c);border:1px solid var(--gold)}
  .btn:hover{filter:brightness(1.15)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .switch{margin-top:14px;text-align:center;font-size:12px;color:#8f8570}
  .switch a{color:var(--gold);cursor:pointer;text-decoration:none;margin-left:4px}
  .msg{min-height:18px;margin-top:12px;text-align:center;font-size:12.5px;color:#ff6b5a}
  .msg.ok{color:#5fdc4a}
  .foot{margin-top:18px;text-align:center;font-size:10.5px;color:#6b6558;letter-spacing:.1em}
</style>
</head>
<body>
<div class="box">
  <h1>兽人永不为奴</h1>
  <div class="sub">登 录 后 开 始 冒 险</div>
  <label>用户名</label>
  <input id="u" autocomplete="username" placeholder="3~16 位，中文/字母/数字">
  <label>密码</label>
  <input id="p" type="password" autocomplete="current-password" placeholder="至少 6 位">
  <button class="btn" id="go">登 录</button>
  <div class="msg" id="msg"></div>
  <div class="switch" id="switch">还没有账号？<a id="toReg">注册一个</a></div>
  <div class="foot">作者 Bird · QQ 827766702</div>
</div>
<script>
let mode = 'login';
const $ = id => document.getElementById(id);

$('toReg').onclick = () => {
  mode = mode === 'login' ? 'register' : 'login';
  $('go').textContent = mode === 'login' ? '登 录' : '注 册';
  $('switch').innerHTML = mode === 'login'
    ? '还没有账号？<a id="toReg">注册一个</a>'
    : '已有账号？<a id="toReg">去登录</a>';
  $('toReg').onclick = arguments.callee;
  $('msg').textContent = '';
};

function say(t, ok) {
  const m = $('msg');
  m.textContent = t;
  m.className = 'msg' + (ok ? ' ok' : '');
}

async function submit() {
  const username = $('u').value.trim();
  const password = $('p').value;
  if (!username || !password) return say('请填写用户名和密码');
  $('go').disabled = true;
  try {
    const r = await fetch('/api/' + mode, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin', body: JSON.stringify({ username, password })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) { say(d.msg || '操作失败'); return; }
    say(mode === 'login' ? '登录成功，正在进入…' : '注册成功，正在进入…', true);
    setTimeout(() => location.href = '/game', 500);
  } catch (e) {
    say('网络错误，请重试');
  } finally {
    $('go').disabled = false;
  }
}

$('go').onclick = submit;
document.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

// 已登录直接进游戏
fetch('/api/me', { credentials: 'same-origin' })
  .then(r => r.ok ? r.json() : null)
  .then(d => { if (d && d.ok) location.href = '/game'; })
  .catch(() => {});
</script>
</body>
</html>
