<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>兽人永不为奴</title>
<style>
/* ============================================================
   魔兽争霸3 冰封王座 风格 UI V2
   ============================================================ */
:root{
  --ink:#060708;
  --stone-0:#0d0b08;
  --stone-1:#1a1610;
  --stone-2:#2b2418;
  --stone-3:#3a3121;
  --bronze-dk:#4a3a1e;
  --bronze:#8a6d3b;
  --bronze-lt:#c9a24a;
  --gold:#d4af37;
  --gold-lt:#ffd24a;
  --bone:#e8e0cc;
  --bone-dim:#b8ad93;
  --hp-1:#5fdc4a; --hp-2:#2e8f22;
  --mp-1:#4a9eff; --mp-2:#1f5fa8;
  --xp-1:#a48ce0; --xp-2:#5b3fa8;
  --serif:"KaiTi","STKaiti","SimSun","Noto Serif CJK SC",Georgia,serif;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--bone);
  font-family:var(--sans);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;background:#050605}
.hidden{display:none !important}

/* ============ 通用石质面板 ============ */
.stone{
  background:
    linear-gradient(180deg,rgba(255,235,180,.07),rgba(0,0,0,.42)),
    linear-gradient(165deg,var(--stone-3),var(--stone-1) 55%,var(--stone-0));
  border:2px solid var(--bronze-dk);
  box-shadow:inset 0 1px 0 rgba(255,220,150,.2),inset 0 -2px 4px rgba(0,0,0,.7),0 4px 16px rgba(0,0,0,.7);
}

/* ============ 顶部 ============ */
.topbar-left{position:absolute;top:8px;left:50%;transform:translateX(-50%);text-align:center;z-index:20;
  padding:5px 26px;border-radius:3px;
  background:linear-gradient(180deg,rgba(30,24,14,.92),rgba(10,8,4,.92));
  border:1px solid var(--bronze-dk);box-shadow:0 2px 10px rgba(0,0,0,.7)}
.room-name{font-family:var(--serif);font-size:19px;color:var(--gold-lt);letter-spacing:.1em;
  text-shadow:0 0 12px rgba(255,200,80,.4),0 2px 2px #000;display:block;line-height:1.2}
.room-sub{font-size:10px;color:var(--bone-dim);letter-spacing:.14em}

.topbar-right{position:absolute;top:8px;right:10px;display:flex;gap:6px;z-index:20}
.res-box{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:3px;
  background:linear-gradient(180deg,rgba(40,32,18,.95),rgba(12,9,5,.95));
  border:1px solid var(--bronze);box-shadow:inset 0 1px 0 rgba(255,220,150,.18),0 2px 8px rgba(0,0,0,.6);
  font-family:var(--serif);font-size:14px;color:var(--gold-lt);text-shadow:0 1px 2px #000}
.res-box i{font-style:normal;font-size:11px;opacity:.85;font-family:var(--serif)}
.ic-gold{color:var(--gold);text-shadow:0 0 8px rgba(212,175,55,.8)}
.ic-gear{color:#7fb3d5}
.ic-cp{color:#ffd24a}
.ic-diff{color:#ff9a6a}

/* ============ BOSS 血条 ============ */
.boss-bar{position:absolute;top:74px;left:50%;transform:translateX(-50%);
  width:min(600px,calc(100vw - 40px));z-index:19;text-align:center}
.bb-name{font-family:var(--serif);font-size:17px;color:#ff9a9a;
  text-shadow:0 0 14px rgba(255,60,60,.65),0 2px 3px #000;letter-spacing:.1em;margin-bottom:4px}
.bb-track{height:17px;background:#0d0505;border:2px solid #6b2b2b;border-radius:2px;
  box-shadow:inset 0 0 10px rgba(0,0,0,.95),0 0 0 1px rgba(0,0,0,.8);overflow:hidden}
.bb-fill{height:100%;width:100%;background:linear-gradient(180deg,#ff6a4a,#7a1414);
  transition:width .22s ease;box-shadow:0 0 14px rgba(255,60,40,.75)}


/* 左上角：头像 + 血蓝 */
.hud-portrait{position:absolute;top:10px;left:10px;z-index:24;display:flex;align-items:center;gap:10px;
  padding:8px 14px 8px 8px;border-radius:3px;
  background:linear-gradient(180deg,rgba(58,47,28,.94),rgba(16,12,7,.96));
  border:2px solid var(--bronze);box-shadow:inset 0 1px 0 rgba(255,220,150,.2),0 4px 16px rgba(0,0,0,.8)}
.portrait-frame{position:relative;width:76px;height:76px;padding:3px;border-radius:3px;
  background:linear-gradient(160deg,#5a4626,#241b0d);border:2px solid var(--bronze);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.7),0 0 12px rgba(212,175,55,.22)}
#portrait{display:block;width:100%;height:100%;border-radius:1px}
.p-level{position:absolute;right:-6px;bottom:-6px;min-width:22px;text-align:center;padding:1px 5px;
  border-radius:2px;font-family:var(--serif);font-size:12px;color:#1a1206;
  background:linear-gradient(180deg,#ffd24a,#b8891e);border:1px solid #6b4f13}
.hp-info{display:flex;flex-direction:column;gap:3px;min-width:210px}
.p-name{font-family:var(--serif);font-size:14px;color:var(--gold-lt);letter-spacing:.06em;
  text-shadow:0 1px 3px #000;margin-bottom:1px}
.p-stats{font-size:10px;color:var(--bone-dim);margin-top:2px}
.p-stats b{color:#ffd98a}

.bar{position:relative;height:15px;border-radius:2px;overflow:hidden;
  background:#0a0805;border:1px solid #4a3d28;box-shadow:inset 0 1px 3px rgba(0,0,0,.9)}
.bar i{display:block;height:100%;width:0%;transition:width .16s ease;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -2px 3px rgba(0,0,0,.35)}
.bar.hp i{background:linear-gradient(180deg,var(--hp-1),var(--hp-2))}
.bar.mp i{background:linear-gradient(180deg,var(--mp-1),var(--mp-2))}
.bar.xp{height:8px}
.bar.xp i{background:linear-gradient(180deg,var(--xp-1),var(--xp-2))}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:10px;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000}
.bar.xp span{font-size:8px}

/* 左下角：小地图 */
.hud-minimap{position:absolute;left:10px;bottom:10px;z-index:24;padding:6px;border-radius:3px;
  background:linear-gradient(180deg,rgba(58,47,28,.94),rgba(16,12,7,.96));
  border:2px solid var(--bronze);box-shadow:0 4px 16px rgba(0,0,0,.8);
  display:flex;flex-direction:column;align-items:center;gap:3px}
.mm-frame{padding:3px;border-radius:2px;background:linear-gradient(160deg,#5a4626,#241b0d);
  border:2px solid var(--bronze);box-shadow:inset 0 0 0 1px rgba(0,0,0,.7)}
#minimap{display:block;border-radius:1px;background:#080b08}
.mm-label{font-size:10px;color:var(--bone-dim);letter-spacing:.2em;font-family:var(--serif)}

/* 右下角：命令卡 */
.hud-commands{position:absolute;right:10px;bottom:10px;z-index:24;padding:8px;border-radius:3px;
  background:linear-gradient(180deg,rgba(58,47,28,.94),rgba(16,12,7,.96));
  border:2px solid var(--bronze);box-shadow:0 4px 16px rgba(0,0,0,.8)}
.cc-grid{display:grid;grid-template-columns:repeat(4,64px);grid-auto-rows:56px;gap:4px}

/* 命令卡按钮 */
.cc-btn{position:relative;overflow:hidden;border-radius:2px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0 2px;
  background:linear-gradient(180deg,#3d3320,#1a140b 60%,#0e0a05);
  border:2px solid var(--bronze-dk);
  box-shadow:inset 0 1px 0 rgba(255,220,150,.22),inset 0 -2px 3px rgba(0,0,0,.6),0 1px 4px rgba(0,0,0,.6);
  color:var(--bone);font-family:var(--sans);transition:all .1s}
.cc-btn:hover{border-color:var(--gold);background:linear-gradient(180deg,#54441f,#241a0c)}
.cc-btn:active{transform:translateY(1px)}
.cc-btn .hk{position:absolute;top:1px;left:3px;font-size:9px;font-weight:700;
  color:var(--gold-lt);text-shadow:0 1px 2px #000;z-index:2}
.cc-btn .nm{display:block;font-size:9px;line-height:1;white-space:nowrap;
  word-break:keep-all;overflow:hidden;color:#d8d0bb;text-shadow:0 1px 2px #000}
.cc-btn.skill .nm{font-family:var(--serif);font-size:10px;color:#ffe6a8;letter-spacing:-1.2px}
.cc-btn.dash{border-color:#6b8a4a}
.cc-btn.dash .nm{color:#b9ffb0}
.cc-btn.toggle.on{border-color:var(--gold);
  background:linear-gradient(180deg,#6b5520,#3a2a0c);
  box-shadow:inset 0 0 12px rgba(255,210,74,.5),0 0 10px rgba(212,175,55,.4)}
.cc-btn.toggle.on .nm{color:#fff3c4;font-weight:700}
.cc-btn .cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.76);font-size:15px;color:#fff;font-family:var(--serif);z-index:3}
.cc-btn .cd.on{display:flex}
.cc-btn.disabled{opacity:.42;cursor:not-allowed}

/* ============ 消息 / 提示 ============ */
.msglog{position:absolute;left:10px;bottom:196px;width:min(340px,40vw);max-height:130px;overflow:hidden;
  padding:6px 10px;font-size:11px;line-height:1.5;z-index:18;
  display:flex;flex-direction:column-reverse;gap:1px;
  background:linear-gradient(180deg,rgba(20,16,9,.55),rgba(6,5,3,.72));
  border:1px solid rgba(74,61,40,.7);border-radius:2px;opacity:.92}
.msglog .m{color:var(--bone-dim);text-shadow:0 1px 2px #000}
.msglog .m.loot{color:#6fb6ff}
.msglog .m.skill{color:#c08cff}
.msglog .m.level{color:var(--gold-lt)}
.msglog .m.boss{color:#ff9a5a;font-weight:600}
.msglog .m.bad{color:#ff8070}
.interact-hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);
  background:rgba(10,8,5,.94);border:1px solid var(--bronze);border-radius:2px;
  padding:5px 18px;font-size:12px;color:var(--gold-lt);z-index:21;
  box-shadow:0 2px 12px rgba(0,0,0,.8)}
.interact-hint b{color:#fff}

.toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);
  background:linear-gradient(180deg,#3a2f1c,#120e07);border:2px solid var(--bronze);
  border-radius:3px;padding:9px 24px;font-family:var(--serif);font-size:15px;color:var(--gold-lt);
  text-shadow:0 1px 3px #000;z-index:300;box-shadow:0 6px 24px rgba(0,0,0,.85);
  animation:toastIn .2s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ============ 全屏 ============ */
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 35%,#1a1610 0%,#0a0907 62%,#040303 100%);
  z-index:50;overflow:auto;padding:24px}
.title-box{text-align:center;max-width:580px}
.game-title{font-family:var(--serif);font-size:min(54px,11vw);color:var(--gold-lt);
  letter-spacing:.16em;text-shadow:0 0 34px rgba(255,190,60,.45),0 4px 8px #000;line-height:1.2}
.game-sub{font-size:11px;letter-spacing:.42em;color:var(--bone-dim);margin:10px 0 34px}
.title-btns{display:flex;flex-direction:column;gap:12px;align-items:center}
.title-tip{margin-top:30px;font-size:11px;color:#6b6558;letter-spacing:.06em}

.big-btn{min-width:230px;padding:11px 26px;font-family:var(--serif);font-size:16px;
  color:var(--bone);background:linear-gradient(180deg,#3d3320,#181209);
  border:2px solid var(--bronze);border-radius:2px;cursor:pointer;letter-spacing:.14em;
  box-shadow:inset 0 1px 0 rgba(255,220,150,.2),0 3px 10px rgba(0,0,0,.65);transition:all .15s}
.big-btn:hover{border-color:var(--gold);color:var(--gold-lt);
  box-shadow:inset 0 1px 0 rgba(255,220,150,.3),0 0 20px rgba(212,175,55,.3)}
.big-btn.primary{background:linear-gradient(180deg,#6b5520,#2a1e0c);border-color:var(--gold)}
.big-btn:disabled{opacity:.35;cursor:not-allowed}

/* ============ 建角 ============ */
.create-wrap{width:min(940px,100%);padding:18px}
.panel-title{font-family:var(--serif);font-size:16px;color:var(--gold-lt);
  letter-spacing:.16em;margin:18px 0 10px;padding-bottom:6px;
  border-bottom:1px solid rgba(212,175,55,.28)}
.race-list,.class-list{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:linear-gradient(160deg,#2b2418,#15110b);border:2px solid #4a3d28;
  border-radius:3px;padding:12px 14px;cursor:pointer;transition:all .15s}
.card:hover{border-color:var(--bronze-lt);transform:translateY(-2px)}
.card.sel{border-color:var(--gold);box-shadow:0 0 22px rgba(212,175,55,.35);
  background:linear-gradient(160deg,#3d3320,#1e1710)}
.card h3{font-family:var(--serif);font-size:16px;color:var(--gold-lt);letter-spacing:.1em;margin-bottom:6px}
.card p{font-size:11px;color:var(--bone-dim);line-height:1.6}
.card .tag{display:inline-block;font-size:10px;padding:1px 7px;border:1px solid #4a3d28;
  border-radius:8px;margin:3px 3px 0 0;color:var(--bone-dim)}
.create-actions{display:flex;gap:12px;justify-content:center;margin-top:26px}

/* ============ 弹窗 ============ */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.75);z-index:70;
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal-frame{width:min(780px,100%);max-height:82vh;display:flex;flex-direction:column;
  background:linear-gradient(170deg,#312818,#17120a 55%,#0c0905);
  border:2px solid var(--bronze);border-radius:3px;
  box-shadow:0 0 0 1px rgba(212,175,55,.22),0 22px 64px rgba(0,0,0,.9)}
.modal-head{display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;border-bottom:1px solid rgba(212,175,55,.3);
  font-family:var(--serif);font-size:17px;color:var(--gold-lt);letter-spacing:.14em;
  background:linear-gradient(180deg,rgba(255,220,150,.06),transparent)}
.close-btn{background:none;border:1px solid #4a3d28;color:var(--bone-dim);
  width:26px;height:26px;border-radius:2px;cursor:pointer;font-size:13px}
.close-btn:hover{border-color:var(--gold);color:var(--gold-lt)}
.modal-body{padding:14px 16px;overflow:auto}
.modal-body::-webkit-scrollbar{width:8px}
.modal-body::-webkit-scrollbar-thumb{background:#4a3d28;border-radius:4px}

.bag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.bag-cell{aspect-ratio:1;border:2px solid #4a3d28;border-radius:2px;
  background:linear-gradient(180deg,#241d12,#0f0c07);cursor:pointer;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:10px;color:var(--bone-dim);transition:all .12s;overflow:hidden;padding:3px}
.bag-cell:hover{border-color:var(--gold);transform:translateY(-1px)}
.bag-cell .ic{font-size:18px;line-height:1}
.bag-cell .nm{font-size:9px;text-align:center;line-height:1.15;margin-top:2px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bag-cell.empty{opacity:.3;border-style:dashed;cursor:default}

.equip-wrap{display:grid;grid-template-columns:126px 1fr;gap:16px;margin-bottom:14px}
.equip-grid{display:grid;grid-template-columns:repeat(2,58px);gap:6px}
.equip-cell{width:58px;height:58px;border:2px solid #4a3d28;border-radius:2px;
  background:linear-gradient(180deg,#241d12,#0f0c07);display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:9px;color:var(--bone-dim);
  cursor:pointer;position:relative;overflow:hidden}
.equip-cell:hover{border-color:var(--gold)}
.equip-cell .ic{font-size:18px}
.stat-list{display:grid;grid-template-columns:repeat(2,1fr);gap:3px 16px;font-size:12px}
.stat-list .st{display:flex;justify-content:space-between;
  border-bottom:1px dotted rgba(184,173,147,.18);padding:2px 0}
.stat-list .st b{color:var(--gold-lt);font-weight:600}

.q-common{color:#c8c8c8}.q-uncommon{color:#3fd45a}.q-rare{color:#4a9eff}
.q-epic{color:#b45cff}.q-legendary{color:#ff9a2e}.q-mythic{color:#ff3b3b}

.tooltip{position:fixed;z-index:90;pointer-events:none;max-width:270px;
  background:linear-gradient(170deg,#312818,#120e08);border:2px solid var(--bronze);
  border-radius:2px;padding:9px 12px;font-size:12px;line-height:1.65;
  box-shadow:0 10px 28px rgba(0,0,0,.9)}
.tooltip h4{font-family:var(--serif);font-size:14px;margin-bottom:3px;letter-spacing:.06em}
.tooltip .tt-sub{font-size:10px;color:var(--bone-dim);margin-bottom:5px}
.tooltip .tt-stat{color:#7fd4ff}
.tooltip .tt-req{color:#ff6b5a;font-size:11px;margin-top:5px}
.tooltip .tt-cmp{color:#3fd45a;font-size:11px;margin-top:4px}
.tooltip .tt-up{color:#5fdc4a}
.tooltip .tt-down{color:#ff6b5a}
.tooltip .tt-cp{margin-top:6px;padding-top:5px;border-top:1px solid rgba(212,175,55,.3);
  font-size:12px;font-weight:700}
.bag-cell .up{position:absolute;top:0;right:1px;font-size:12px;color:#5fdc4a;
  text-shadow:0 0 6px rgba(95,220,74,.8),0 1px 2px #000;z-index:2}
.bag-cell .cp-mini{position:absolute;bottom:0;right:1px;font-size:8px;color:#ffd24a;opacity:.9}
.tooltip .tt-desc{color:var(--bone-dim);font-size:11px;margin-top:5px;
  border-top:1px dotted rgba(184,173,147,.25);padding-top:5px}

.skill-section{margin-bottom:16px}
.skill-section h4{font-family:var(--serif);color:var(--gold-lt);font-size:14px;
  letter-spacing:.12em;margin-bottom:8px}
.skill-row{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;
  border:1px solid #3a3020;border-radius:2px;margin-bottom:6px;
  background:linear-gradient(90deg,rgba(60,48,28,.5),transparent)}
.skill-row.learned{border-color:#4a6b3d}
.skill-row .sk-ic{width:36px;height:36px;border:1px solid var(--bronze);border-radius:2px;
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);
  font-size:13px;color:var(--gold-lt);flex-shrink:0;background:#1a140c}
.skill-row .sk-main{flex:1}
.skill-row .sk-name{font-family:var(--serif);font-size:14px;color:var(--bone)}
.skill-row .sk-name small{font-size:10px;color:var(--gold);margin-left:6px}
.skill-row .sk-desc{font-size:11px;color:var(--bone-dim);line-height:1.55;margin-top:2px}
.skill-row .sk-btn{padding:4px 10px;font-size:11px;background:linear-gradient(180deg,#3a3020,#181209);
  border:1px solid var(--bronze);border-radius:2px;color:var(--bone);cursor:pointer;white-space:nowrap}
.skill-row .sk-btn:hover{border-color:var(--gold);color:var(--gold-lt)}
.skill-row .sk-btn:disabled{opacity:.35;cursor:not-allowed}

.npc-list{display:flex;flex-direction:column;gap:8px}
.npc-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 12px;border:1px solid #3a3020;border-radius:2px;
  background:linear-gradient(90deg,rgba(60,48,28,.45),transparent)}
.npc-row .nr-name{font-family:var(--serif);font-size:14px;color:var(--gold-lt)}
.npc-row .nr-info{font-size:11px;color:var(--bone-dim)}
.npc-row button{padding:5px 14px;font-size:12px;background:linear-gradient(180deg,#3a3020,#181209);
  border:1px solid var(--bronze);border-radius:2px;color:var(--bone);cursor:pointer;white-space:nowrap}
.npc-row button:hover{border-color:var(--gold);color:var(--gold-lt)}
.npc-row button:disabled{opacity:.3;cursor:not-allowed}

/* 难度按钮 */
.diff-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.diff-card{padding:12px;border:2px solid #4a3d28;border-radius:3px;cursor:pointer;text-align:center;
  background:linear-gradient(180deg,#241d12,#0f0c07);transition:all .15s}
.diff-card:hover{border-color:var(--bronze-lt);transform:translateY(-2px)}
.diff-card .dc-name{font-family:var(--serif);font-size:18px;letter-spacing:.1em;margin-bottom:6px}
.diff-card .dc-info{font-size:10px;color:var(--bone-dim);line-height:1.6}
.diff-card .dc-req{font-size:10px;margin-top:5px;padding:2px 0;border-radius:8px}
.diff-card .dc-req.ok{color:#7fd4a8;background:rgba(60,160,100,.16)}
.diff-card .dc-req.low{color:#ff8a7a;background:rgba(180,60,40,.16)}
.room-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.room-btn{padding:10px;border:2px solid #4a3d28;border-radius:2px;cursor:pointer;
  background:linear-gradient(180deg,#241d12,#0f0c07);text-align:center}
.room-btn:hover{border-color:var(--gold)}
.room-btn.sel{border-color:var(--gold);box-shadow:0 0 14px rgba(212,175,55,.35)}
.room-btn .rb-name{font-family:var(--serif);font-size:14px;color:var(--gold-lt)}
.room-btn .rb-sub{font-size:10px;color:var(--bone-dim)}
.room-btn.locked{opacity:.35;cursor:not-allowed}

/* ============ 移动端 ============ */
#touch{position:absolute;inset:0;z-index:30;pointer-events:none}
.stick{position:absolute;width:118px;height:118px;border-radius:50%;
  border:2px solid rgba(212,175,55,.35);background:rgba(0,0,0,.3);
  pointer-events:auto;touch-action:none}
.stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;
  border-radius:50%;background:rgba(212,175,55,.42);border:1px solid var(--gold)}
#stickMove{left:16px;bottom:170px}
#stickAim{right:16px;bottom:170px}
.touch-btn{position:absolute;pointer-events:auto;width:52px;height:52px;border-radius:50%;
  background:rgba(30,24,14,.88);border:2px solid var(--bronze);color:var(--gold-lt);
  font-family:var(--serif);font-size:14px;cursor:pointer}
.touch-btn.atk{right:20px;bottom:96px;width:64px;height:64px;font-size:19px}
.touch-btn.s1{right:142px;bottom:158px}
.touch-btn.s2{right:142px;bottom:96px}
.touch-btn.s3{right:204px;bottom:124px}
.touch-btn.s4{right:80px;bottom:158px}

@media (max-width:1000px){
  .portrait-frame{width:58px;height:58px}
  .hp-info{min-width:150px}
  .p-stats{display:none}
  .cc-grid{grid-template-columns:repeat(4,46px);grid-auto-rows:32px}
  .cc-btn .nm{display:block;font-size:9px;line-height:1;white-space:nowrap;word-break:keep-all;overflow:hidden;color:#d8d0bb;text-shadow:0 1px 2px #000}
  #minimap{width:120px;height:90px}
  .room-name{font-size:15px}
  .msglog{bottom:170px;max-height:80px;width:200px}
}
@media (max-width:700px){
  .hud-minimap{display:none}
  .hud-portrait{transform:scale(.85);transform-origin:top left}
  .cc-grid{grid-template-columns:repeat(4,42px);grid-auto-rows:30px}
  .topbar-right .res-box{padding:3px 7px;font-size:12px}
  .topbar-right .res-box:nth-child(2){display:none}
}

/* ============================================================
   背包：工具栏 / 分页 / 堆叠
   ============================================================ */
.bag-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sm-btn{padding:5px 14px;font-size:12px;border-radius:2px;cursor:pointer;
  background:linear-gradient(180deg,#3a3020,#181209);border:1px solid var(--bronze);
  color:var(--bone);font-family:var(--sans)}
.sm-btn:hover{border-color:var(--gold);color:var(--gold-lt)}
.sm-btn.danger{border-color:#7a3b2b;color:#ff9a80}
.sm-btn.danger:hover{border-color:#c0503a;color:#ffb9a5}
.auto-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--bone-dim);cursor:pointer}
.auto-toggle input{accent-color:#d4af37;width:14px;height:14px}
.bag-count{margin-left:auto;font-size:12px;color:var(--gold-lt)}
.bag-pager{display:flex;align-items:center;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.pg-btn{width:30px;height:26px;font-size:12px;cursor:pointer;border-radius:2px;
  background:linear-gradient(180deg,#2b2418,#14100a);border:1px solid #4a3d28;color:var(--bone-dim)}
.pg-btn:hover{border-color:var(--bronze-lt);color:var(--bone)}
.pg-btn.on{border-color:var(--gold);color:#1a1206;font-weight:700;
  background:linear-gradient(180deg,#ffd24a,#b8891e)}
.pg-tip{margin-left:auto;font-size:10px;color:#6b6558}
.bag-cell .stack{position:absolute;bottom:1px;right:2px;font-size:10px;font-weight:700;
  color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000}
.bag-cell.potion{border-color:#3f6b4d}

/* ============================================================
   角色面板（仿参考图：装备栏 | 战力+主属性 | 属性分组）
   ============================================================ */
.char-panel{display:grid;grid-template-columns:276px 1fr 0.68fr;gap:14px;align-items:start}
.cp-col{background:linear-gradient(180deg,rgba(60,48,28,.42),rgba(12,9,5,.62));
  border:1px solid rgba(138,109,59,.55);border-radius:3px;padding:10px}
.col-title{font-family:var(--serif);font-size:13px;color:var(--gold-lt);letter-spacing:.18em;
  text-align:center;margin-bottom:8px;padding-bottom:5px;
  border-bottom:1px solid rgba(212,175,55,.28)}

/* 左：装备格 */
.eq-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.eq-slot{position:relative;aspect-ratio:1;border-radius:3px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:linear-gradient(160deg,#241d12,#0d0a06);border:2px solid #3a3020;
  transition:all .12s;overflow:hidden}
.eq-slot:hover{border-color:var(--gold);transform:translateY(-1px)}
.eq-lv{position:absolute;top:1px;left:4px;font-size:11px;color:#c9c2ad;text-shadow:0 1px 2px #000;font-weight:700}
.eq-ic{font-size:19px;line-height:1;color:#6b6455}
.eq-nm{font-size:10px;color:#8f8570;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-border-common{border-color:#8f8f8f}
.q-border-uncommon{border-color:#3fd45a;box-shadow:inset 0 0 10px rgba(63,212,90,.16)}
.q-border-rare{border-color:#4a9eff;box-shadow:inset 0 0 10px rgba(74,158,255,.18)}
.q-border-epic{border-color:#b45cff;box-shadow:inset 0 0 10px rgba(180,92,255,.2)}
.q-border-legendary{border-color:#ff9a2e;box-shadow:inset 0 0 12px rgba(255,154,46,.24)}
.q-border-mythic{border-color:#ff3b3b;box-shadow:inset 0 0 14px rgba(255,59,59,.3)}

/* 中：立绘 + 战力 */
.char-mid{display:flex;flex-direction:column;align-items:center;gap:10px}
.char-portrait{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;
  padding:8px 0 6px;border-radius:3px;
  background:radial-gradient(ellipse at 50% 62%,rgba(212,175,55,.16),rgba(0,0,0,.55) 72%)}
#charPortrait{display:block;filter:drop-shadow(0 6px 12px rgba(0,0,0,.75))}
.char-name{font-family:var(--serif);font-size:15px;color:var(--gold-lt);letter-spacing:.1em;
  text-shadow:0 1px 3px #000;margin-top:4px}
.char-lv{font-size:11px;color:#b8ad93}
.cp-block{width:100%;text-align:center;padding:8px 6px;border-radius:3px;
  background:linear-gradient(180deg,rgba(107,85,32,.35),rgba(0,0,0,.4));
  border:1px solid rgba(212,175,55,.38)}
.cp-label{font-size:10px;color:#b8ad93;letter-spacing:.3em}
.cp-big{font-family:var(--serif);font-size:30px;line-height:1.15;color:#ffd24a;
  text-shadow:0 0 18px rgba(255,200,70,.55),0 2px 4px #000}
.cp-sub{font-size:10px;color:#8f8570;margin-top:2px}
.cp-sub b{color:#e8e0cc}

.attr-list{width:100%;display:flex;flex-direction:column;gap:2px}
.attr-row{display:flex;align-items:center;gap:7px;padding:4px 8px;font-size:12px;
  background:linear-gradient(90deg,rgba(60,48,28,.38),transparent);border-radius:2px}
.attr-ic{color:#d4af37;font-size:9px}
.attr-n{color:#b8ad93;flex:1}
.attr-row b{color:#ffd98a;font-family:var(--serif);font-size:14px}
.xp-mini{width:100%;font-size:10px;color:#8f8570;text-align:center}

/* 右：属性分组 */
.s-group{margin-bottom:10px}
.s-title{font-family:var(--serif);font-size:12px;color:var(--gold-lt);letter-spacing:.2em;
  text-align:center;margin-bottom:5px;padding:3px 0;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,.16),transparent);
  border-top:1px solid rgba(212,175,55,.25);border-bottom:1px solid rgba(212,175,55,.25)}
.s-row{display:flex;justify-content:space-between;font-size:11.5px;padding:2px 4px;
  border-bottom:1px dotted rgba(184,173,147,.14)}
.s-row span{color:#9a907a}
.s-row b{color:#e8e0cc;font-weight:600}
.s-row b.hot{color:#ffb347}

/* 角色面板需要更宽的弹窗 */
.modal-frame{width:min(1000px,100%)}
@media (max-width:860px){
  .char-panel{grid-template-columns:1fr}
  .eq-grid{grid-template-columns:repeat(4,1fr)}
}

/* 装备图标精灵 */
.ic-sprite{display:inline-block;width:32px;height:32px;flex:0 0 auto;
  background-image:var(--icon-sheet);background-size:256px 32px;
  background-repeat:no-repeat;image-rendering:pixelated;vertical-align:middle}
.ic-sprite[data-i="0"]{background-position:0 0}
.ic-sprite[data-i="1"]{background-position:-32px 0}
.ic-sprite[data-i="2"]{background-position:-64px 0}
.ic-sprite[data-i="3"]{background-position:-96px 0}
.ic-sprite[data-i="4"]{background-position:-128px 0}
.ic-sprite[data-i="5"]{background-position:-160px 0}
.ic-sprite[data-i="6"]{background-position:-192px 0}
.ic-sprite[data-i="7"]{background-position:-224px 0}

/* 套装进度 */
.set-bar{height:8px;border-radius:4px;background:#0d0a06;border:1px solid #3a3020;
  overflow:hidden;margin:4px 0 5px}
.set-bar i{display:block;height:100%;transition:width .2s ease;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.set-count{font-size:11px;color:#9a907a;text-align:center;margin-bottom:5px}

/* 装备格图标放大 */
.char-left .ic-sprite{width:44px !important;height:44px !important;
  background-size:352px 44px !important}
.char-left .eq-nm{font-size:10px}

/* 技能图标（图标式按钮，名字走 tooltip） */
.cc-btn.skill{padding:0}
.cc-btn.skill .sk-ic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:40px;height:40px;display:block;background-repeat:no-repeat;
  image-rendering:pixelated;pointer-events:none}
.cc-btn.skill .nm{display:none}
.cc-btn.skill .hk{font-size:10px;top:1px;left:4px}
.cc-btn.skill .cd{font-size:16px}
.sk-ic-tag{display:inline-block;width:24px;height:24px;flex:0 0 auto;vertical-align:middle;
  background-image:var(--skill-sheet);background-size:576px 24px;
  background-repeat:no-repeat;image-rendering:pixelated}
.skill-row .sk-ic{background-image:var(--skill-sheet);background-size:624px 26px;
  background-position:0 0;width:36px;height:36px;image-rendering:pixelated}

/* 等级不足：红色蒙层 + 锁标 */
.bag-cell.locked{
  border-color:#7a2b2b !important;
  cursor:not-allowed;
}
.bag-cell.locked::after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:1px;
  background:
    repeating-linear-gradient(45deg,rgba(200,40,40,.18) 0 5px,rgba(120,20,20,.10) 5px 10px),
    linear-gradient(180deg,rgba(180,30,30,.42),rgba(90,10,10,.52));
  box-shadow:inset 0 0 12px rgba(255,40,40,.45);
}
.bag-cell.locked .ic-sprite{filter:grayscale(.85) brightness(.55) sepia(.35) hue-rotate(-28deg)}
.bag-cell.locked .nm{color:#ff8a7a !important;opacity:.75}
.bag-cell.locked .cp-mini{display:none}
.bag-cell .lock-tag{
  position:absolute;left:0;right:0;bottom:12px;text-align:center;z-index:3;
  font-size:9px;font-weight:700;color:#ffd0c8;
  text-shadow:0 1px 2px #000,0 0 5px rgba(255,40,40,.9);
  pointer-events:none;
}
.eq-slot.locked{position:relative}

/* 技能熟练度条 */
.prof-bar{position:relative;height:16px;margin-top:5px;border-radius:3px;overflow:hidden;
  background:#0d0a06;border:1px solid #3a3020}
.prof-bar i{display:block;height:100%;transition:width .2s ease;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.prof-bar span{position:absolute;inset:0;text-align:center;font-size:10px;line-height:16px;
  color:#fff;font-weight:700;text-shadow:0 1px 2px #000,0 0 4px #000;letter-spacing:.05em}

/* ============================================================
   锻造台 UI
   ============================================================ */
.forge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.forge-slot{position:relative;padding:8px 4px 6px;border-radius:3px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-height:92px;
  background:linear-gradient(160deg,#2a2214,#100c07);
  border:2px solid #3a3020;transition:all .12s}
.forge-slot:hover{border-color:var(--gold);transform:translateY(-2px);
  box-shadow:0 0 14px rgba(212,175,55,.35)}
.forge-slot.empty{opacity:.42;cursor:default;border-style:dashed}
.forge-slot.empty:hover{transform:none;border-color:#3a3020;box-shadow:none}
.fs-slot{font-size:9px;color:#8f8570;letter-spacing:.08em}
.fs-enh{position:absolute;top:2px;right:4px;font-size:11px;font-weight:700;color:#5fdc4a;
  text-shadow:0 1px 2px #000}
.fs-nm{font-size:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.enh-head{display:flex;align-items:center;gap:14px;padding:10px 12px;margin-bottom:12px;
  background:linear-gradient(90deg,rgba(107,85,32,.35),transparent);border-radius:3px;
  border-left:3px solid var(--gold)}
.enh-name{font-family:var(--serif);font-size:18px;letter-spacing:.05em}
.enh-sub{font-size:11px;color:#8f8570;margin-top:3px}
.enh-attrs{display:grid;grid-template-columns:repeat(2,1fr);gap:3px 18px;margin-bottom:12px}
.enh-attr{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 6px;
  border-bottom:1px dotted rgba(184,173,147,.16)}
.enh-attr span{color:#9a907a;flex:1}
.enh-attr i{color:#6b6558;font-style:normal}
.enh-attr b{color:#e8e0cc;font-weight:600;min-width:52px;text-align:right}
.enh-attr b.up{color:#5fdc4a}
.enh-lv{text-align:center;font-family:var(--serif);font-size:17px;color:var(--bone);
  padding:8px;margin-bottom:8px;background:rgba(0,0,0,.35);border-radius:3px}
.enh-line{display:flex;justify-content:space-between;font-size:13px;padding:5px 10px;
  border-bottom:1px dotted rgba(184,173,147,.14)}
.enh-line span{color:#9a907a}
.enh-line b{color:#e8e0cc}
.enh-line b.ok{color:#5fdc4a}
.enh-line b.warn{color:#ffb347}
.enh-line b.bad{color:#ff6b5a}
.enh-btns{display:flex;gap:10px;justify-content:center;margin-top:16px}
.enh-big{text-align:center;font-family:var(--serif);font-size:18px;padding:16px}
.sk-btn.lack{border-color:#7a3b2b;color:#ff9a80}
.sk-btn small{display:block;font-size:9px;opacity:.85}

/* 任务进度条 */
.q-bar{height:8px;margin:4px 0 3px;border-radius:4px;overflow:hidden;
  background:#0d0a06;border:1px solid #3a3020}
.q-bar i{display:block;height:100%;transition:width .2s ease;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}

/* 套装列表 */
.set-line{display:flex;align-items:center;gap:7px;padding:3px 6px;border-radius:2px;
  cursor:pointer;font-size:11.5px;transition:background .12s}
.set-line:hover{background:rgba(212,175,55,.12)}
.set-line.active{background:rgba(95,220,74,.10);border-left:2px solid #5fdc4a}
.set-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;
  box-shadow:0 0 6px currentColor}
.set-nm{flex:1;color:#b8ad93;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-cnt{font-weight:700;font-size:11px}
.set-active-tip{font-size:10px;color:#5fdc4a;margin-top:5px;padding:4px 6px;
  background:rgba(95,220,74,.10);border-radius:2px;line-height:1.5}
.set-head{padding:10px 12px;margin-bottom:4px;border-left:3px solid var(--gold);
  background:linear-gradient(90deg,rgba(107,85,32,.35),transparent);border-radius:3px}

/* ============================================================
   角色面板 V2：装备分列左右 + 特戒槽在中间下方
   ============================================================ */
.char-panel-v2{display:grid;grid-template-columns:104px 1fr 104px 1fr;gap:12px;align-items:start}
.cp-side{display:flex;flex-direction:column;gap:8px}
.side-title{font-family:var(--serif);font-size:11px;color:var(--gold-lt);letter-spacing:.2em;
  text-align:center;padding-bottom:4px;border-bottom:1px solid rgba(212,175,55,.25)}
.eq-v{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 3px 4px;border-radius:3px;cursor:pointer;
  background:linear-gradient(160deg,#241d12,#0d0a06);border:2px solid #3a3020;
  transition:all .12s}
.eq-v:hover{border-color:var(--gold);transform:translateY(-1px);
  box-shadow:0 0 12px rgba(212,175,55,.35)}
.eq-v .eq-lv{position:absolute;top:0;left:3px;font-size:10px;color:#c9c2ad;font-weight:700;
  text-shadow:0 1px 2px #000}
.eq-v .eq-nm{font-size:9px;color:#8f8570;max-width:100%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;text-align:center}

.cp-center{display:flex;flex-direction:column;align-items:center;gap:9px}
.socket-row{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:8px 6px;border-radius:3px;
  background:linear-gradient(180deg,rgba(107,85,32,.28),rgba(0,0,0,.3));
  border:1px solid rgba(212,175,55,.42)}
.socket-label{font-family:var(--serif);font-size:11px;color:var(--gold-lt);letter-spacing:.16em;
  writing-mode:vertical-rl;text-orientation:upright}
.socket-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;flex:1}
.socket-grid .eq-v{width:100%}

@media (max-width:1100px){
  .char-panel-v2{grid-template-columns:86px 1fr 86px;gap:8px}
  .char-panel-v2 .char-right{grid-column:1 / -1}
}

/* ============================================================
   右侧任务追踪
   ============================================================ */
#questTracker{position:absolute;right:10px;top:46%;transform:translateY(-50%);
  width:236px;z-index:23;border-radius:3px;overflow:hidden;
  background:linear-gradient(180deg,rgba(48,39,24,.94),rgba(12,9,5,.96));
  border:1px solid var(--bronze);box-shadow:0 4px 18px rgba(0,0,0,.75)}
.qt-head{display:flex;align-items:center;gap:6px;padding:6px 10px;cursor:pointer;
  font-family:var(--serif);font-size:13px;color:var(--gold-lt);letter-spacing:.1em;
  background:linear-gradient(180deg,rgba(212,175,55,.16),transparent);
  border-bottom:1px solid rgba(212,175,55,.28);user-select:none}
.qt-head:hover{background:linear-gradient(180deg,rgba(212,175,55,.26),transparent)}
.qt-head b{color:#ffd24a;font-size:12px}
.qt-head .qt-arr{margin-left:auto;font-size:10px;transition:transform .2s}
#questTracker.collapsed .qt-arr{transform:rotate(-90deg)}
#questTracker.collapsed .qt-body{display:none}
.qt-body{padding:6px 8px 8px;max-height:46vh;overflow:auto}
.qt-item{display:flex;align-items:center;gap:6px;padding:4px 2px;font-size:11.5px;
  border-bottom:1px dotted rgba(184,173,147,.14)}
.qt-item .qt-nm{flex:1;color:#c8bfa8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qt-item .qt-prog{font-size:10.5px;color:#8f8570;white-space:nowrap}
.qt-item.done .qt-nm{color:#5fdc4a}
.qt-item.done .qt-prog{color:#5fdc4a;font-weight:700}
.qt-item button{padding:2px 8px;font-size:10px;border-radius:2px;cursor:pointer;
  background:linear-gradient(180deg,#3a3020,#181209);border:1px solid var(--bronze);color:var(--bone)}
.qt-item button.claim{border-color:#6b8a4a;color:#b9ffb0}
.qt-item button:hover{border-color:var(--gold);color:var(--gold-lt)}
.qt-bar{height:5px;border-radius:3px;background:#0d0a06;overflow:hidden;margin:4px 2px 6px}
.qt-bar i{display:block;height:100%;background:linear-gradient(90deg,#c9a24a,#ffd24a)}
.qt-empty{font-size:11px;color:#6b6558;text-align:center;padding:8px 0}
.qt-actions{display:flex;gap:6px;margin-top:8px}
.qt-actions button{flex:1;padding:5px 0;font-size:11px;border-radius:2px;cursor:pointer;
  background:linear-gradient(180deg,#4a3d22,#1c1509);border:1px solid var(--gold);
  color:var(--gold-lt);font-family:var(--serif);letter-spacing:.06em}
.qt-actions button:hover{background:linear-gradient(180deg,#6b5520,#2a1e0c);color:#fff3c4}
.qt-actions button:disabled{opacity:.35;cursor:not-allowed}
@media (max-width:1100px){#questTracker{width:190px;font-size:11px}}
@media (max-width:820px){#questTracker{display:none}}

/* 战力对比 */
.cp-line{display:flex;justify-content:space-between;font-size:10px;color:#8f8570;margin-top:2px}
.cp-line b{font-size:11px}
.cp-bar{height:5px;border-radius:3px;background:#0d0a06;overflow:hidden;margin:5px 0 4px}
.cp-bar i{display:block;height:100%;transition:width .2s ease}

.codex-btn{padding:4px 10px;font-size:11px;border-radius:2px;cursor:pointer;font-family:var(--serif);
  background:linear-gradient(180deg,#3a3020,#14100a);border:1px solid var(--bronze);
  color:var(--bone);letter-spacing:.06em}
.codex-btn:hover{border-color:var(--gold);color:var(--gold-lt)}
.cx-row{display:flex;align-items:center;gap:8px;padding:5px 8px;font-size:12px;
  border-bottom:1px dotted rgba(184,173,147,.14)}
.cx-row .cx-nm{flex:1;color:#c8bfa8}
.cx-row .cx-cnt{font-weight:700;font-size:11px}
.cx-bar{height:7px;border-radius:4px;background:#0d0a06;overflow:hidden;margin:4px 0}
.cx-bar i{display:block;height:100%}
.cx-lv{font-family:var(--serif);font-size:13px;color:#ffd24a}

/* ============================================================
   选人页：角色头像 + 头像框
   ============================================================ */
.cls-portrait{position:relative;display:flex;align-items:flex-end;justify-content:center;
  height:150px;margin:-4px -6px 10px;border-radius:3px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 75%,rgba(212,175,55,.22),rgba(0,0,0,.6) 72%);
  border:2px solid var(--bronze);box-shadow:inset 0 0 18px rgba(0,0,0,.7)}
.cls-portrait::after{
  content:"";position:absolute;inset:3px;border:1px solid rgba(255,220,150,.22);
  border-radius:2px;pointer-events:none}
.cls-sprite{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
  width:96px;height:144px;display:block;
  background-image:var(--units-sheet);background-size:5376px 576px;
  background-repeat:no-repeat;image-rendering:pixelated;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.8))}
.cls-badge{position:absolute;top:6px;left:6px;width:40px;height:40px;display:block;
  background-image:var(--class-sheet);background-size:256px 64px;
  background-repeat:no-repeat;border-radius:50%;
  border:2px solid rgba(212,175,55,.7);box-shadow:0 2px 8px rgba(0,0,0,.7)}
.cls-name-plate{position:absolute;left:0;right:0;bottom:0;padding:3px 0;text-align:center;
  font-family:var(--serif);font-size:13px;color:#ffe6a8;letter-spacing:.18em;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.85));
  text-shadow:0 1px 3px #000}

/* 魔兽头像 */
.av-img{position:absolute;display:block;background-image:var(--avatar-sheet);
  background-repeat:no-repeat;image-rendering:auto}

/* 种族头像：固定 120x74，一格一张 */
.race-portrait{position:relative;width:120px;height:74px;margin:0 auto 8px;overflow:hidden;
  border-radius:2px;border:2px solid #4a3d28;background:#0b0d10}
.race-portrait .av-img{left:0;top:0;width:120px;height:74px;
  background-size:1440px 74px;
  background-position:calc(var(--ai,0) * -120px) 0}

/* 职业头像：固定 140x150，居中 */
.cls-portrait .av-img.big{left:50%;transform:translateX(-50%);bottom:0;top:auto;
  width:140px;height:150px;
  background-size:1680px 150px;
  background-position:calc(var(--ai,0) * -140px) 0}

</style>
</head>
<body>
<div id="app">

  <canvas id="view"></canvas>

  <!-- ================= HUD ================= -->
  <div id="hud" class="hidden">

    <!-- 顶部中：房间 -->
    <div class="topbar-left">
      <span class="room-name" id="roomName">贫瘠之地</span>
      <span class="room-sub" id="roomSub"></span>
    </div>

    <!-- 顶部右：资源 -->
    <div class="topbar-right">
      <div class="res-box"><i class="ic-gold">金</i><b id="goldVal">0</b></div>
      <div class="res-box"><i class="ic-cp">战</i><b id="cpVal">0</b></div>
      <div class="res-box"><i class="ic-gear">装</i><b id="gearVal">未集齐</b></div>
      <div class="res-box"><i class="ic-diff">难</i><b id="diffVal">简单</b></div>
      <button class="codex-btn" data-act="codexEquip">装备图鉴</button>
      <button class="codex-btn" data-act="codexCollect">收藏图鉴</button>
    </div>

    <!-- BOSS 血条 -->
    <div id="bossBar" class="boss-bar hidden">
      <div class="bb-name" id="bossName"></div>
      <div class="bb-track"><div class="bb-fill" id="bossFill"></div></div>
    </div>

    <!-- 左上角：头像 + 血蓝 -->
    <div class="hud-portrait">
      <div class="portrait-frame">
        <canvas id="portrait" width="80" height="80"></canvas>
        <div class="p-level" id="pLevel">1</div>
      </div>
      <div class="hp-info">
        <div class="p-name" id="pName">人族 · 战士</div>
        <div class="bar hp"><i id="hpFill"></i><span id="hpText">0/0</span></div>
        <div class="bar mp"><i id="mpFill"></i><span id="mpText">0/0</span></div>
        <div class="bar xp"><i id="xpFill"></i><span id="xpText">0%</span></div>
        <div class="p-stats" id="pStats"></div>
      </div>
    </div>

    <!-- 左下角：小地图 -->
    <div class="hud-minimap">
      <div class="mm-frame"><canvas id="minimap" width="168" height="126"></canvas></div>
      <div class="mm-label" id="mmLabel">城镇</div>
    </div>

    <!-- 右下角：命令卡 -->
    <div class="hud-commands">
      <div class="cc-grid" id="commandCard">
        <button class="cc-btn skill" data-skill="q"><span class="hk">Q</span><span class="sk-ic"></span><span class="nm">—</span><span class="cd"></span></button>
        <button class="cc-btn skill" data-skill="w"><span class="hk">W</span><span class="sk-ic"></span><span class="nm">—</span><span class="cd"></span></button>
        <button class="cc-btn skill" data-skill="e"><span class="hk">E</span><span class="sk-ic"></span><span class="nm">—</span><span class="cd"></span></button>
        <button class="cc-btn skill" data-skill="r"><span class="hk">R</span><span class="sk-ic"></span><span class="nm">—</span><span class="cd"></span></button>
        <button class="cc-btn skill dash" data-skill="d"><span class="hk">D</span><span class="sk-ic"></span><span class="nm">—</span><span class="cd"></span></button>
        <button class="cc-btn toggle" data-act="autoAtk"><span class="hk">A</span><span class="nm">自动攻击</span></button>
        <button class="cc-btn toggle" data-act="autoSkill"><span class="hk">S</span><span class="nm">自动技能</span></button>
        <button class="cc-btn" data-act="potion"><span class="hk">F</span><span class="nm">喝药</span></button>
        <button class="cc-btn" data-act="bag"><span class="hk">B</span><span class="nm">背包</span></button>
        <button class="cc-btn" data-act="char"><span class="hk">C</span><span class="nm">角色</span></button>
        <button class="cc-btn" data-act="skill"><span class="hk">K</span><span class="nm">技能</span></button>
        <button class="cc-btn" data-act="map"><span class="hk">M</span><span class="nm">传送/回城</span></button>
      </div>
    </div>

    <div id="questTracker" class="hidden"></div>
    <div class="msglog" id="msglog"></div>
    <div class="interact-hint hidden" id="interactHint"></div>
  </div>

  <!-- ================= 标题 ================= -->
  <div id="screen-title" class="screen">
    <div class="title-box">
      <div class="game-title">兽人永不为奴</div>
      <div class="game-sub">打怪 · 爆装 · 成长</div>
      <div class="title-btns">
        <button class="big-btn" id="btnContinue">继续游戏</button>
        <button class="big-btn primary" id="btnNew">新的征程</button>
        <button class="big-btn" id="btnImport">导入存档</button>
      </div>
      <div class="title-tip">WASD 移动 · 鼠标瞄准 · 左键攻击 · QWER 技能 · D 冲刺</div>
    </div>
  </div>

  <!-- ================= 建角 ================= -->
  <div id="screen-create" class="screen hidden">
    <div class="create-wrap">
      <h2 class="panel-title">选择你的种族</h2>
      <div class="race-list" id="raceList"></div>
      <h2 class="panel-title">选择你的职业</h2>
      <div class="class-list" id="classList"></div>
      <div class="create-actions">
        <button class="big-btn" id="btnBackTitle">返回</button>
        <button class="big-btn primary" id="btnStart">踏入战场</button>
      </div>
    </div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-frame">
      <div class="modal-head">
        <span id="modalTitle">背包</span>
        <button class="close-btn" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <div id="touch" class="hidden">
    <div class="stick" id="stickMove"><i></i></div>
    <div class="stick" id="stickAim"><i></i></div>
    <button class="touch-btn atk" id="tBtnAtk">⚔</button>
    <button class="touch-btn s1" id="tBtn1">Q</button>
    <button class="touch-btn s2" id="tBtn2">W</button>
    <button class="touch-btn s3" id="tBtn3">E</button>
    <button class="touch-btn s4" id="tBtn4">R</button>
  </div>
</div>

<script>
/* ===== js/core.js ===== */
/* ============================================================
   核心：全局状态 / 随机 / 属性计算 / 装备生成 / 存档
   ============================================================ */
'use strict';

const TOWN = 99;   // 城镇房间 id

const G = {
  screen: 'title',
  diff: 'normal',      // 本次进图的难度
  autoPickup: true,    // 全屏自动拾取
  autoSell: false,     // 自动出售低战力装备
  player: null,
  world: null,
  time: 0,
  paused: false,
  msgLog: [],
  lastTs: 0
};

/* ---------------- 工具 ---------------- */
const rnd = (a, b) => a + Math.random() * (b - a);
const rndInt = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist2 = (a, b) => { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; };
const dist = (a, b) => Math.sqrt(dist2(a, b));
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'k' : Math.round(n).toString();

function weightedPick(entries) { // [{key, weight}]
  let total = 0;
  for (const e of entries) total += e.weight;
  let r = Math.random() * total;
  for (const e of entries) { r -= e.weight; if (r <= 0) return e.key; }
  return entries[entries.length - 1].key;
}

/* ---------------- 玩家创建 ---------------- */
function createPlayer(raceKey, clsKey) {
  const race = DATA.RACES[raceKey], cls = DATA.CLASSES[clsKey];
  const p = {
    race: raceKey, cls: clsKey,
    level: 1, exp: 0, gold: 0,
    attrs: { str: 10, agi: 10, int: 10, vit: 10 },
    bonus: { str: 0, agi: 0, int: 0, vit: 0 },   // 属性书永久加成
    equip: {}, bag: [],
    skills: {}, active: [], passive: [],
    cd: {}, buffs: [], dots: [],
    hp: 0, mp: 0,
    x: 0, y: 0, r: 18, dir: 0,
    room: TOWN, unlocked: [0],
    materials: { iron:0, mithril:0, scale:0, shard:0, stone:0, protect:0, skillT:0, breakT:0 },
    skillProf: {}, firstKills: {}, codex: {}, ringDropAt: {},
    quests: [], questDone: 0,
    kills: 0, bossKills: 0,
    stats: {}
  };
  for (const k in race.mod) p.attrs[k] += race.mod[k];
  if (race.extra && race.extra.all) for (const k in p.attrs) p.attrs[k] += race.extra.all;
  // 初始技能：QWER 四个战斗技能 + D 位移，全部 1 级
  const km = cls.keymap;
  p.keymap = { q: km.q, w: km.w, e: km.e, r: km.r, d: km.d };
  p.active = [km.q, km.w, km.e, km.r];
  p.dash = km.d;
  [km.q, km.w, km.e, km.r, km.d].forEach(k => { p.skills[k] = 1; });
  // 第一个被动开局赠送，第二个要吃书
  const passives = cls.skills.filter(s => DATA.SKILLS[s].type === 'passive');
  p.skills[passives[0]] = 1;
  p.passive = [passives[0], null, null];
  recalcStats(p);
  p.hp = p.stats.hpMax; p.mp = p.stats.mpMax;
  return p;
}

/* ---------------- 属性计算 ---------------- */
function recalcStats(p) {
  const cls = DATA.CLASSES[p.cls], race = DATA.RACES[p.race];
  const bonus = race.extra || {};

  // 装备加成汇总
  const eq = { str:0, agi:0, int:0, vit:0, atk:0, spell:0, as:0, crit:0,
               critDmg:0, armor:0, hp:0, dodge:0, lifesteal:0, hit:0, mp:0, all:0 };
  for (const s in p.equip) {
    const it = p.equip[s]; if (!it) continue;
    const st = itemStats(it);
    for (const k in st) eq[k] = (eq[k] || 0) + st[k];
  }

  const baseAll = eq.all || 0;
  const A = {
    str: p.attrs.str + p.bonus.str + baseAll + eq.str,
    agi: p.attrs.agi + p.bonus.agi + baseAll + eq.agi,
    int: p.attrs.int + p.bonus.int + baseAll + eq.int,
    vit: p.attrs.vit + p.bonus.vit + baseAll + eq.vit
  };

  // 本命武器：武器种类与职业匹配 → 攻击加成 + 特效
  let weaponBonus = 0, weaponFx = 'slash';
  const wpn = p.equip.weapon;
  if (wpn && wpn.wtype && DATA.WEAPON_KINDS[wpn.wtype]) {
    const K = DATA.WEAPON_KINDS[wpn.wtype];
    weaponFx = K.fx;
    if (K.cls.includes(p.cls)) weaponBonus = K.bonus;
  }

  // 特戒效果（强化会放大）
  const RFX = { expBonus:0, goldBonus:0, lifesteal:0, cleave:0, critDmg:0, dropBonus:0, revive:0, summon:0, gather:0 };
  for (const sk of DATA.RING_SLOTS.map(x => x.slot).concat(['ring','trinket'])) {
    const it = p.equip[sk];
    if (it && it.effect) {
      const m = enhMul(it);
      for (const k in it.effect) RFX[k] = (RFX[k] || 0) + it.effect[k] * m;
    }
  }

  // 套装：主属性加成
  const SB = setBonus(p);
  if (SB.pct) A[SB.primary] = Math.round(A[SB.primary] * (1 + SB.pct));
  if (SB.flat) A[SB.primary] += SB.flat;

  // 被动技能
  const pas = { hpPct:0, atkPct:0, spellPct:0, crit:0, critDmg:0, asPct:0, killMana:0, killAs:0 };
  for (const k of p.passive) {
    if (!k) continue;
    const sp = DATA.SKILLS[k].passive; if (!sp) continue;
    const lv = p.skills[k] || 1, mul = 1 + (lv - 1) * 0.2;
    for (const f in sp) pas[f] = (pas[f] || 0) + sp[f] * mul;
  }

  // Buff 加成
  const bf = { dr:0, atkPct:0, asPct:0, invis:0 };
  for (const b of p.buffs) {
    if (b.dr) bf.dr = Math.max(bf.dr, b.dr);
    if (b.atkPct) bf.atkPct += b.atkPct;
    if (b.asPct) bf.asPct += b.asPct;
  }

  const isMagic = p.cls === 'mage';
  const power =
    (isMagic
      ? cls.base.spell + (p.level - 1) * cls.growth.spell + A.int * 2.5 + eq.spell
      : cls.base.atk + (p.level - 1) * cls.growth.atk +
        (cls.primary === 'str' ? A.str : A.agi) * 2 + eq.atk)
    * (1 + (isMagic ? pas.spellPct : 0))
    * (1 + pas.atkPct + bf.atkPct)
    * (1 + weaponBonus);

  // 兽族狂暴
  let berserk = 0;
  if (bonus.berserk) {
    const hpMaxTmp = (cls.base.hp + (p.level - 1) * cls.growth.hp + A.vit * 6 + p.level * 10) * (1 + pas.hpPct);
    if (p.hp / hpMaxTmp < 0.3) berserk = bonus.berserk;
  }

  const armor = cls.base.armor + (p.level - 1) * cls.growth.armor + eq.armor;
  const dr = armor / (armor + 1000 + p.level * 50) + (bonus.dr || 0);

  const baseHp = cls.base.hp + (p.level - 1) * cls.growth.hp + A.vit * 6 + p.level * 10;
  const baseMp = cls.base.mp + (p.level - 1) * cls.growth.mp + A.int * 4 + p.level * 8;

  p.stats = {
    A,
    hpMax: Math.floor(baseHp * (1 + pas.hpPct) + eq.hp),
    mpMax: Math.floor(baseMp + eq.mp),
    power: power * (1 + berserk),
    isMagic,
    skillMul: 1 + SB.skillDmg,
    weaponBonus, weaponFx, wtype: wpn ? wpn.wtype : null,
    setBonus: SB,
    as: cls.base.as * (1 + A.agi / 500) * (1 + pas.asPct + bf.asPct),
    crit: clamp(0.05 + A.agi / 2000 + eq.crit + pas.crit + (bonus.crit || 0), 0, 0.6),
    critDmg: 1.5 + eq.critDmg + pas.critDmg + RFX.critDmg,
    dodge: clamp(A.agi / 3000 + eq.dodge, 0, 0.3),
    armor,
    dr: clamp(dr + bf.dr, 0, 0.85),
    lifesteal: (eq.lifesteal || 0) + RFX.lifesteal,
    mpRegen: (0.02 * (1 + (bonus.mpRegen || 0))),
    goldBonus: (bonus.goldBonus || 0) + RFX.goldBonus,
    expBonus: (race.expBonus || 0) + RFX.expBonus,
    cleave: RFX.cleave,
    dropBonus: RFX.dropBonus,
    revive: RFX.revive,
    summonRing: RFX.summon,
    gatherRing: RFX.gather,
    killMana: pas.killMana || 0,
    killAs: pas.killAs || 0,
    invis: bf.invis
  };
  p.hp = Math.min(p.hp, p.stats.hpMax);
  p.mp = Math.min(p.mp, p.stats.mpMax);
}

/* ---------------- 经验 / 升级 ---------------- */
function gainExp(p, amount) {
  amount = Math.floor(amount * (1 + (p.stats.expBonus || 0)));
  if (p.level >= DATA.MAX_LEVEL) return 0;
  p.exp += amount;
  let ups = 0;
  while (p.level < DATA.MAX_LEVEL && p.exp >= DATA.expForLevel(p.level)) {
    p.exp -= DATA.expForLevel(p.level);
    p.level++; ups++;
    const cls = DATA.CLASSES[p.cls];
    p.attrs.str += 1; p.attrs.agi += 1; p.attrs.int += 1; p.attrs.vit += 1;
    p.attrs[cls.primary] += 2;
  }
  if (ups) {
    recalcStats(p);
    p.hp = p.stats.hpMax; p.mp = p.stats.mpMax;
    logMsg(`⚔ 升级！当前等级 ${p.level}`, 'level');
    toast(`升级到 ${p.level} 级`);
  }
  return ups;
}

/* ---------------- 装备生成 ---------------- */
function rollQuality(weightTable) {
  const entries = Object.entries(weightTable).map(([key, weight]) => ({ key, weight }));
  return weightedPick(entries);
}

function affixValue(affix, ilvl, qMult) {
  const base = rnd(affix.v[0], affix.v[1]);
  const v = base * (1 + ilvl * affix.scale * 0.06) * qMult;
  return affix.pct ? Math.round(v * 100) / 10000 : Math.max(1, Math.round(v));
}

function makeItem(slot, ilvl, forcedQuality, preferMagic) {
  const qKey = forcedQuality || rollQuality(
    Object.fromEntries(DATA.QUALITY.map(q => [q.key, q.weight]))
  );
  const q = DATA.QUALITY.find(x => x.key === qKey);
  let wtype = null, names;
  if (slot === 'weapon') {
    const cls = G.player ? G.player.cls : 'warrior';
    const own = Object.keys(DATA.WEAPON_KINDS).filter(k => DATA.WEAPON_KINDS[k].cls.includes(cls));
    const all = Object.keys(DATA.WEAPON_KINDS);
    wtype = (Math.random() < 0.88 && own.length) ? pick(own) : pick(all);
    names = DATA.WEAPON_KINDS[wtype].names;
  } else {
    names = DATA.ITEM_NAMES[slot] || DATA.ITEM_NAMES.ring;
  }
  const baseName = pick(names);
  const PREFIX = { common:'', uncommon:'精铁', rare:'秘银', epic:'符文', legendary:'龙鳞', mythic:'虚空' };
  const name = PREFIX[qKey] + baseName;

  const stats = {};
  // 主属性
  const mainStat = DATA.AFFIXES.find(a => ['atk','spell','armor','hp'].includes(a.key));
  let mainKey;
  if (slot === 'weapon') {
    // 85% 概率偏向玩家自己的伤害类型，避免掉一堆用不上的武器
    const magic = (preferMagic === undefined) ? (Math.random() < 0.5) : preferMagic;
    mainKey = (Math.random() < 0.85) ? (magic ? 'spell' : 'atk') : (magic ? 'atk' : 'spell');
  } else {
    mainKey = pick(['armor','hp','atk','spell']);
  }
  const mainAffix = DATA.AFFIXES.find(a => a.key === mainKey);
  stats[mainKey] = Math.max(1, Math.round(
    rnd(mainAffix.v[0], mainAffix.v[1]) * (1 + ilvl * 0.09) * q.mult
  ));

  // 随机词条
  const pool = DATA.AFFIXES.filter(a => a.key !== mainKey);
  for (let i = 0; i < q.affixes; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    const a = pool.splice(idx, 1)[0];
    if (!a) break;
    stats[a.key] = (stats[a.key] || 0) + affixValue(a, ilvl, q.mult);
  }

  return {
    id: 'i' + Math.random().toString(36).slice(2, 9),
    slot, qKey, qName: q.name, color: q.color,
    name, ilvl, reqLv: Math.max(1, ilvl + q.lvl), stats, enh: 0,
    ...(wtype ? { wtype } : {})
  };
}

/* ---------------- 装备 / 背包 ---------------- */
const BAG_PAGE_SIZE = 24;
const BAG_PAGES = 6;              // 6 页 = 144 格
const BAG_MAX = BAG_PAGE_SIZE * BAG_PAGES;

function equipItem(p, item) {
  normalizeSlot(item);
  if (item.reqLv > p.level) { toast('等级不足，无法装备'); return false; }
  // 特戒槽只能放对应的特戒
  if (item.slot && item.slot.indexOf('ring_') === 0) {
    if (!item.ringKey || ringSlotOf(item.ringKey) !== item.slot) {
      toast('这枚戒指不能放进该特戒槽'); return false;
    }
  }
  // 特戒不能塞进普通槽
  if (item.ringKey && (!item.slot || item.slot.indexOf('ring_') !== 0)) {
    item.slot = ringSlotOf(item.ringKey);   // 自动归位
  }
  const old = p.equip[item.slot] || null;
  p.equip[item.slot] = item;
  removeFromBag(p, item);
  if (old) addToBag(p, old);
  recalcStats(p);
  return true;
}

function unequipItem(p, slot) {
  const it = p.equip[slot]; if (!it) return;
  if (p.bag.length >= BAG_MAX) { toast('背包已满'); return; }
  delete p.equip[slot];
  addToBag(p, it);
  recalcStats(p);
}

function addToBag(p, item) {
  // 药水堆叠
  if (item.type === 'potion') {
    const ex = p.bag.find(x => x.type === 'potion' && x.key === item.key);
    if (ex) { ex.count = (ex.count || 1) + (item.count || 1); return true; }
    item.count = item.count || 1;
  }
  if (p.bag.length >= BAG_MAX) { toast('背包已满，已自动折现'); p.gold += 20; return false; }
  p.bag.push(item); return true;
}

/* 消耗一瓶药 */
function consumePotion(p, key, n) {
  const i = p.bag.findIndex(x => x.type === 'potion' && x.key === key);
  if (i < 0) return 0;
  const it = p.bag[i];
  const take = Math.min(n || 1, it.count || 1);
  it.count -= take;
  if (it.count <= 0) p.bag.splice(i, 1);
  return take;
}

function removeFromBag(p, item) {
  const i = p.bag.findIndex(x => x.id === item.id);
  if (i >= 0) p.bag.splice(i, 1);
}

function sellItem(p, item) {
  normalizeSlot(item);
  if (item.ringKey) { toast('特戒无法分解或出售'); return; }
  const q = DATA.QUALITY.find(x => x.key === item.qKey);
  const idx = DATA.QUALITY.indexOf(q);
  const price = Math.round((20 + item.ilvl * 8) * Math.pow(2.2, idx));
  p.gold += price;
  removeFromBag(p, item);
  toast(`出售 ${item.name} +${price} 金`);
}

/* 安全取槽位名（旧存档可能残留已删除的槽位） */
function slotName(sk) {
  const d = DATA.SLOTS[sk];
  return d ? d.name : '未知部位';
}

/* 惰性修正：单个物品的非法槽位就地纠正 */
function normalizeSlot(it) {
  if (!it || it.type === 'potion') return it;
  if (it.ringKey) {
    const s = ringSlotOf(it.ringKey);
    if (s && it.slot !== s) it.slot = s;
    return it;
  }
  // 普通装备不允许占用特戒槽
  if (!DATA.SLOTS[it.slot] || String(it.slot).indexOf('ring_') === 0) it.slot = 'ring';
  return it;
}

/* 迁移：把槽位已不存在的装备归位 */
function migrateItemSlots(p) {
  const valid = sk => !!DATA.SLOTS[sk];
  const isRingSlot = sk => DATA.RING_SLOTS.some(r => r.slot === sk);
  const fix = it => {
    if (!it) return it;
    // 特戒 → 归到自己的专属槽
    if (it.ringKey && ringSlotOf(it.ringKey)) { it.slot = ringSlotOf(it.ringKey); return it; }
    // 普通装备却占着特戒槽 → 退回普通戒指槽
    if (isRingSlot(it.slot)) { it.slot = 'ring'; return it; }
    if (!valid(it.slot)) it.slot = 'ring';
    return it;
  };
  for (const sk of Object.keys(p.equip)) {
    const it = p.equip[sk];
    if (!it) continue;
    if (!valid(sk)) {
      delete p.equip[sk];
      fix(it);
      if (valid(it.slot) && !p.equip[it.slot]) p.equip[it.slot] = it;
      else addToBag(p, it);
    } else fix(it);
  }
  (p.bag || []).forEach(it => { if (it.type !== 'potion') { fix(it); normalizeSlot(it); } });
  p.bag = (p.bag || []).filter(it => it.type === 'potion' || valid(it.slot));
}

/* ---------------- 新手初始装备 ---------------- */
function giveStarterGear(p) {
  const magic = p.cls === 'mage';
  for (const sk in DATA.SLOTS) {
    if (DATA.RING_SLOTS.some(r => r.slot === sk)) continue;
    if (p.equip[sk]) continue;
    p.equip[sk] = makeItem(sk, 3, 'uncommon', magic);
  }
  recalcStats(p);
  p.hp = p.stats.hpMax;
  p.mp = p.stats.mpMax;
  return p;
}

/* ---------------- 装备强化 ---------------- */
function enhMul(it) { return DATA.ENHANCE.statMul(it.enh || 0); }

/* 强化后的词条（不修改原数据） */
function itemStats(it) {
  const m = enhMul(it);
  if (m === 1) return it.stats;
  const out = {};
  for (const k in it.stats) out[k] = it.stats[k] * m;
  return out;
}

/* 强化一次，返回 {ok, msg} */
function enhanceItem(p, it, useProtect) {
  const lv = it.enh || 0;
  if (lv >= DATA.ENHANCE.max) return { ok:false, msg:'已达到 +15 上限' };
  const gold = DATA.ENHANCE.goldCost(lv);
  const stone = DATA.ENHANCE.stoneCost(lv);
  if (p.gold < gold) return { ok:false, msg:`金币不足（需 ${fmt(gold)}）` };
  if ((p.materials.stone || 0) < stone) return { ok:false, msg:`强化石不足（需 ${stone}）` };
  if (useProtect && (p.materials.protect || 0) < 1) return { ok:false, msg:'没有强化保护券' };

  p.gold -= gold;
  p.materials.stone -= stone;
  if (useProtect) p.materials.protect -= 1;

  const rate = DATA.ENHANCE.rate(lv);
  if (Math.random() < rate) {
    it.enh = lv + 1;
    return { ok:true, msg:`强化成功 → +${it.enh}`, up:true };
  }
  // 失败：+11 起掉一级，保护券可免
  if (!useProtect && lv >= 11) {
    it.enh = Math.max(0, lv - DATA.ENHANCE.failDrop(lv));
    return { ok:true, msg:`强化失败，降至 +${it.enh}`, down:true };
  }
  return { ok:true, msg:'强化失败，等级不变', down:true };
}

/* ---------------- 技能强化 ---------------- */
function skillProfOf(p, key) {
  if (!p.skillProf) p.skillProf = {};
  if (!p.skillProf[key]) p.skillProf[key] = { tier:1, prof:0 };
  return p.skillProf[key];
}

/* 杀怪加熟练度（该职业全部主动技能） */
function gainSkillProf(p, amount) {
  const cls = DATA.CLASSES[p.cls];
  const keys = [cls.keymap.q, cls.keymap.w, cls.keymap.e, cls.keymap.r, cls.keymap.d];
  for (const k of keys) {
    const sp = skillProfOf(p, k);
    if (sp.tier >= DATA.SKILL_TIER.maxTier && sp.prof >= DATA.SKILL_TIER.needProf) continue;
    sp.prof = Math.min(DATA.SKILL_TIER.needProf, sp.prof + amount);
  }
}

/* 用券加熟练度 */
function useSkillTicket(p) {
  const cls = DATA.CLASSES[p.cls];
  const keys = [cls.keymap.q, cls.keymap.w, cls.keymap.e, cls.keymap.r, cls.keymap.d];
  const target = keys.map(k => skillProfOf(p, k))
    .find(x => x.tier < DATA.SKILL_TIER.maxTier && x.prof < DATA.SKILL_TIER.needProf);
  if (!target) return false;
  target.prof = Math.min(DATA.SKILL_TIER.needProf, target.prof + DATA.SKILL_TIER.ticketProf);
  return true;
}

/* 突破：满级熟练 + 突破券 */
function breakthrough(p, key) {
  const sp = skillProfOf(p, key);
  if (sp.tier >= DATA.SKILL_TIER.maxTier) return 'max';
  if (sp.prof < DATA.SKILL_TIER.needProf) return 'prof';
  if ((p.materials.breakT || 0) < 1) return 'ticket';
  p.materials.breakT -= 1;
  sp.tier += 1;
  sp.prof = 0;
  return 'ok';
}

/* 特戒颜色（按效果区分） */
const RING_COLORS = {
  expBonus:  {color:'#b45cff', name:'经验'},
  goldBonus: {color:'#ffd24a', name:'金币'},
  lifesteal: {color:'#ff4a4a', name:'吸血'},
  cleave:    {color:'#4ad4ff', name:'切割'},
  critDmg:   {color:'#ff9a2e', name:'暴伤'},
  dropBonus: {color:'#3fd45a', name:'掉落'}
};
/* 特戒效果的中文描述表（杜绝英文 key 泄漏到界面） */
const EFFECT_INFO = {
  expBonus:  {name:'经验', pct:true,  desc: v => `经验获取 +${(v*100).toFixed(1)}%`},
  goldBonus: {name:'金币', pct:true,  desc: v => `金币获取 +${(v*100).toFixed(1)}%`},
  lifesteal: {name:'吸血', pct:true,  desc: v => `吸血 +${(v*100).toFixed(1)}%`},
  cleave:    {name:'切割', pct:true,  desc: v => `攻击时 ${(v*100).toFixed(1)}% 概率削掉目标 5% 最大生命`},
  critDmg:   {name:'暴伤', pct:true,  desc: v => `暴击伤害 +${(v*100).toFixed(1)}%`},
  dropBonus: {name:'掉落', pct:true,  desc: v => `掉落品质 +${(v*100).toFixed(1)}%`},
  revive:    {name:'复活', pct:false, desc: () => '死亡后原地复活，恢复 50% 生命（120 秒冷却）'},
  summon:    {name:'召唤', pct:false, desc: () => '召唤灵兽协助战斗，自动攻击附近怪物'},
  gather:    {name:'聚合', pct:false, desc: () => '按 X 键把全图怪物吸到身边（30 秒冷却）'}
};

/* 把一条效果翻成中文 */
function effectText(k, v) {
  const info = EFFECT_INFO[k];
  if (!info) return '未知效果';
  return info.desc(v === undefined ? 1 : v);
}
/* 只要效果名 */
function effectName(k) {
  const info = EFFECT_INFO[k];
  return info ? info.name : '未知';
}
/* 该效果是否受强化影响（数值型才受） */
function effectScales(k) {
  const info = EFFECT_INFO[k];
  return !!(info && info.pct);
}

function ringColor(it) {
  if (!it || !it.effect) return '#ff9a2e';
  const k = Object.keys(it.effect)[0];
  return (RING_COLORS[k] || {}).color || '#ff9a2e';
}

/* 通用：按定义造一枚特戒 */
function ringSlotOf(ringKey) {
  const d = DATA.RING_SLOTS.find(x => x.ring === ringKey);
  return d ? d.slot : null;
}

function makeRing(def, idSuffix) {
  const k = Object.keys(def.effect)[0];
  const ringKey = idSuffix;
  return {
    id: 'ring_' + (idSuffix || k) + '_' + Date.now() + Math.floor(Math.random() * 1000),
    type: 'ring', qKey: 'legendary', qName: '传说',
    color: (RING_COLORS[k] || {}).color || def.color || '#ff9a2e',
    name: def.name, ilvl: 20, reqLv: 1, enh: 0,
    ringKey, slot: ringSlotOf(ringKey) || 'ring_exp',
    setKey: null, stats: {}, effect: def.effect, effectDesc: def.desc || '', bound: true
  };
}

/* 放进第一个空的特戒槽，满了就进背包 */
function equipSpecialRing(p, ring) {
  const slot = ringSlotOf(ring.ringKey);
  if (slot) {
    ring.slot = slot;
    p.equip[slot] = ring;          // 同槽已被占则替换（旧的回背包）
    recalcStats(p);
    return ring;
  }
  addToBag(p, ring);
  recalcStats(p);
  return ring;
}

/* 把 6 枚特戒各发一枚到背包（已拥有则不重复发） */
function grantAllRings(p) {
  let n = 0;
  Object.keys(DATA.SPECIAL_RINGS).forEach(k => {
    const def = DATA.SPECIAL_RINGS[k];
    const slot = ringSlotOf(k);
    // 已装备 / 背包里已有同款 → 跳过
    if (p.equip[slot]) return;
    if ((p.bag || []).some(it => it.ringKey === k)) return;
    const ring = makeRing(def, k);
    addToBag(p, ring);
    n++;
  });
  return n;
}

/* 复活消耗 */
function consumeRevive(p) {
  const RFX = p.stats && p.stats.revive ? p.stats.revive : 0;
  if (!RFX) return false;
  const now = Date.now();
  if (p.reviveCd && now < p.reviveCd) return false;
  p.reviveCd = now + 120000;
  return true;
}

/* ---------------- BOSS 首杀戒指 ---------------- */
function grantFirstKillRing(p, bossKey) {
  const def = DATA.BOSS_RINGS[bossKey];
  if (!def) return null;
  if (!p.firstKills) p.firstKills = {};
  if (p.firstKills[bossKey]) return null;
  p.firstKills[bossKey] = true;
  const ringDef = DATA.SPECIAL_RINGS[def.ring];
  const ring = makeRing(ringDef, def.ring);
  equipSpecialRing(p, ring);
  return ring;
}

/* ---------------- 职业套装 ---------------- */
function setBonus(p) {
  const sets = DATA.SETS[p.cls];
  if (!sets) return { count: 0, pct: 0, flat: 0, skillDmg: 0, all: {} };
  const counts = {};
  for (const sl of DATA.SET_SLOTS) {
    const it = p.equip[sl];
    if (it && it.setKey) counts[it.setKey] = (counts[it.setKey] || 0) + 1;
  }
  let best = null, bestN = 0;
  for (const k in counts) {
    if (counts[k] > bestN) { bestN = counts[k]; best = sets.find(x => x.key === k); }
  }
  if (!best) return { count: 0, pct: 0, flat: 0, skillDmg: 0, all: counts };
  return {
    count: bestN, key: best.key, name: best.name, color: best.color,
    primary: best.primary, total: 6, all: counts,
    pct: bestN >= 4 ? best.b4.pct : 0,
    flat: bestN >= 6 ? best.b6.flat : 0,
    skillDmg: bestN >= 6 ? best.b6.skillDmg : 0
  };
}

/* 某套装的件数 */
function setCount(p, key) {
  let n = 0;
  for (const sl of DATA.SET_SLOTS) {
    const it = p.equip[sl];
    if (it && it.setKey === key) n++;
  }
  return n;
}

/* ---------------- 战力值 ---------------- */
const PCT_AFFIX = ['as','crit','critDmg','dodge','lifesteal','hit'];

/* 单件装备的战力贡献 */
function itemPower(it) {
  if (!it) return 0;
  const qi = DATA.QUALITY.findIndex(q => q.key === it.qKey);
  const m = enhMul(it);
  let v = ((qi + 1) * 30 + it.ilvl * 6) * m + (it.enh || 0) * 22;
  for (const k in it.stats) {
    const s = it.stats[k] * m;
    v += PCT_AFFIX.includes(k) ? s * 600 : s * 1.6;
  }
  return v;
}

/* 装备总战力 */
function gearPower(p) {
  let v = 0;
  for (const sl in DATA.SLOTS) v += itemPower(p.equip[sl]);
  return v;
}

/* 角色总战力：装备 + 技能 + 等级 + 属性书 */
function combatPower(p) {
  let sp = 0;
  for (const k in p.skills) sp += (p.skills[k] || 0) * 26;
  const book = (p.bonus.str + p.bonus.agi + p.bonus.int + p.bonus.vit) * 12;
  return Math.round(gearPower(p) + sp + p.level * 18 + book);
}

/* 换装后的战力变化（正数=更强） */
function equipDeltaPower(p, item) {
  if (!item || item.type === 'potion') return 0;
  const before = gearPower(p);
  const cur = p.equip[item.slot];
  p.equip[item.slot] = item;
  const after = gearPower(p);
  if (cur) p.equip[item.slot] = cur; else delete p.equip[item.slot];
  return Math.round(after - before);
}

/* 该装备是否不如身上的（可以卖） */
function isWorseThanEquipped(p, it) {
  if (!it || it.type === 'potion') return false;
  normalizeSlot(it);
  if (it.ringKey) return false;            // 特戒永远保留
  const cur = p.equip[it.slot];
  if (!cur) return false;                 // 空槽位别卖
  return equipDeltaPower(p, it) <= 0;
}

/* 一键出售劣质装备，返回卖出件数与金币 */
function sellAllWorse(p) {
  let n = 0, gold = 0;
  for (let i = p.bag.length - 1; i >= 0; i--) {
    const it = p.bag[i];
    if (!isWorseThanEquipped(p, it)) continue;
    const q = DATA.QUALITY.find(x => x.key === it.qKey);
    const price = Math.round((20 + it.ilvl * 8) * Math.pow(2.2, DATA.QUALITY.indexOf(q)));
    p.gold += price; gold += price; n++;
    p.bag.splice(i, 1);
  }
  return { n, gold };
}

/* ---------------- 收藏图鉴 ---------------- */
function codexKills(p, bossKey) { return (p.codex && p.codex[bossKey]) || 0; }
function codexLevel(kills) {
  let lv = 0;
  for (const L of DATA.CODEX_LEVELS) if (kills >= L.kills) lv = L.lv;
  return lv;
}
function codexBonus(p, roomId) {
  const bossKey = DATA.ROOMS[roomId] && DATA.ROOMS[roomId].boss;
  if (!bossKey) return { dmg:0, drop:0, exp:0, lv:0 };
  const lv = codexLevel(codexKills(p, bossKey));
  if (!lv) return { dmg:0, drop:0, exp:0, lv:0 };
  const L = DATA.CODEX_LEVELS[lv - 1];
  return { dmg:L.dmg, drop:L.drop, exp:L.exp, lv };
}
/* 当前地图图鉴加成（战斗里用） */
function currentCodex(p) {
  if (!G.world || G.world.isTown) return { dmg:0, drop:0, exp:0, lv:0 };
  return codexBonus(p, G.world.roomId);
}

/* ---------------- 推荐战力 ---------------- */
function requiredCP(room, diff) {
  const base = DATA.ROOM_CP[room] || 3000;
  const mul = DATA.DIFF_CP_MUL[diff] || 1;
  return Math.round(base * mul);
}

/* 战力评估 */
function cpVerdict(have, need) {
  const r = need > 0 ? have / need : 2;
  if (r >= 1.00) return { key:'ok',   color:'#5fdc4a', text:'战力充足', ratio:r };
  if (r >= 0.80) return { key:'near', color:'#ffb347', text:'勉强能打', ratio:r };
  if (r >= 0.55) return { key:'low',  color:'#ff8a5a', text:'战力偏低', ratio:r };
  return           { key:'bad',  color:'#ff5a4a', text:'战力严重不足', ratio:r };
}

/* ---------------- 装备达成度 ---------------- */
/* 返回 { filled, minIdx, avgIdx, score, tierName } */
function gearTier(p) {
  const slots = DATA.LOOT_SLOTS;
  let filled = 0, minIdx = 99, sum = 0, score = 0;
  for (const sl of slots) {
    const it = p.equip[sl];
    if (it) {
      const qi = DATA.QUALITY.findIndex(q => q.key === it.qKey);
      filled++;
      minIdx = Math.min(minIdx, qi);
      sum += qi;
      score += (qi + 1) * 12 + it.ilvl * 2;
    }
  }
  if (filled === 0) return { filled: 0, minIdx: -1, avgIdx: -1, score: 0, tierName: '无装备' };
  const avgIdx = sum / filled;
  const tierName = filled === slots.length && minIdx >= 0
    ? DATA.QUALITY[minIdx].name
    : '未集齐';
  return { filled, minIdx, avgIdx, score, tierName };
}

/* 难度是否"装备够格"：返回 'ok' | 'low' | 'high' */
function diffReadiness(p, diffKey) {
  const gt = gearTier(p);
  if (gt.filled < DATA.LOOT_SLOTS.length) return 'low';
  const g = gt.minIdx;
  if (diffKey === 'normal') return g >= 1 ? 'ok' : 'low';
  if (diffKey === 'hard')   return g >= 2 ? 'ok' : 'low';
  if (diffKey === 'hell')   return g >= 3 ? 'ok' : 'low';
  return 'ok';
}

/* ---------------- 技能 ---------------- */
function learnSkill(p, key) {
  const sp = DATA.SKILLS[key];
  if (!sp || sp.cls !== p.cls) return false;
  if (!p.skills[key]) { p.skills[key] = 1; return 'new'; }
  if (p.skills[key] >= 5) return 'max';
  p.skills[key]++; recalcStats(p); return 'up';
}

function skillLevel(p, key) { return p.skills[key] || 0; }

/* ---------------- 存档 ---------------- */
const THEME = (typeof window !== 'undefined' && window.__THEME) || 'classic';
const SAVE_KEY = 'wow_like_save_v1_' + THEME;
const LEGACY_KEY = 'wow_like_save_v1';

/* 老存档迁移：经典版首次运行把旧 key 的内容搬过来 */
function migrateLegacySave() {
  try {
    if (THEME !== 'classic') return;
    if (localStorage.getItem(SAVE_KEY)) return;
    const old = localStorage.getItem(LEGACY_KEY);
    if (old) localStorage.setItem(SAVE_KEY, old);
  } catch (_) {}
}
migrateLegacySave();

function saveGame() {
  if (!G.player) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 1, diff: G.diff, player: G.player, savedAt: Date.now()
    }));
    return true;
  } catch (e) { console.error(e); return false; }
}

function loadGameData(raw) {
  try {
    const d = typeof raw === 'string' ? JSON.parse(raw) : raw;
    if (!d || !d.player) return null;
    return d;
  } catch (e) { return null; }
}

function loadGame() {
  const raw = localStorage.getItem(SAVE_KEY);
  const d = loadGameData(raw);
  if (!d) return false;
  G.diff = d.diff || 'normal';
  G.player = d.player;
  G.player.buffs = []; G.player.dots = []; G.player.cd = {};
  // 兼容：补齐缺失字段
  G.player.unlocked = G.player.unlocked || [0];
  if (!G.player.keymap) {
    const km = DATA.CLASSES[G.player.cls].keymap;
    G.player.keymap = { q: km.q, w: km.w, e: km.e, r: km.r, d: km.d };
    G.player.active = [km.q, km.w, km.e, km.r];
    G.player.dash = km.d;
  }
  G.player.kills = G.player.kills || 0;
  G.player.materials = G.player.materials || { iron:0, mithril:0, scale:0, shard:0 };
  // 旧存档迁移：单个 quest → 数组
  if (G.player.quest && !Array.isArray(G.player.quests)) {
    G.player.quests = [G.player.quest];
  }
  G.player.quests = G.player.quests || [];
  delete G.player.quest;
  G.player.questDone = G.player.questDone || 0;
  G.player.bagPage = G.player.bagPage || 0;
  G.player.skillProf = G.player.skillProf || {};
  G.player.firstKills = G.player.firstKills || {};
  G.player.codex = G.player.codex || {};
  G.player.ringDropAt = G.player.ringDropAt || {};
  // 迁移：旧 ring2~ring5 → 新专属槽
  ['ring2','ring3','ring4','ring5'].forEach(old => {
    const it = G.player.equip[old];
    if (it && it.ringKey) {
      delete G.player.equip[old];
      const slot = ringSlotOf(it.ringKey);
      if (slot && !G.player.equip[slot]) G.player.equip[slot] = it;
    } else if (it) delete G.player.equip[old];
  });
  if (!G.player.materials) G.player.materials = {};
  ['stone','protect','skillT','breakT'].forEach(k => { G.player.materials[k] = G.player.materials[k] || 0; });
  (G.player.bag || []).forEach(it => { if (it.type === 'potion' && !it.count) it.count = 1; });
  G.player.bossKills = G.player.bossKills || 0;
  migrateItemSlots(G.player);
  recalcStats(G.player);
  return true;
}

function hasSave() { return !!localStorage.getItem(SAVE_KEY); }
function clearSave() { localStorage.removeItem(SAVE_KEY); }

function exportSave() {
  saveGame();
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) return;
  const blob = new Blob([raw], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `我的第一款游戏_存档_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importSave(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const d = loadGameData(e.target.result);
    if (!d) { toast('存档文件无效'); return; }
    localStorage.setItem(SAVE_KEY, JSON.stringify(d));
    if (loadGame()) { toast('存档已导入'); startGame(); }
  };
  reader.readAsText(file);
}

/* ---------------- 消息 ---------------- */
function logMsg(text, type) {
  G.msgLog.push({ text, type: type || 'info', t: G.time });
  if (G.msgLog.length > 60) G.msgLog.shift();
}
