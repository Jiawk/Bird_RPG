<script>
/* ===== js/combat.js ===== */
/* ============================================================
   战斗：伤害计算 / 普通攻击 / 技能释放 / 掉落
   ============================================================ */
'use strict';

const TIMERS = [];

function schedule(delay, fn) { TIMERS.push({ t: delay, fn }); }
function updateTimers(dt) {
  for (let i = TIMERS.length - 1; i >= 0; i--) {
    TIMERS[i].t -= dt;
    if (TIMERS[i].t <= 0) { const f = TIMERS[i].fn; TIMERS.splice(i, 1); f(); }
  }
}

/* ---------------- 伤害 ---------------- */
function damageMonster(m, amount, type, isDot) {
  if (!m.alive) return 0;
  const p = G.player;
  let dmg = amount;
  let crit = false;

  if (!isDot) {
    crit = p._forceCrit || Math.random() < p.stats.crit;
    p._forceCrit = false;
    if (crit) dmg *= p.stats.critDmg;
  }
  dmg = Math.max(1, Math.round(dmg));
  m.hp -= dmg;
  m.hitFlash = 0.12;

  if (!isDot) {
    floatText(m.x, m.y - m.r - 6,
      (crit ? '✦' : '') + dmg,
      crit ? '#ffd24a' : (type === 'skill' ? '#7fd4ff' : '#ffffff'),
      crit ? 22 : 16);
  }
  if (p.stats.lifesteal > 0 && !isDot) {
    const heal = Math.round(dmg * p.stats.lifesteal);
    if (heal > 0) { p.hp = Math.min(p.stats.hpMax, p.hp + heal); floatText(p.x, p.y - 30, '+' + heal, '#5fd45f', 14); }
  }
  if (m.hp <= 0) monsterDie(m);
  return dmg;
}

function damagePlayer(amount, source) {
  const p = G.player;
  if (p.stats.invis > 0) return;
  if (Math.random() < p.stats.dodge) {
    floatText(p.x, p.y - 34, '闪避', '#9fe6b8', 15);
    return;
  }
  const dmg = Math.max(1, Math.round(amount * (1 - p.stats.dr)));
  p.hp -= dmg;
  floatText(p.x, p.y - 34, '-' + dmg, '#ff5a40', 17);
  burst(p.x, p.y, '#ff5a40', 4, 90);
  if (p.hp <= 0) playerDie();
}

function playerDie() {
  const p = G.player;
  if (p.dead) return;          // 防止一帧多次触发

  // 复活之戒
  if (consumeRevive(p)) {
    p.hp = Math.round(p.stats.hpMax * 0.5);
    p.mp = Math.round(p.stats.mpMax * 0.5);
    p.stats.invis = 3;
    floatText(p.x, p.y - 40, '复活！', '#f7e26b', 22);
    toast('✨ 复活之戒生效：原地复活（50% 生命）');
    logMsg('✨ 复活之戒触发', 'level');
    spawnVfx(p.x, p.y, '#f7e26b', 140, 'aoe', 0.8);
    return;
  }

  p.dead = true;
  if (G.tower && G.tower.active) { G.tower.active = false; G.tower.floor = 1; }
  p.hp = 0;
  logMsg('☠ 你倒下了……返回城镇', 'bad');
  toast('你被击败了，返回城镇');
  const lost = Math.floor(p.gold * 0.1);
  p.gold -= lost;
  if (lost > 0) logMsg(`损失金币 ${lost}`, 'bad');
  setTimeout(() => { p.dead = false; p.hp = p.stats.hpMax; p.mp = p.stats.mpMax; enterRoom(TOWN); }, 900);
}

/* ---------------- 普通攻击 ---------------- */
function playerAttack() {
  const p = G.player;
  if (!p || p.attackCd > 0) return;
  const atkSpeed = p.stats.as;
  p.attackCd = 1 / atkSpeed;
  p.attackAnim = 0.18;

  const w = G.world;
  const range = p.cls === 'warrior' || p.cls === 'assassin' ? 78 : 420;
  const ang = p.dir;

  // 找到朝向扇区内最近的怪
  let target = null, best = Infinity;
  for (const m of w.monsters) {
    if (!m.alive) continue;
    const d = dist(p, m);
    if (d > range + m.r) continue;
    const a = Math.atan2(m.y - p.y, m.x - p.x);
    let da = Math.abs(normalizeAngle(a - ang));
    if (da > 0.7 && d > 60) continue;
    if (d < best) { best = d; target = m; }
  }

  if (p.stats.isMagic || p.cls === 'archer') {
    // 远程：发射投射物
    w.projectiles.push({
      x: p.x + Math.cos(ang) * 22, y: p.y + Math.sin(ang) * 22,
      vx: Math.cos(ang) * 520, vy: Math.sin(ang) * 520,
      life: 0.9, dead: false, pierce: false, dmg: p.stats.power,
      color: p.stats.weaponFx === 'arrow' ? '#d8f0ff'
           : (p.stats.weaponFx === 'spell' ? '#9f7fff' : '#ffe08a'),
      shape: p.stats.weaponFx === 'arrow' ? 'arrow' : (p.stats.weaponFx === 'spell' ? 'orb' : 'bolt'),
      hitSet: new Set(), isSkill: false
    });
    if (!target) { /* 空放 */ }
  } else if (target) {
    // 近战：直接判定
    damageMonster(target, p.stats.power, 'melee');
    burst(target.x, target.y, '#ffd24a', 5, 120);
  }
}

function normalizeAngle(a) {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}

/* ---------------- 技能释放 ---------------- */
function castSkill(idx) {
  const p = G.player;
  castSkillImpl(p.active[idx]);
}

/* 按 QWERD 键位释放 */
function castSkillKey(k) {
  const p = G.player;
  if (!p) return;
  const key = (k === 'd') ? p.dash : (p.keymap ? p.keymap[k] : null);
  if (key) castSkillImpl(key);
}

const FX_OF = { melee:1, dash:1, proj:0, aoe:0, trap:2, buff:2, hit:2 };

function spawnVfx(x, y, color, radius, kind, life) {
  const w = G.world; if (!w) return;
  if (!w.vfx) w.vfx = [];
  w.vfx.push({
    x, y, color, r: radius || 90, kind: kind || 'aoe',
    fx: FX_OF[kind] !== undefined ? FX_OF[kind] : 0,
    t: 0, life: life || 0.55
  });
}

function castSkillImpl(key) {
  const p = G.player;
  if (!key) return;
  // 施法特效（冷却中不触发）
  const _sp = DATA.SKILLS[key];
  if (_sp && (p.cd[key] || 0) <= 0) {
    spawnVfx(p.x, p.y, _sp.color || '#ffd24a', _sp.radius || 90, _sp.kind);
  }
  const sp = DATA.SKILLS[key];
  if (!sp || sp.type !== 'active') return;
  const lv = p.skills[key] || 1;
  const mul = 1 + (lv - 1) * 0.2;
  const cd = p.cd[key] || 0;
  if (cd > 0) { toast(`${sp.name} 冷却中 ${cd.toFixed(1)}s`); return; }
  if (p.mp < (sp.cost || 0)) { toast('法力不足'); return; }
  p.mp -= sp.cost || 0;
  p.cd[key] = sp.cd;
  p.castAnim = 0.2;

  const w = G.world;
  const ang = p.dir;

  switch (sp.kind) {
    case 'aoe': {
      const hits = sp.hits || 1;
      for (let h = 0; h < hits; h++) {
        schedule(h * 0.28, () => {
          burst(p.x, p.y, '#ffb347', 14, 220);
          for (const m of w.monsters) {
            if (!m.alive) continue;
            if (dist(p, m) <= sp.radius * 32 + m.r) {
              damageMonster(m, p.stats.power * (p.stats.skillMul || 1) * sp.dmg * mul, 'skill');
              if (sp.freeze) m.frozen = Math.max(m.frozen, sp.freeze);
              if (sp.root) m.root = Math.max(m.root, sp.root);
            }
          }
        });
      }
      break;
    }
    case 'melee': {
      for (const m of w.monsters) {
        if (!m.alive) continue;
        const d = dist(p, m);
        if (d > sp.range * 32 + m.r) continue;
        const a = Math.atan2(m.y - p.y, m.x - p.x);
        if (Math.abs(normalizeAngle(a - ang)) > sp.arc / 2) continue;
        damageMonster(m, p.stats.power * (p.stats.skillMul || 1) * sp.dmg * mul, 'skill');
        if (sp.poison) m.poison = { dps: sp.poison.dps * mul, t: sp.poison.dur };
      }
      burst(p.x + Math.cos(ang) * 40, p.y + Math.sin(ang) * 40, '#b45cff', 10, 180);
      break;
    }
    case 'proj': {
      const count = sp.count || 1;
      for (let i = 0; i < count; i++) {
        const off = count === 1 ? 0 : (i - (count - 1) / 2) * (sp.spread || 0);
        const a = ang + off;
        w.projectiles.push({
          x: p.x + Math.cos(a) * 22, y: p.y + Math.sin(a) * 22,
          vx: Math.cos(a) * (sp.speed * 32), vy: Math.sin(a) * (sp.speed * 32),
          life: 1.2, dead: false, pierce: !!sp.pierce,
          dmg: p.stats.power * (p.stats.skillMul || 1) * sp.dmg * mul,
          color: p.cls === 'mage' ? '#ff8a3d' : '#a8ffb0',
          burn: sp.burn ? { dps: sp.burn.dps * mul, dur: sp.burn.dur } : null,
          hitSet: new Set(), isSkill: true
        });
      }
      break;
    }
    case 'dash': {
      const target = nearestMonster(600);
      const a = target ? Math.atan2(target.y - p.y, target.x - p.x) : ang;
      const d = sp.range ? sp.range * 32 : 200;
      p.x += Math.cos(a) * d; p.y += Math.sin(a) * d;
      if (target) {
        damageMonster(target, p.stats.power * (p.stats.skillMul || 1) * sp.dmg * mul, 'skill');
        if (sp.stun) target.stun = Math.max(target.stun, sp.stun);
      }
      burst(p.x, p.y, '#ffd24a', 12, 200);
      break;
    }
    case 'blink': {
      const d = sp.dist * 32;
      const a = (p.cls === 'archer') ? ang + Math.PI : ang;
      p.x += Math.cos(a) * d; p.y += Math.sin(a) * d;
      p.x = clamp(p.x, p.r, w.W - p.r); p.y = clamp(p.y, p.r, w.H - p.r);
      burst(p.x, p.y, '#7fd4ff', 14, 200);
      break;
    }
    case 'buff': {
      p.buffs.push({ ...sp.buff, t: sp.buff.dur });
      if (sp.buff.invis) p.stats.invis = sp.buff.dur;
      if (sp.buff.nextCrit) p._forceCrit = true;
      recalcStats(p);
      burst(p.x, p.y, '#9fe6b8', 12, 160);
      break;
    }
    case 'trap': {
      w.traps.push({ x: p.x, y: p.y, r: sp.radius * 32, life: 30, armed: 0.4,
                     dmg: p.stats.power * (p.stats.skillMul || 1) * sp.dmg * mul, root: sp.root, dead: false });
      break;
    }
  }
  logMsg(`✦ 释放 ${sp.name}`, 'skill');
}

function nearestMonster(maxDist) {
  const p = G.player; let best = null, bd = maxDist;
  for (const m of G.world.monsters) {
    if (!m.alive) continue;
    const d = dist(p, m);
    if (d < bd) { bd = d; best = m; }
  }
  return best;
}

function onProjectileHit(pr, m) {
  const p = G.player;
  let dmg = pr.dmg;
  if (p._forceCrit) { m.hp -= 1; }
  damageMonster(m, dmg, 'skill');
  if (pr.burn) m.burn = { dps: pr.burn.dps, t: pr.burn.dur };
  burst(m.x, m.y, pr.color, 6, 130);
}

function triggerTrap(t, m) {
  t.dead = true;
  for (const mm of G.world.monsters) {
    if (!mm.alive) continue;
    if (dist2(t, mm) < (t.r + mm.r) * (t.r + mm.r)) {
      damageMonster(mm, t.dmg, 'skill');
      mm.root = Math.max(mm.root, t.root);
    }
  }
  burst(t.x, t.y, '#7fd4ff', 16, 220);
}

/* ---------------- 怪物死亡 / 掉落 ---------------- */
function monsterDie(m) {
  if (!m.alive) return;
  m.alive = false;
  const p = G.player;
  burst(m.x, m.y, m.color, m.isBoss ? 30 : 10, m.isBoss ? 300 : 160);
  p.kills++;
  if (m.isBoss) {
    p.bossKills++;
    logMsg(`★ 击杀 BOSS：${m.name}`, 'boss');
    toast(`击杀 ${m.name}！`);
  }
  gainExp(p, m.exp);

  // 击杀回蓝 / 击杀加速
  if (p.stats.killMana) p.mp = Math.min(p.stats.mpMax, p.mp + p.stats.mpMax * p.stats.killMana);
  if (p.stats.killAs) { p.buffs.push({ asPct: p.stats.killAs, t: 3 }); recalcStats(p); }

  onMonsterKilled(m);
  dropLoot(m);
}

function dropLoot(m) {
  const w = G.world, p = G.player;
  const d = DATA.DIFFICULTY[G.diff];
  const dropMul = d.dropMul;
  const ilvl = m.level;

  const push = (obj) => {
    const a = Math.random() * Math.PI * 2, r = rnd(10, 46);
    w.drops.push({ x: m.x + Math.cos(a) * r, y: m.y + Math.sin(a) * r, life: 45, taken: false, ...obj });
  };

  // 金币
  if (Math.random() < (m.isBoss ? 1 : 0.8)) {
    let g = Math.round(rnd(m.gold[0], m.gold[1]) * dropMul * (1 + p.stats.goldBonus));
    push({ type: 'gold', gold: g, color: '#ffd24a', label: `${g} 金` });
  }
  // 装备
  const eqChance = (m.isBoss ? 1 : 0.35) * dropMul;
  if (Math.random() < eqChance) {
    const slot = pick(Object.keys(DATA.SLOTS));
    const q = m.isBoss
      ? rollQuality(DATA.BOSS_WEIGHTS)
      : rollQuality(Object.fromEntries(DATA.QUALITY.map(x => [x.key, x.weight])));
    push({ type: 'item', item: makeItem(slot, ilvl, q, p.stats.isMagic), color: DATA.QUALITY.find(x => x.key === q).color });
  }
  // 技能书
  const bookChance = (m.isBoss ? 0.30 : 0.02) * dropMul;
  if (Math.random() < bookChance) {
    const mySkills = DATA.CLASSES[p.cls].skills;
    const pool = mySkills.filter(k => (p.skills[k] || 0) < 5);
    if (pool.length) {
      const k = pick(pool);
      push({ type: 'skillbook', skill: k, color: '#b45cff', label: DATA.SKILLS[k].name });
    }
  }
  // 属性书
  const attrChance = (m.isBoss ? 0.15 : 0.01) * dropMul;
  if (Math.random() < attrChance) {
    const k = pick(['str', 'agi', 'int']);
    push({ type: 'attrbook', stat: k, color: DATA.BOOKS[k].color, label: DATA.BOOKS[k].name });
  }
  // 药水
  if (Math.random() < (m.isBoss ? 1 : 0.15)) {
    push({ type: 'potion', potion: pick(DATA.POTIONS), color: '#5fd45f' });
  }
}

function pickupDrop(d) {
  const p = G.player;
  d.taken = true;
  if (d.type === 'gold') {
    p.gold += d.gold;
    floatText(d.x, d.y - 10, `+${d.gold} 金`, '#ffd24a', 15);
  } else if (d.type === 'item') {
    // 自动出售：比身上差的直接折现
    if (G.autoSell && isWorseThanEquipped(p, d.item)) {
      const q = DATA.QUALITY.find(x => x.key === d.item.qKey);
      const price = Math.round((20 + d.item.ilvl * 8) * Math.pow(2.2, DATA.QUALITY.indexOf(q)));
      p.gold += price;
      floatText(d.x, d.y - 10, `+${price} 金`, '#ffd24a', 12);
      return;
    }
    const dCP = equipDeltaPower(p, d.item);
    if (addToBag(p, d.item)) {
      logMsg(`拾取 [${d.item.qName}] ${d.item.name}${dCP>0?' ▲战力+'+dCP:''}`, 'loot');
      floatText(d.x, d.y - 10, d.item.name, d.item.color, 14);
    }
  } else if (d.type === 'skillbook') {
    const r = learnSkill(p, d.skill);
    if (r === 'new') { toast(`学会新技能：${DATA.SKILLS[d.skill].name}`); logMsg(`学会技能 ${DATA.SKILLS[d.skill].name}`, 'skill'); }
    else if (r === 'up') { toast(`${DATA.SKILLS[d.skill].name} 升级！`); }
    else toast('技能已满级');
  } else if (d.type === 'attrbook') {
    p.bonus[d.stat] = (p.bonus[d.stat] || 0) + 1;
    recalcStats(p);
    toast(`${DATA.BOOKS[d.stat].name} 使用：${d.stat.toUpperCase()} +1`);
    logMsg(`永久属性提升：${d.stat.toUpperCase()} +1`, 'level');
  } else if (d.type === 'potion') {
    addToBag(p, { ...d.potion, type: 'potion', count: 1 });
    floatText(d.x, d.y - 10, d.potion.name, '#9fe6b8', 13);
  }
}

</script>
<script>
/* ===== js/render.js ===== */
/* ============================================================
   渲染：2.5D 俯视（魔兽争霸3 视角：Y 轴压缩 + 单位站立 + 纵深排序）
   ============================================================ */
'use strict';

const CV = document.getElementById('view');
const CTX = CV.getContext('2d');
const MMC = document.getElementById('minimap');
const MMX = MMC.getContext('2d');
const PRT = document.getElementById('portrait');
const PRX = PRT.getContext('2d');

let VW = 0, VH = 0, DPR = 1;
const CAM = { x: 0, y: 0 };

/* 2.5D：地面 Y 轴压缩比（越小越"躺平"，越大越俯视） */
const YS = 0.70;
/* 单位"站立"高度系数 */
const HS = 1.05;

function resizeCanvas() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth; VH = window.innerHeight;
  CV.width = VW * DPR; CV.height = VH * DPR;
  CV.style.width = VW + 'px'; CV.style.height = VH + 'px';
  CTX.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function updateCamera() {
  const w = G.world, p = G.player;
  if (!w || !p) return;
  const wH = w.H * YS;
  let tx = p.x - VW / 2;
  let ty = p.y - (VH / YS) / 2;
  tx = (w.W <= VW) ? (w.W - VW) / 2 : clamp(tx, 0, w.W - VW);
  ty = (wH <= VH) ? (w.H - VH / YS) / 2 : clamp(ty, 0, w.H - VH / YS);
  CAM.x += (tx - CAM.x) * 0.18;
  CAM.y += (ty - CAM.y) * 0.18;
}

/* RMXP 行走图：行 0=下 1=左 2=右 3=上，列 0~3 为走路帧 */
function dirRow(a) {
  const c = Math.cos(a), sn = Math.sin(a);
  if (Math.abs(c) > Math.abs(sn)) return c > 0 ? 2 : 1;
  return sn > 0 ? 0 : 3;
}
function walkFrame(t, moving, speed) {
  return moving ? (Math.floor(t * (speed || 7)) % 4) : 0;
}

/* 世界 → 屏幕 */
const px = x => x - CAM.x;
const py = y => (y - CAM.y) * YS;

/* ---------------- 主渲染 ---------------- */
function render() {
  const w = G.world, p = G.player;
  CTX.clearRect(0, 0, VW, VH);
  if (!w || !p) return;

  drawGround(w);
  drawProps(w);
  drawWalls(w);

  // 纵深排序：y 小的先画
  const list = [];
  for (const d of w.drops) list.push({ y: d.y, f: () => drawDrop(d) });
  for (const t of w.traps) list.push({ y: t.y, f: () => drawTrap(t) });
  for (const n of w.npcs) list.push({ y: n.y, f: () => drawNPC(n) });
  for (const m of w.monsters) if (m.alive) list.push({ y: m.y, f: () => drawMonster(m) });
  list.push({ y: p.y, f: () => drawPlayer(p) });
  list.sort((a, b) => a.y - b.y);
  for (const it of list) it.f();

  // 技能特效
  drawVfx(w);

  // 飞行物画在最上层
  for (const pr of w.projectiles) drawProjectile(pr);

  // 粒子
  for (const pt of w.particles) {
    CTX.globalAlpha = Math.max(0, pt.t / 0.6);
    CTX.fillStyle = pt.color;
    CTX.beginPath(); CTX.arc(px(pt.x), py(pt.y) - 14, pt.r, 0, 6.283); CTX.fill();
  }
  CTX.globalAlpha = 1;

  // 飘字
  for (const f of w.floats) {
    CTX.globalAlpha = clamp(f.t / 0.9, 0, 1);
    CTX.font = `700 ${f.size}px "KaiTi",serif`;
    CTX.textAlign = 'center';
    CTX.lineWidth = 3.5; CTX.strokeStyle = 'rgba(0,0,0,.9)';
    CTX.strokeText(f.text, px(f.x), py(f.y) - 26);
    CTX.fillStyle = f.color;
    CTX.fillText(f.text, px(f.x), py(f.y) - 26);
  }
  CTX.globalAlpha = 1;

  drawVignette();
  drawMinimap(w, p);
  drawPortrait(p);
}

/* ---------------- 地面 ---------------- */
/* 地砖索引（行,列） */
const T_FLOOR = [[1,6],[1,7],[2,6],[2,7],[0,7],[0,8]];
const T_WALL  = [0,2];
const T_BONE  = [6,4];
const T_TORCH = [9,0];
const TILE_PX = 48;

function drawTileSprite(col, row, dx, dy, size) {
  if (!imgReady('tiles')) return false;
  CTX.drawImage(IMG.tiles, col * 16, row * 16, 16, 16, dx, dy, size, size);
  return true;
}

/* 稳定伪随机（同一格子每次一样） */
function tileHash(x, y, salt) {
  let h = (x * 374761393 + y * 668265263 + salt * 2246822519) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0;
  return Math.abs(h);
}

function drawGround(w) {
  const room = w.isTown ? null : DATA.ROOMS[w.roomId];
  const bg = w.isTown ? '#161d16' : room.bg;
  const tint = w.isTown ? '#2b3a24' : room.accent;

  CTX.fillStyle = bg;
  CTX.fillRect(0, 0, VW, VH);

  const T = TILE_PX;
  const hasTiles = imgReady('tiles');
  const salt = (w.isTown ? 99 : w.roomId) + 1;

  const c0 = Math.floor(CAM.x / T) - 1, c1 = Math.ceil((CAM.x + VW) / T) + 1;
  const r0 = Math.floor(CAM.y / (T * 1)) - 1, r1 = Math.ceil((CAM.y + VH / YS) / T) + 1;

  if (hasTiles) {
    for (let ry = r0; ry <= r1; ry++) {
      for (let cx = c0; cx <= c1; cx++) {
        const wx = cx * T, wy = ry * T;
        if (wx < -T || wy < -T || wx > w.W || wy > w.H) continue;
        const h = tileHash(cx, ry, salt);
        const t = T_FLOOR[h % T_FLOOR.length];
        drawTileSprite(t[1], t[0], px(wx), py(wy), T);
      }
    }
  } else {
    // 兜底：网格
    CTX.strokeStyle = tint; CTX.globalAlpha = 0.3; CTX.lineWidth = 1;
    for (let x = c0 * T; x <= c1 * T; x += T) {
      CTX.beginPath(); CTX.moveTo(px(x), 0); CTX.lineTo(px(x), VH); CTX.stroke();
    }
    for (let y = r0 * T; y <= r1 * T; y += T) {
      CTX.beginPath(); CTX.moveTo(0, py(y)); CTX.lineTo(VW, py(y)); CTX.stroke();
    }
    CTX.globalAlpha = 1;
  }

  // 房间色调（multiply 让地砖带各房间氛围）
  CTX.save();
  CTX.beginPath();
  CTX.rect(px(0), py(0), w.W, w.H * YS);
  CTX.clip();
  CTX.globalCompositeOperation = 'multiply';
  CTX.globalAlpha = 0.42;
  CTX.fillStyle = tint;
  CTX.fillRect(px(0), py(0), w.W, w.H * YS);
  CTX.globalAlpha = 1;
  CTX.globalCompositeOperation = 'source-over';
  CTX.fillStyle = 'rgba(0,0,0,0.12)';
  CTX.fillRect(px(0), py(0), w.W, w.H * YS);
  CTX.restore();

  // 边界外压黑
  CTX.fillStyle = 'rgba(0,0,0,.72)';
  const l = px(0), t = py(0), r = px(w.W), b = py(w.H);
  if (l > 0) CTX.fillRect(0, 0, l, VH);
  if (r < VW) CTX.fillRect(r, 0, VW - r, VH);
  if (t > 0) CTX.fillRect(0, 0, VW, t);
  if (b < VH) CTX.fillRect(0, b, VW, VH - b);
}

/* 场景装饰 */
function drawProps(w) {
  if (!w.props) return;
  for (const pr of w.props) {
    const x = px(pr.x), y = py(pr.y);
    if (x < -80 || x > VW + 80 || y < -80 || y > VH + 80) continue;

    if (pr.type === 'rock') {
      CTX.fillStyle = 'rgba(0,0,0,.4)';
      CTX.beginPath(); CTX.ellipse(x, y + 2, pr.r * 1.05, pr.r * YS * 0.7, 0, 0, 6.283); CTX.fill();
      CTX.fillStyle = '#37332a';
      CTX.beginPath(); CTX.ellipse(x, y - pr.r * 0.3, pr.r, pr.r * 0.72, pr.rot, 0, 6.283); CTX.fill();
      CTX.fillStyle = '#47423a';
      CTX.beginPath(); CTX.ellipse(x - pr.r * 0.2, y - pr.r * 0.55, pr.r * 0.6, pr.r * 0.4, pr.rot, 0, 6.283); CTX.fill();
    } else if (pr.type === 'bone') {
      if (!drawTileSprite(4, 6, x - 18, y - 24, 36)) {
        CTX.strokeStyle = '#6b6558'; CTX.lineWidth = 2.5;
        CTX.beginPath(); CTX.moveTo(x - pr.r, y); CTX.lineTo(x + pr.r, y); CTX.stroke();
      }
    } else if (pr.type === 'torch') {
      const flick = 0.72 + Math.sin(G.time * 9 + pr.seed) * 0.28;
      const gg = CTX.createRadialGradient(x, y - 30, 1, x, y - 30, 90 * flick);
      gg.addColorStop(0, 'rgba(255,180,80,.55)');
      gg.addColorStop(1, 'rgba(255,140,40,0)');
      CTX.fillStyle = gg;
      CTX.beginPath(); CTX.arc(x, y - 30, 90 * flick, 0, 6.283); CTX.fill();
      if (!drawTileSprite(T_TORCH[1], T_TORCH[0], x - 16, y - 40, 32)) {
        CTX.fillStyle = '#4a3a20'; CTX.fillRect(x - 3, y - 26, 6, 26);
        CTX.fillStyle = '#ffb347';
        CTX.beginPath(); CTX.arc(x, y - 30, 4.5 * flick, 0, 6.283); CTX.fill();
      }
      CTX.fillStyle = 'rgba(0,0,0,.4)';
      CTX.beginPath(); CTX.ellipse(x, y + 2, 7, 3, 0, 0, 6.283); CTX.fill();
    }
  }
}

function drawWalls(w) {
  CTX.strokeStyle = '#6b5a3a';
  CTX.lineWidth = 4;
  CTX.strokeRect(px(0), py(0), w.W, w.H * YS);
  CTX.strokeStyle = 'rgba(212,175,55,.28)';
  CTX.lineWidth = 1;
  CTX.strokeRect(px(0) + 4, py(0) + 4, w.W - 8, w.H * YS - 8);
}

/* 地面选中光环 */
function selRing(x, y, rx, ry, color, alpha) {
  CTX.save();
  CTX.globalAlpha = (alpha === undefined ? 0.85 : alpha);
  CTX.strokeStyle = color;
  CTX.lineWidth = 2.2;
  CTX.beginPath(); CTX.ellipse(x, y, rx, ry * YS, 0, 0, 6.283); CTX.stroke();
  CTX.globalAlpha *= 0.35;
  CTX.lineWidth = 1.2;
  CTX.beginPath(); CTX.ellipse(x, y, rx * 1.18, ry * YS * 1.18, 0, 0, 6.283); CTX.stroke();
  CTX.restore();
}

/* ---------------- 玩家 ---------------- */
function drawPlayer(p) {
  const gx = px(p.x), gy = py(p.y);
  const cls = DATA.CLASSES[p.cls], race = DATA.RACES[p.race];
  const clsIdx = ['warrior','mage','archer','assassin'].indexOf(p.cls);

  selRing(gx, gy, 24, 11, '#7fd45a');

  CTX.fillStyle = 'rgba(0,0,0,.5)';
  CTX.beginPath(); CTX.ellipse(gx, gy, 15, 15 * YS * 0.55, 0, 0, 6.283); CTX.fill();

  const moved = Math.hypot(p.x - (p._lx ?? p.x), p.y - (p._ly ?? p.y)) > 0.4;
  const S = 1.45, sw = U_FRAME_W * S, sh = U_FRAME_H * S;

  if (imgReady('units')) {
    const row = dirRow(p.dir);
    // 走路 8fps；攻击时切到第 2 帧并前冲
    const attacking = p.attackAnim > 0;
    const frame = attacking ? 2 : walkFrame(G.time, moved, 9);
    const lunge = attacking ? (p.attackAnim / 0.18) * 7 : 0;
    const ox = Math.cos(p.dir) * lunge, oy = Math.sin(p.dir) * lunge * 0.6;
    const bobY = moved && !attacking ? Math.abs(Math.sin(G.time * 9)) * -2 : 0;
    const sx0 = clsIdx * 128 + frame * U_FRAME_W, sy0 = row * U_FRAME_H;
    CTX.save();
    CTX.globalAlpha = p.stats.invis > 0 ? 0.45 : 1;
    CTX.drawImage(IMG.units, sx0, sy0, U_FRAME_W, U_FRAME_H,
                  gx - sw / 2 + ox, gy - sh + 8 + oy + bobY, sw, sh);
    CTX.restore();
  } else {
    CTX.fillStyle = cls.color;
    CTX.beginPath(); CTX.arc(gx, gy - 18, 18, 0, 6.283); CTX.fill();
    CTX.strokeStyle = race.color; CTX.lineWidth = 2.5; CTX.stroke();
  }
  p._lx = p.x; p._ly = p.y;

  // 攻击特效
  if (p.attackAnim > 0) {
    const k = p.attackAnim / 0.18;
    CTX.save();
    CTX.globalAlpha = k * 0.9;
    CTX.strokeStyle = '#ffd24a';
    CTX.lineWidth = 4;
    CTX.beginPath();
    CTX.arc(gx, gy - 28, 32, p.dir - 0.9, p.dir + 0.9);
    CTX.stroke();
    CTX.globalAlpha = k * 0.5;
    CTX.lineWidth = 8;
    CTX.beginPath();
    CTX.arc(gx, gy - 28, 32, p.dir - 0.55, p.dir + 0.55);
    CTX.stroke();
    CTX.restore();
  }

  CTX.font = '700 11px "KaiTi",serif';
  CTX.textAlign = 'center';
  CTX.lineWidth = 3; CTX.strokeStyle = 'rgba(0,0,0,.9)';
  CTX.strokeText(cls.name, gx, gy - 62);
  CTX.fillStyle = '#b9ffb0';
  CTX.fillText(cls.name, gx, gy - 62);

  drawBar(gx, gy - 56, 50, 5, p.hp / p.stats.hpMax, '#3fd45a', '#0d2a0d');
}

/* ---------------- 怪物 ---------------- */
function drawMonster(m) {
  const gx = px(m.x), gy = py(m.y);
  if (gx < -140 || gx > VW + 140 || gy < -140 || gy > VH + 140) return;
  const r = m.r;
  const h = r * HS;
  const x = gx, y = gy - h;

  if (m.isBoss) selRing(gx, gy, r * 1.35, r * 0.62, '#ff4a34', 0.9);
  else if (m.isElite) selRing(gx, gy, r * 1.15, r * 0.5, '#ffd24a', 0.75);
  else selRing(gx, gy, r * 1.05, r * 0.46, '#8b3a3a', 0.4);

  if (m.isElite) {
    const eg = CTX.createRadialGradient(gx, gy, r * 0.5, gx, gy, r * 2.2);
    eg.addColorStop(0, 'rgba(255,210,74,.20)');
    eg.addColorStop(1, 'rgba(255,210,74,0)');
    CTX.fillStyle = eg;
    CTX.beginPath(); CTX.arc(gx, gy, r * 2.2, 0, 6.283); CTX.fill();
  }

  CTX.fillStyle = 'rgba(0,0,0,.45)';
  CTX.beginPath(); CTX.ellipse(gx, gy, r * 0.9, r * 0.9 * YS * 0.55, 0, 0, 6.283); CTX.fill();

  // 行走图精灵（units 图集）
  const MON_IDX = { centaur:8, kobold:9, grunt:10, skeleton:11, doomguard:12, abyssal:13 };
  let drawn = false;
  if (imgReady('units')) {
    const S = m.isBoss ? 2.9 : (m.isElite ? 1.6 : 1.35);
    const sw = U_FRAME_W * S, sh = U_FRAME_H * S;
    const BOSS_IDX = { bossWolf:8, bossKobold:9, bossGrom:10, bossKel:11, bossMannoroth:12, bossArchimonde:13 };
    const idx = (MON_IDX[m.kind] !== undefined) ? MON_IDX[m.kind]
              : (BOSS_IDX[m.kind] !== undefined ? BOSS_IDX[m.kind] : 11);
    const moving = (m.aggro || m.wandering) && m.stun <= 0 && m.frozen <= 0;
    const faceAng = m.faceAng !== undefined ? m.faceAng
                    : Math.atan2(G.player.y - m.y, G.player.x - m.x);
    const row = dirRow(faceAng);
    m._fd = row;
    const frame = walkFrame(G.time + m.phase, moving, 6);
    CTX.save();
    CTX.drawImage(IMG.units, idx * 128 + frame * U_FRAME_W, row * U_FRAME_H,
                  U_FRAME_W, U_FRAME_H, gx - sw / 2, gy - sh + 6, sw, sh);
    CTX.restore();
    if (m.isBoss) {
      const aura = CTX.createRadialGradient(gx, gy, r * 0.8, gx, gy, r * 2.2);
      aura.addColorStop(0, 'rgba(255,70,50,.20)');
      aura.addColorStop(1, 'rgba(255,70,50,0)');
      CTX.fillStyle = aura;
      CTX.beginPath(); CTX.arc(gx, gy, r * 2.2, 0, 6.283); CTX.fill();
    }
    drawn = true;
  }
  if (!drawn) {
    const kind = m.isBoss ? 'boss' : (m.kind || 'centaur');
    drawMonsterBody(x, y, r, m, kind);
  }

  if (m.hitFlash > 0) {
    CTX.globalAlpha = m.hitFlash / 0.12 * 0.55;
    CTX.fillStyle = '#fff';
    CTX.beginPath(); CTX.arc(gx, gy - r * 0.6, r * 0.9, 0, 6.283); CTX.fill();
    CTX.globalAlpha = 1;
  }

  if (m.frozen > 0) {
    CTX.strokeStyle = 'rgba(127,212,255,.9)'; CTX.lineWidth = 3;
    CTX.beginPath(); CTX.arc(x, y, r + 3, 0, 6.283); CTX.stroke();
    CTX.fillStyle = 'rgba(127,212,255,.22)';
    CTX.beginPath(); CTX.arc(x, y, r + 3, 0, 6.283); CTX.fill();
  } else if (m.root > 0) {
    CTX.strokeStyle = '#9fe6b8'; CTX.lineWidth = 2; CTX.setLineDash([4, 4]);
    CTX.beginPath(); CTX.arc(x, y, r + 4, 0, 6.283); CTX.stroke();
    CTX.setLineDash([]);
  }

  const ea = Math.atan2(G.player.y - m.y, G.player.x - m.x);
  CTX.fillStyle = m.isBoss ? '#ffd24a' : '#141414';
  for (const s of [-0.44, 0.44]) {
    const ex = x + Math.cos(ea + s) * r * 0.40;
    const ey = y + Math.sin(ea + s) * r * 0.40;
    CTX.beginPath(); CTX.arc(ex, ey, m.isBoss ? 3.6 : 2.5, 0, 6.283); CTX.fill();
  }

  if (m.isBoss) {
    CTX.font = '700 14px "KaiTi",serif'; CTX.textAlign = 'center';
    CTX.lineWidth = 4; CTX.strokeStyle = 'rgba(0,0,0,.92)';
    CTX.strokeText(m.name, gx, gy - 96);
    CTX.fillStyle = '#ffb0a0';
    CTX.fillText(m.name, gx, gy - 96);
    drawBar(gx, gy - 90, 110, 7, m.hp / m.hpMax, '#ff4a34', '#2a0808');
  } else {
    drawBar(gx, gy - 62, 34, 4, m.hp / m.hpMax, '#d94a3a', '#2a0808');
  }

  let iy = gy + 6;
  if (m.burn) { CTX.fillStyle = '#ff8a3d'; CTX.fillRect(gx - 9, iy, 6, 6); iy += 8; }
  if (m.poison) { CTX.fillStyle = '#7fd45a'; CTX.fillRect(gx - 9, iy, 6, 6); }
}

function drawMonsterBody(x, y, r, m, kind) {
  const base = m.color;
  const g = CTX.createRadialGradient(x - r * 0.3, y - r * 0.35, 2, x, y, r);
  g.addColorStop(0, shade(base, 55));
  g.addColorStop(1, base);

  const body = () => {
    CTX.fillStyle = g;
    CTX.beginPath(); CTX.arc(x, y, r, 0, 6.283); CTX.fill();
    CTX.lineWidth = 2.4;
    CTX.strokeStyle = shade(base, -60);
    CTX.stroke();
  };

  if (m.isBoss) {
    const aura = CTX.createRadialGradient(x, y, r * 0.8, x, y, r * 1.7);
    aura.addColorStop(0, 'rgba(255,70,50,.22)');
    aura.addColorStop(1, 'rgba(255,70,50,0)');
    CTX.fillStyle = aura;
    CTX.beginPath(); CTX.arc(x, y, r * 1.7, 0, 6.283); CTX.fill();

    body();
    CTX.fillStyle = shade(base, 70);
    for (const s of [-1, 1]) {
      CTX.beginPath();
      CTX.moveTo(x + s * r * 0.55, y - r * 0.62);
      CTX.lineTo(x + s * r * 0.95, y - r * 1.28);
      CTX.lineTo(x + s * r * 0.95, y - r * 0.42);
      CTX.closePath(); CTX.fill();
    }
    CTX.fillStyle = '#ffd24a';
    CTX.beginPath();
    CTX.moveTo(x - r * 0.5, y - r * 0.55);
    CTX.lineTo(x - r * 0.32, y - r * 0.95);
    CTX.lineTo(x - r * 0.12, y - r * 0.62);
    CTX.lineTo(x, y - r * 1.05);
    CTX.lineTo(x + r * 0.12, y - r * 0.62);
    CTX.lineTo(x + r * 0.32, y - r * 0.95);
    CTX.lineTo(x + r * 0.5, y - r * 0.55);
    CTX.closePath(); CTX.fill();
    return;
  }

  body();

  if (kind === 'centaur') {
    CTX.fillStyle = shade(base, -30);
    CTX.beginPath(); CTX.ellipse(x + r * 0.5, y + r * 0.35, r * 0.85, r * 0.42, 0, 0, 6.283); CTX.fill();
    CTX.strokeStyle = '#8a7a5a'; CTX.lineWidth = 2.5; CTX.lineCap = 'round';
    CTX.beginPath(); CTX.moveTo(x - r * 0.5, y - r * 0.1); CTX.lineTo(x + r * 1.5, y + r * 0.6); CTX.stroke();
  } else if (kind === 'kobold') {
    CTX.fillStyle = '#4a3a20';
    CTX.fillRect(x - 2, y - r * 1.5, 4, r * 0.7);
    const fl = 0.7 + Math.sin(G.time * 10) * 0.3;
    CTX.fillStyle = 'rgba(255,200,90,' + fl + ')';
    CTX.beginPath(); CTX.arc(x, y - r * 1.55, 5, 0, 6.283); CTX.fill();
  } else if (kind === 'grunt') {
    CTX.fillStyle = '#5a4a2a';
    for (const s of [-1, 1]) {
      CTX.beginPath(); CTX.arc(x + s * r * 0.85, y - r * 0.2, r * 0.36, 0, 6.283); CTX.fill();
    }
    CTX.strokeStyle = '#9a9a9a'; CTX.lineWidth = 3; CTX.lineCap = 'round';
    CTX.beginPath(); CTX.moveTo(x + r * 1.1, y - r * 0.3); CTX.lineTo(x + r * 1.5, y + r * 0.5); CTX.stroke();
  } else if (kind === 'skeleton') {
    CTX.strokeStyle = '#7a7466'; CTX.lineWidth = 1.6;
    for (let i = -1; i <= 1; i++) {
      CTX.beginPath();
      CTX.moveTo(x - r * 0.55, y + i * r * 0.3);
      CTX.lineTo(x + r * 0.55, y + i * r * 0.3);
      CTX.stroke();
    }
  } else if (kind === 'doomguard') {
    CTX.fillStyle = shade(base, -45);
    for (const s of [-1, 1]) {
      CTX.beginPath();
      CTX.moveTo(x + s * r * 0.4, y - r * 0.6);
      CTX.lineTo(x + s * r * 1.5, y - r * 0.15);
      CTX.lineTo(x + s * r * 0.5, y + r * 0.3);
      CTX.closePath(); CTX.fill();
    }
    CTX.fillStyle = '#ff6b5a';
    for (const s of [-1, 1]) {
      CTX.beginPath();
      CTX.moveTo(x + s * r * 0.45, y - r * 0.7);
      CTX.lineTo(x + s * r * 0.62, y - r * 1.15);
      CTX.lineTo(x + s * r * 0.78, y - r * 0.62);
      CTX.closePath(); CTX.fill();
    }
  } else if (kind === 'abyssal') {
    CTX.fillStyle = shade(base, -50);
    for (let i = 0; i < 7; i++) {
      const ang = -Math.PI / 2 + (i - 3) * 0.42;
      CTX.beginPath();
      CTX.moveTo(x + Math.cos(ang) * r * 0.85, y + Math.sin(ang) * r * 0.85);
      CTX.lineTo(x + Math.cos(ang) * r * 1.42, y + Math.sin(ang) * r * 1.42);
      CTX.lineTo(x + Math.cos(ang + 0.2) * r * 0.85, y + Math.sin(ang + 0.2) * r * 0.85);
      CTX.closePath(); CTX.fill();
    }
  }
}

/* ---------------- 掉落 / 陷阱 / 投射物 ---------------- */
function drawDrop(d) {
  const x = px(d.x), gy = py(d.y);
  const bob = Math.sin((d.bob || 0) * 1.2) * 3;
  const y = gy - 22 + bob;
  if (x < -80 || x > VW + 80 || y < -60 || y > VH + 60) return;

  const fade = Math.min(1, (d.age || 0) * 4);   // 淡入
  CTX.save();
  CTX.globalAlpha = fade;

  // 地面光晕
  const pulse = 0.7 + Math.sin(G.time * 4 + (d.bob || 0)) * 0.3;
  const glow = CTX.createRadialGradient(x, gy, 2, x, gy, 26);
  glow.addColorStop(0, d.color + 'cc');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  CTX.fillStyle = glow;
  CTX.beginPath(); CTX.ellipse(x, gy, 26, 26 * YS, 0, 0, 6.283); CTX.fill();

  // 光柱
  const beam = CTX.createLinearGradient(x, y - 40, x, gy);
  beam.addColorStop(0, 'rgba(0,0,0,0)');
  beam.addColorStop(1, d.color + '55');
  CTX.fillStyle = beam;
  CTX.fillRect(x - 8, y - 40, 16, 40 + 20);

  // ---- 图标 ----
  if (d.type === 'gold') {
    CTX.fillStyle = '#ffd24a';
    CTX.beginPath(); CTX.arc(x, y, 9, 0, 6.283); CTX.fill();
    CTX.strokeStyle = '#7a5a10'; CTX.lineWidth = 2; CTX.stroke();
    CTX.fillStyle = '#fff3b0';
    CTX.beginPath(); CTX.arc(x - 3, y - 3, 3, 0, 6.283); CTX.fill();
  } else if (d.type === 'item') {
    // 装备：菱形宝石 + 品质描边
    CTX.save();
    CTX.translate(x, y);
    CTX.rotate(Math.PI / 4);
    CTX.fillStyle = d.color;
    CTX.fillRect(-8, -8, 16, 16);
    CTX.strokeStyle = '#0a0805'; CTX.lineWidth = 2;
    CTX.strokeRect(-8, -8, 16, 16);
    CTX.fillStyle = 'rgba(255,255,255,.55)';
    CTX.fillRect(-6, -6, 6, 6);
    CTX.restore();
  } else if (d.type === 'skillbook' || d.type === 'attrbook') {
    CTX.fillStyle = d.color;
    CTX.fillRect(x - 9, y - 11, 18, 22);
    CTX.strokeStyle = '#0a0805'; CTX.lineWidth = 2; CTX.strokeRect(x - 9, y - 11, 18, 22);
    CTX.fillStyle = 'rgba(255,255,255,.85)';
    CTX.fillRect(x - 9, y - 11, 4, 22);
    CTX.fillStyle = '#fff'; CTX.font = '700 11px "KaiTi",serif'; CTX.textAlign = 'center';
    CTX.fillText('书', x + 2, y + 4);
  } else if (d.type === 'potion') {
    CTX.fillStyle = d.potion.color;
    CTX.beginPath(); CTX.arc(x, y + 3, 8, 0, 6.283); CTX.fill();
    CTX.strokeStyle = '#0a0805'; CTX.lineWidth = 2; CTX.stroke();
    CTX.fillStyle = '#cfc6b0'; CTX.fillRect(x - 4, y - 10, 8, 7);
  }

  // ---- 名牌 ----
  const label = d.type === 'gold' ? ('+' + d.gold + ' 金') :
                d.type === 'item' ? d.item.name :
                d.type === 'potion' ? d.potion.name :
                (d.label || '物品');
  const col = d.type === 'gold' ? '#ffd24a' : (d.color || '#e8e0cc');

  CTX.font = '600 11px "PingFang SC","Microsoft YaHei",sans-serif';
  const tw = CTX.measureText(label).width;
  const pw = tw + 14, ph = 17;
  const py0 = y - 30;
  CTX.fillStyle = 'rgba(8,6,3,.82)';
  CTX.beginPath();
  if (CTX.roundRect) { CTX.roundRect(x - pw/2, py0, pw, ph, 3); } else { CTX.rect(x - pw/2, py0, pw, ph); }
  CTX.fill();
  CTX.strokeStyle = col; CTX.lineWidth = 1; CTX.stroke();
  CTX.fillStyle = col;
  CTX.textAlign = 'center';
  CTX.fillText(label, x, py0 + 12);

  CTX.restore();
}

function drawTrap(t) {
  const x = px(t.x), y = py(t.y);
  CTX.strokeStyle = t.armed > 0 ? 'rgba(127,212,255,.35)' : 'rgba(127,212,255,.8)';
  CTX.lineWidth = 2; CTX.setLineDash([5, 5]);
  CTX.beginPath(); CTX.ellipse(x, y, t.r, t.r * YS, 0, 0, 6.283); CTX.stroke();
  CTX.setLineDash([]);
}

function drawProjectile(pr) {
  const x = px(pr.x), y = py(pr.y) - 18;
  const ang = Math.atan2(pr.vy, pr.vx);

  if (pr.shape === 'arrow') {
    // 箭矢：细长箭杆 + 箭头 + 拖尾
    CTX.save();
    CTX.translate(x, y);
    CTX.rotate(ang);
    const g = CTX.createLinearGradient(-30, 0, 12, 0);
    g.addColorStop(0, 'rgba(216,240,255,0)');
    g.addColorStop(1, pr.color);
    CTX.strokeStyle = g; CTX.lineWidth = 2.5; CTX.lineCap = 'round';
    CTX.beginPath(); CTX.moveTo(-28, 0); CTX.lineTo(8, 0); CTX.stroke();
    CTX.fillStyle = '#fff';
    CTX.beginPath(); CTX.moveTo(14, 0); CTX.lineTo(6, -4); CTX.lineTo(6, 4); CTX.closePath(); CTX.fill();
    CTX.strokeStyle = 'rgba(255,255,255,.65)'; CTX.lineWidth = 1.5;
    CTX.beginPath(); CTX.moveTo(-6, 0); CTX.lineTo(-12, -4); CTX.stroke();
    CTX.beginPath(); CTX.moveTo(-6, 0); CTX.lineTo(-12, 4); CTX.stroke();
    CTX.restore();
    return;
  }

  const glow = CTX.createRadialGradient(x, y, 0, x, y, 13);
  glow.addColorStop(0, pr.color);
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  CTX.fillStyle = glow;
  CTX.beginPath(); CTX.arc(x, y, 13, 0, 6.283); CTX.fill();
  CTX.fillStyle = '#fff';
  CTX.beginPath(); CTX.arc(x, y, 3, 0, 6.283); CTX.fill();
}

/* ---------------- 技能特效 ---------------- */
function drawVfx(w) {
  if (!w.vfx || !w.vfx.length) return;
  for (let i = w.vfx.length - 1; i >= 0; i--) {
    const e = w.vfx[i];
    e.t += 1 / 60;
    if (e.t >= e.life) { w.vfx.splice(i, 1); continue; }
    const k = e.t / e.life, a = 1 - k;
    const gx = px(e.x), gy = py(e.y), x = gx, y = gy - 16;
    const R = e.r * (0.25 + k * 1.15);

    CTX.save();

    // ---- 特效帧（贴图） ----
    if (imgReady('fx')) {
      const sc = e.kind === 'hit' ? (0.45 + k * 0.55) : (0.45 + k * 1.15);
      const sz = FX_SIZE * sc;
      CTX.globalAlpha = e.kind === 'hit' ? a : a * 0.95;
      CTX.translate(gx, gy - 20);
      if (e.fx !== 0) CTX.rotate(k * 0.9);
      CTX.imageSmoothingEnabled = false;
      CTX.drawImage(IMG.fx, e.fx * FX_SIZE, 0, FX_SIZE, FX_SIZE, -sz / 2, -sz / 2, sz, sz);
      CTX.setTransform(DPR, 0, 0, DPR, 0, 0);
      CTX.globalAlpha = 1;
    }

    // 地面冲击环
    CTX.globalAlpha = a * 0.9;
    CTX.strokeStyle = e.color;
    CTX.lineWidth = 3 + 4 * a;
    CTX.beginPath(); CTX.ellipse(gx, gy, R, R * YS, 0, 0, 6.283); CTX.stroke();
    // 内圈
    CTX.globalAlpha = a * 0.4;
    CTX.lineWidth = 1.5;
    CTX.beginPath(); CTX.ellipse(gx, gy, R * 0.6, R * 0.6 * YS, 0, 0, 6.283); CTX.stroke();
    // 光晕
    const gr = CTX.createRadialGradient(x, y, 2, x, y, R * 0.95);
    gr.addColorStop(0, e.color);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    CTX.globalAlpha = a * 0.38;
    CTX.fillStyle = gr;
    CTX.beginPath(); CTX.arc(x, y, R * 0.95, 0, 6.283); CTX.fill();
    // 放射线
    CTX.globalAlpha = a * 0.75;
    CTX.strokeStyle = e.color;
    CTX.lineWidth = 2;
    for (let sp = 0; sp < 8; sp++) {
      const ang = sp * Math.PI / 4 + k * 1.1;
      CTX.beginPath();
      CTX.moveTo(x + Math.cos(ang) * R * 0.35, y + Math.sin(ang) * R * 0.35 * YS);
      CTX.lineTo(x + Math.cos(ang) * R * 1.0, y + Math.sin(ang) * R * 1.0 * YS);
      CTX.stroke();
    }
    // 中心闪光
    CTX.globalAlpha = a * a;
    CTX.fillStyle = '#fff';
    CTX.beginPath(); CTX.arc(x, y, 10 * (1 - k) + 3, 0, 6.283); CTX.fill();
    CTX.restore();
  }
}

/* ---------------- NPC ---------------- */
function drawNPC(n) {
  const gx = px(n.x), gy = py(n.y);
  const y = gy - n.r * HS - 6;

  selRing(gx, gy, 26, 12, '#ffd24a', 0.55);
  CTX.fillStyle = 'rgba(0,0,0,.45)';
  CTX.beginPath(); CTX.ellipse(gx, gy, 20, 20 * YS * 0.55, 0, 0, 6.283); CTX.fill();

  const lg = CTX.createLinearGradient(gx, y - 80, gx, gy);
  lg.addColorStop(0, 'rgba(0,0,0,0)');
  lg.addColorStop(1, n.color + '55');
  CTX.fillStyle = lg;
  CTX.fillRect(gx - 18, y - 80, 36, 80);

  const NPC_IDX = { teleport:4, merchant:5, exchange:6, blacksmith:7, quest:0 };
  let npcDrawn = false;
  if (imgReady('units') && NPC_IDX[n.kind] !== undefined) {
    const S = 1.4, sw = U_FRAME_W*S, sh = U_FRAME_H*S;
    const idx = NPC_IDX[n.kind];
    const frame = Math.floor((G.time + n.x * 0.01) * 3) % 4;
    CTX.drawImage(IMG.units, idx*128 + frame*U_FRAME_W, 0, U_FRAME_W, U_FRAME_H,
                  gx - sw/2, gy - sh + 8, sw, sh);
    npcDrawn = true;
  }
  if (!npcDrawn) {
    if (n.kind === 'save' && imgReady('stele')) {
      const sz = 68;
      const glow = CTX.createRadialGradient(gx, gy - 20, 4, gx, gy - 20, 52);
      glow.addColorStop(0, 'rgba(127,212,255,.28)');
      glow.addColorStop(1, 'rgba(127,212,255,0)');
      CTX.fillStyle = glow;
      CTX.beginPath(); CTX.arc(gx, gy - 20, 52, 0, 6.283); CTX.fill();
      CTX.drawImage(IMG.stele, gx - sz / 2, gy - sz + 10, sz, sz);
      npcDrawn = true;
    } else if (n.kind === 'craft') {
      // 锻造台：铁砧 + 火光
      const fy = gy - 6;
      const glow = CTX.createRadialGradient(gx, fy, 2, gx, fy, 46);
      glow.addColorStop(0, 'rgba(255,150,60,.55)');
      glow.addColorStop(1, 'rgba(255,120,40,0)');
      CTX.fillStyle = glow;
      CTX.beginPath(); CTX.arc(gx, fy, 46, 0, 6.283); CTX.fill();
      CTX.fillStyle = '#4a4a52';
      CTX.fillRect(gx - 26, fy - 4, 52, 14);
      CTX.fillRect(gx - 12, fy + 8, 24, 14);
      CTX.fillStyle = '#6a6a74';
      CTX.fillRect(gx - 26, fy - 10, 52, 7);
      CTX.strokeStyle = '#22222a'; CTX.lineWidth = 2;
      CTX.strokeRect(gx - 26, fy - 4, 52, 14);
      CTX.restore = CTX.restore;
    } else {
      CTX.beginPath(); CTX.arc(gx, y, n.r, 0, 6.283);
      CTX.fillStyle = n.color; CTX.fill();
      CTX.lineWidth = 2.5; CTX.strokeStyle = '#f0e6c8'; CTX.stroke();
    }
  }

  CTX.font = '700 12px "KaiTi",serif';
  CTX.textAlign = 'center';
  CTX.lineWidth = 3.5; CTX.strokeStyle = 'rgba(0,0,0,.92)';
  CTX.strokeText(n.name, gx, y - n.r - 9);
  CTX.fillStyle = '#ffe6a8';
  CTX.fillText(n.name, gx, y - n.r - 9);
}

/* ---------------- 通用 ---------------- */
function drawBar(cx, cy, w, h, pct, color, bg) {
  pct = clamp(pct, 0, 1);
  CTX.fillStyle = bg;
  CTX.fillRect(cx - w / 2, cy, w, h);
  CTX.fillStyle = color;
  CTX.fillRect(cx - w / 2, cy, w * pct, h);
  CTX.strokeStyle = 'rgba(0,0,0,.9)';
  CTX.lineWidth = 1;
  CTX.strokeRect(cx - w / 2 + .5, cy + .5, w - 1, h - 1);
}

function shade(hex, amt) {
  const n = parseInt(hex.replace('#', ''), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
  return `rgb(${clamp(r,0,255)|0},${clamp(g,0,255)|0},${clamp(b,0,255)|0})`;
}

function drawVignette() {
  const g = CTX.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.38, VW / 2, VH / 2, Math.max(VW, VH) * 0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.68)');
  CTX.fillStyle = g;
  CTX.fillRect(0, 0, VW, VH);
}

/* ---------------- 小地图 ---------------- */
function drawMinimap(w, p) {
  const W = MMC.width, H = MMC.height;
  MMX.clearRect(0, 0, W, H);
  MMX.fillStyle = '#0a0d0a';
  MMX.fillRect(0, 0, W, H);

  const k = Math.min(W / w.W, H / w.H);
  const ox = (W - w.W * k) / 2, oy = (H - w.H * k) / 2;
  const mx = x => ox + x * k, my = y => oy + y * k;

  MMX.strokeStyle = '#4a3d28'; MMX.lineWidth = 1;
  MMX.strokeRect(ox, oy, w.W * k, w.H * k);

  for (const d of w.drops) {
    MMX.fillStyle = d.color;
    MMX.fillRect(mx(d.x) - 1, my(d.y) - 1, 2, 2);
  }
  for (const m of w.monsters) {
    if (!m.alive) continue;
    MMX.fillStyle = m.isBoss ? '#ff4a34' : '#c0554a';
    MMX.beginPath(); MMX.arc(mx(m.x), my(m.y), m.isBoss ? 3.5 : 1.8, 0, 6.283); MMX.fill();
  }
  for (const n of w.npcs) {
    MMX.fillStyle = '#ffd24a';
    MMX.beginPath(); MMX.arc(mx(n.x), my(n.y), 2.6, 0, 6.283); MMX.fill();
  }
  MMX.fillStyle = '#7fd4ff';
  MMX.beginPath(); MMX.arc(mx(p.x), my(p.y), 3.2, 0, 6.283); MMX.fill();
  MMX.strokeStyle = '#fff'; MMX.lineWidth = 1; MMX.stroke();
}

/* ---------------- 头像 ---------------- */
function drawPortrait(p) {
  const W = PRT.width, H = PRT.height;
  PRX.clearRect(0, 0, W, H);
  const cls = DATA.CLASSES[p.cls], race = DATA.RACES[p.race];

  const g = PRX.createRadialGradient(W * 0.35, H * 0.3, 4, W / 2, H / 2, W * 0.72);
  g.addColorStop(0, shade(race.color, -20));
  g.addColorStop(1, '#0b0d0f');
  PRX.fillStyle = g;
  PRX.fillRect(0, 0, W, H);

  PRX.fillStyle = shade(cls.color, -30);
  PRX.beginPath(); PRX.ellipse(W / 2, H * 0.96, W * 0.44, H * 0.38, 0, 0, 6.283); PRX.fill();
  PRX.fillStyle = shade(race.color, 12);
  PRX.beginPath(); PRX.arc(W / 2, H * 0.42, W * 0.245, 0, 6.283); PRX.fill();
  PRX.lineWidth = 2; PRX.strokeStyle = '#1a1610'; PRX.stroke();

  PRX.font = '700 24px "KaiTi",serif';
  PRX.textAlign = 'center';
  PRX.fillStyle = 'rgba(255,230,168,.92)';
  PRX.fillText(cls.name.charAt(0), W / 2, H * 0.53);

  PRX.strokeStyle = 'rgba(212,175,55,.4)';
  PRX.lineWidth = 1;
  PRX.strokeRect(2.5, 2.5, W - 5, H - 5);
}

</script>
<script>
/* ===== js/ui.js ===== */
/* ============================================================
   UI：HUD / 命令卡 / 弹窗 / 难度选择 / 背包
   ============================================================ */
'use strict';

const $ = id => document.getElementById(id);
let hudAcc = 0;
let TIP = null;
let MODAL_KEY = null;          // 当前打开的弹窗标识（用于同键关闭）
let SEL = { race: 'human', cls: 'warrior' };

/* 自动战斗开关 */
const AUTO = { atk: false, skill: false };

/* 装备图标（精灵图，CSS background-position 切换） */
function iconTag(slot, size) {
  const i = SLOT_ICON_IDX[slot];
  if (i === undefined) return '';
  const sz = size ? `style="width:${size}px;height:${size}px;background-size:${size*8}px ${size}px;background-position:${-i*size}px 0"` : '';
  return `<span class="ic-sprite" data-i="${i}" ${sz}></span>`;
}

function uiInit() {
  document.documentElement.style.setProperty('--icon-sheet', `url(${ASSETS.icons})`);
  document.documentElement.style.setProperty('--skill-sheet', `url(${ASSETS.skills})`);
  bindSkillTips();
  // 任务追踪：事件委托（内容重建后依然可点）
  const qt = $('questTracker');
  if (qt) {
    qt.addEventListener('click', e => {
      const head = e.target.closest('.qt-head');
      if (head) { G.qtCollapsed = !G.qtCollapsed; QT_SIG = ''; return; }
      const claim = e.target.closest('[data-qt-claim]');
      if (claim) { claimQuest(claim.dataset.qtClaim); QT_SIG = ''; return; }
      if (e.target.closest('[data-qt-claim-all]')) { claimAllQuests(); return; }
      if (e.target.closest('[data-qt-accept-all]')) { acceptAllQuests(); QT_SIG = ''; return; }
    });
  }
  document.querySelectorAll('.cc-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.skill) castSkillKey(btn.dataset.skill);
      else if (btn.dataset.act) handleCommand(btn.dataset.act);
    });
  });
  $('modalClose').addEventListener('click', closeModal);
  $('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

  $('btnNew').addEventListener('click', () => { SEL = { race: 'human', cls: 'warrior' }; showScreen('create'); });
  $('btnContinue').addEventListener('click', () => { if (loadGame()) startGame(); else toast('没有存档'); });
  $('btnImport').addEventListener('click', () => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json';
    inp.onchange = e => { if (e.target.files[0]) importSave(e.target.files[0]); };
    inp.click();
  });
  $('btnBackTitle').addEventListener('click', () => showScreen('title'));
  $('btnStart').addEventListener('click', confirmCreate);

  buildCreateScreen();
  $('btnContinue').disabled = !hasSave();
}

function showScreen(name) {
  $('screen-title').classList.toggle('hidden', name !== 'title');
  $('screen-create').classList.toggle('hidden', name !== 'create');
  $('hud').classList.toggle('hidden', name !== 'game');
  G.screen = name;
  if (name === 'title') $('btnContinue').disabled = !hasSave();
}

/* ---------------- 建角 ---------------- */
function buildCreateScreen() {
  const rl = $('raceList'); rl.innerHTML = '';
  for (const k in DATA.RACES) {
    const r = DATA.RACES[k];
    const el = document.createElement('div');
    el.className = 'card' + (k === SEL.race ? ' sel' : '');
    el.innerHTML = `<h3 style="color:${r.color}">${r.name}</h3>
      <p>${r.desc}</p>
      <div><span class="tag">力 ${fmtMod(r.mod.str)}</span><span class="tag">敏 ${fmtMod(r.mod.agi)}</span>
      <span class="tag">智 ${fmtMod(r.mod.int)}</span><span class="tag">体 ${fmtMod(r.mod.vit)}</span></div>
      <p style="margin-top:6px;color:#8f8570">${r.talent}</p>`;
    el.onclick = () => { SEL.race = k; buildCreateScreen(); };
    rl.appendChild(el);
  }
  const cl = $('classList'); cl.innerHTML = '';
  for (const k in DATA.CLASSES) {
    const c = DATA.CLASSES[k];
    const el = document.createElement('div');
    el.className = 'card' + (k === SEL.cls ? ' sel' : '');
    const km = c.keymap;
    el.innerHTML = `<h3 style="color:${c.color}">${c.name}</h3>
      <p>${c.desc}</p>
      <div><span class="tag">主属性 ${statName(c.primary)}</span><span class="tag">${c.weapon}</span></div>
      <p style="margin-top:6px;color:#8f8570">Q ${DATA.SKILLS[km.q].name} · W ${DATA.SKILLS[km.w].name}</p>
      <p style="color:#8f8570">E ${DATA.SKILLS[km.e].name} · R ${DATA.SKILLS[km.r].name} · D ${DATA.SKILLS[km.d].name}</p>`;
    el.onclick = () => { SEL.cls = k; buildCreateScreen(); };
    cl.appendChild(el);
  }
}

const statName = k => ({ str:'力量', agi:'敏捷', int:'智力', vit:'体质' }[k] || k);
const fmtMod = v => (v > 0 ? '+' : '') + v;

function confirmCreate() {
  G.player = createPlayer(SEL.race, SEL.cls);
  G.diff = 'normal';
  startGame();
  logMsg(`${DATA.RACES[SEL.race].name} · ${DATA.CLASSES[SEL.cls].name} 踏上征程`, 'level');
  openTownMap();   // 开局直接让玩家选第一个图 + 难度
}

/* ---------------- HUD ---------------- */
function updateHUD(dt) {
  hudAcc += dt;
  if (hudAcc < 0.08) return;
  hudAcc = 0;
  const p = G.player, w = G.world;
  if (!p || !w) return;

  const hpPct = clamp(p.hp / p.stats.hpMax, 0, 1) * 100;
  const mpPct = clamp(p.mp / p.stats.mpMax, 0, 1) * 100;
  const need = DATA.expForLevel(p.level);
  const xpPct = p.level >= DATA.MAX_LEVEL ? 100 : clamp(p.exp / need, 0, 1) * 100;

  $('hpFill').style.width = hpPct + '%';
  $('mpFill').style.width = mpPct + '%';
  $('xpFill').style.width = xpPct + '%';
  $('hpText').textContent = `${Math.ceil(p.hp)} / ${p.stats.hpMax}`;
  $('mpText').textContent = `${Math.ceil(p.mp)} / ${p.stats.mpMax}`;
  $('xpText').textContent = p.level >= DATA.MAX_LEVEL ? '满级' : `${Math.floor(xpPct)}%`;
  $('pLevel').textContent = p.level;
  $('pName').textContent = `${DATA.RACES[p.race].name} · ${DATA.CLASSES[p.cls].name}`;
  $('pStats').innerHTML =
    `攻击 <b>${Math.round(p.stats.power)}</b>　攻速 <b>${p.stats.as.toFixed(2)}</b>　` +
    `暴击 <b>${(p.stats.crit*100).toFixed(0)}%</b>　护甲 <b>${Math.round(p.stats.armor)}</b>`;
  $('goldVal').textContent = fmt(p.gold);
  $('cpVal').textContent = fmt(combatPower(p));

  const gt = gearTier(p);
  $('gearVal').textContent = gt.tierName;
  $('gearVal').style.color = gt.filled === 8 ? DATA.QUALITY[Math.max(0,gt.minIdx)].color : '#b8ad93';

  $('diffVal').textContent = DATA.DIFFICULTY[G.diff].name;
  $('diffVal').style.color = DATA.DIFFICULTY[G.diff].color;

  const isTown = w.isTown;
  $('roomName').textContent = isTown ? '暴风城 · 安全区' : DATA.ROOMS[w.roomId].name;
  $('roomSub').textContent = isTown ? '点击 NPC 或按 M 选择关卡'
    : `${DATA.DIFFICULTY[G.diff].name}难度 · ${DATA.ROOMS[w.roomId].desc}`;
  $('mmLabel').textContent = isTown ? '城镇' : DATA.ROOMS[w.roomId].name;

  const boss = w.monsters.find(m => m.isBoss && m.alive);
  if (boss) {
    $('bossBar').classList.remove('hidden');
    $('bossName').textContent = `${boss.name}　·　${boss.title}`;
    $('bossFill').style.width = clamp(boss.hp / boss.hpMax, 0, 1) * 100 + '%';
  } else $('bossBar').classList.add('hidden');

  // 命令卡技能（QWERD）
  const keyMap = { q:'q', w:'w', e:'e', r:'r', d:'d' };
  document.querySelectorAll('.cc-btn.skill').forEach(btn => {
    const k = btn.dataset.skill;
    const key = (k === 'd') ? p.dash : p.keymap[k];
    const sp = DATA.SKILLS[key];
    const nm = btn.querySelector('.nm');
    const cdEl = btn.querySelector('.cd');
    nm.textContent = sp ? sp.name : '—';
    const ic = btn.querySelector('.sk-ic');
    if (ic && sp) {
      const ii = DATA.SKILL_ICON[key] ?? 0;
      // 全部内联，杜绝任何样式覆盖
      ic.style.position = 'absolute';
      ic.style.left = '50%';
      ic.style.top = '50%';
      ic.style.transform = 'translate(-50%,-50%)';
      ic.style.width = '38px';
      ic.style.height = '38px';
      ic.style.display = 'block';
      ic.style.backgroundImage = `url(${ASSETS.skills})`;
      ic.style.backgroundSize = '912px 38px';
      ic.style.backgroundPosition = `${-ii * 38}px 0`;
      ic.style.backgroundRepeat = 'no-repeat';
      ic.style.imageRendering = 'pixelated';
    }
    const cd = p.cd && p.cd[key] ? p.cd[key] : 0;
    if (cd > 0) { cdEl.textContent = cd.toFixed(1); cdEl.classList.add('on'); }
    else cdEl.classList.remove('on');
  });

  // 自动战斗开关状态
  document.querySelectorAll('.cc-btn.toggle').forEach(btn => {
    const on = btn.dataset.act === 'autoAtk' ? AUTO.atk : AUTO.skill;
    btn.classList.toggle('on', !!on);

  // 消息
  $('msglog').innerHTML = G.msgLog.slice(-6).reverse()
    .map(m => `<div class="m ${m.type}">${m.text}</div>`).join('');

  // NPC 提示
  const npc = nearestNPC();
  if (npc) {
    $('interactHint').classList.remove('hidden');
    $('interactHint').innerHTML = `按 <b>E</b> 与 ${npc.name} 交互`;
  } else $('interactHint').classList.add('hidden');
}

/* ---------------- 任务进度 ---------------- */
function onMonsterKilled(m) {
  const p = G.player;
  if (!p) return;

  // ---- 技能熟练度 ----
  gainSkillProf(p, DATA.SKILL_TIER.killProf * (m.isBoss ? 8 : (m.isElite ? 3 : 1)));

  // ---- 材料掉落 ----
  const rnd = Math.random();
  if (m.isBoss) {
    p.materials.stone = (p.materials.stone || 0) + 2 + Math.floor(Math.random() * 3);
    if (Math.random() < 0.6) p.materials.skillT = (p.materials.skillT || 0) + 1;
    if (Math.random() < 0.25) p.materials.breakT = (p.materials.breakT || 0) + 1;
    if (Math.random() < 0.35) p.materials.protect = (p.materials.protect || 0) + 1;
  } else if (m.isElite) {
    if (rnd < 0.45) p.materials.stone = (p.materials.stone || 0) + 1;
    if (rnd > 0.93) p.materials.skillT = (p.materials.skillT || 0) + 1;
  } else if (rnd < 0.12) {
    p.materials.stone = (p.materials.stone || 0) + 1;
  }

  // ---- BOSS 首杀戒指 ----
  if (m.isBoss && m.kind && DATA.BOSS_RINGS[m.kind] && !(p.firstKills || {})[m.kind]) {
    const ring = grantFirstKillRing(p, m.kind);
    if (ring) {
      toast(`🏆 首杀成就：获得【${ring.name}】`);
      logMsg(`🏆 首杀 ${m.name} → ${ring.name}（${ring.effectDesc}）`, 'level');
      saveGame();
    }
  }

  // ---- 爬塔推进 ----
  if (G.tower && G.tower.active) {
    const w = G.world;
    const left = w.monsters.filter(x => x.alive).length;
    if (left === 0) setTimeout(clearTowerFloor, 400);
  }

  // ---- 悬赏任务 ----
  (p.quests || []).forEach(q => {
    if (q.room !== G.world.roomId || q.have >= q.need) return;
    q.have++;
    if (q.have === q.need) {
      toast(`任务「${q.name}」目标达成！回城领取`);
      logMsg(`✔ 「${q.name}」目标完成，回城领取奖励`, 'level');
    }
  });
}

/* ---------------- 右侧任务追踪 ---------------- */
let QT_SIG = '';
function updateQuestTracker() {
  const el = $('questTracker');
  if (!el) return;
  const p = G.player;
  if (!p || G.screen !== 'game') { el.classList.add('hidden'); return; }

  const qs = p.quests || [];
  const avail = DATA.QUEST_POOL.filter(q =>
    !qs.some(x => x.id === q.id) && p.unlocked.includes(q.room));
  if (!qs.length && !avail.length) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');

  const doneN = qs.filter(q => q.have >= q.need).length;
  // 内容签名，避免每帧重建（重建会打断点击）
  const sig = qs.map(q => q.id + ':' + q.have + '/' + q.need).join(',')
    + '|' + doneN + '|' + avail.length + '|' + (G.qtCollapsed ? 1 : 0);
  if (sig === QT_SIG) return;
  QT_SIG = sig;

  el.classList.toggle('collapsed', !!G.qtCollapsed);

  let html = `<div class="qt-head">任务
    <b>${qs.length}</b>
    ${doneN ? `<span style="color:#5fdc4a;font-size:11px">· ${doneN} 可交</span>` : ''}
    <span class="qt-arr">▾</span></div><div class="qt-body">`;

  if (!qs.length) {
    html += '<div class="qt-empty">没有进行中的任务</div>';
  } else {
    qs.forEach(q => {
      const done = q.have >= q.need;
      const pct = Math.min(100, q.have / q.need * 100);
      html += `<div class="qt-item${done ? ' done' : ''}">
        <span class="qt-nm">${q.name}</span>
        <span class="qt-prog">${q.have}/${q.need}</span>
        ${done ? `<button class="claim" data-qt-claim="${q.id}">领取</button>` : ''}
      </div>
      <div class="qt-bar"><i style="width:${pct}%;${done ? 'background:#5fdc4a' : ''}"></i></div>`;
    });
  }

  html += '<div class="qt-actions">';
  html += `<button data-qt-claim-all ${doneN ? '' : 'disabled'}>一键交任务${doneN ? ' ' + doneN : ''}</button>`;
  html += `<button data-qt-accept-all ${avail.length ? '' : 'disabled'}>一键接任务${avail.length ? ' ' + avail.length : ''}</button>`;
  html += '</div></div>';
  el.innerHTML = html;
}

/* 一键领取所有已完成任务 */
function claimAllQuests() {
  const p = G.player;
  const done = (p.quests || []).filter(q => q.have >= q.need);
  if (!done.length) { toast('没有可领取的任务'); return; }
  let exp = 0, gold = 0, n = 0;
  const mats = {};
  done.forEach(q => {
    exp += q.exp; gold += q.gold;
    mats[q.mat] = (mats[q.mat] || 0) + q.matN;
    n++;
  });
  gainExp(p, exp);
  p.gold += gold;
  for (const k in mats) p.materials[k] = (p.materials[k] || 0) + mats[k];
  p.quests = p.quests.filter(q => q.have < q.need);
  p.questDone += n;
  const matTxt = Object.keys(mats).map(k => `${DATA.MATERIALS[k].name}×${mats[k]}`).join(' ');
  toast(`✅ 交付 ${n} 个任务：+${exp} 经验 +${fmt(gold)} 金 ${matTxt}`);
  logMsg(`✔ 一键交付 ${n} 个委托`, 'level');
  QT_SIG = '';
  saveGame();
}

/* ---------------- Toast ---------------- */
let toastTimer = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 1700);
}

/* ---------------- 弹窗（同键可关闭） ---------------- */
function openModal(key, title, html) {
  MODAL_KEY = key;
  $('modalTitle').textContent = title;
  $('modalBody').innerHTML = html;
  $('modal').classList.remove('hidden');
  bindModal();
  if (key === 'char') requestAnimationFrame(drawCharPortrait);
}
function closeModal() {
  $('modal').classList.add('hidden');
  MODAL_KEY = null;
  hideTooltip();
}
function isModalOpen(key) {
  return !$('modal').classList.contains('hidden') && MODAL_KEY === key;
}
/* 同键切换：开着就关，关着就开 */
function toggleModal(key, title, htmlFn) {
  if (isModalOpen(key)) { closeModal(); return; }
  openModal(key, title, htmlFn());
}

/* 角色面板立绘：把行走图放大画进 canvas */
function drawCharPortrait() {
  const cv = document.getElementById('charPortrait');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const p = G.player;
  ctx.clearRect(0, 0, cv.width, cv.height);

  const g = ctx.createRadialGradient(cv.width/2, cv.height*0.6, 6, cv.width/2, cv.height*0.6, cv.width*0.85);
  g.addColorStop(0, 'rgba(212,175,55,.22)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, cv.width, cv.height);

  if (!imgReady('units')) return;
  const ci = ['warrior','mage','archer','assassin'].indexOf(p.cls);
  if (ci < 0) return;
  const S = 3.1, sw = U_FRAME_W * S, sh = U_FRAME_H * S;
  const frame = Math.floor(G.time * 5) % 4;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(IMG.units, ci * 128 + frame * U_FRAME_W, 0, U_FRAME_W, U_FRAME_H,
                (cv.width - sw) / 2, cv.height - sh - 2, sw, sh);
}

/* 技能悬浮：说明 + 预计伤害 */
function showSkillTip(k, x, y) {
  const p = G.player;
  if (!p) return;
  const key = (k === 'd') ? p.dash : (p.keymap ? p.keymap[k] : null);
  const sp = DATA.SKILLS[key];
  if (!sp) return;

  const lv = p.skills[key] || 1;
  const mul = 1 + (lv - 1) * 0.2;
  const isActive = sp.type !== 'passive';
  const cd = p.cd && p.cd[key] ? p.cd[key] : 0;

  let html = `<h4 style="color:${sp.color || '#ffd24a'}">${sp.name} <small style="color:#8f8570">Lv.${lv}</small></h4>`;
  html += `<div class="tt-sub">${isActive ? '主动技能' : '被动技能'}${sp.kind ? ' · ' + kindName(sp.kind) : ''}</div>`;
  if (isActive) {
    html += `<div style="font-size:11px;color:#7fd4ff">冷却 ${sp.cd || 0}s　${sp.cost ? '法力 ' + sp.cost : '无消耗'}</div>`;
    if (cd > 0) html += `<div style="font-size:11px;color:#ff8a7a">冷却中 ${cd.toFixed(1)}s</div>`;
    if (sp.dmg) {
      const dmg = Math.round(p.stats.power * (p.stats.skillMul || 1) * sp.dmg * mul);
      html += `<div style="margin-top:4px;border-top:1px dotted rgba(184,173,147,.25);padding-top:4px">`;
      html += `<div class="tt-up" style="font-size:13px;font-weight:700">预计伤害 ${fmt(dmg)}</div>`;
      html += `<div style="font-size:11px;color:#8f8570">伤害系数 ${(sp.dmg * 100).toFixed(0)}% × 技能等级 ${(mul * 100).toFixed(0)}%</div>`;
      if (sp.radius) html += `<div style="font-size:11px;color:#8f8570">作用范围 ${sp.radius}</div>`;
      html += `</div>`;
    }
  }
  html += `<div class="tt-desc">${sp.desc || ''}</div>`;
  showTipHtml(html, x, y);
}

function kindName(k) {
  return ({ aoe:'范围', melee:'近战', proj:'投射物', dash:'位移', blink:'闪现',
            buff:'增益', trap:'陷阱' })[k] || k;
}

function bindSkillTips() {
  document.querySelectorAll('.cc-btn.skill').forEach(btn => {
    btn.addEventListener('mouseenter', e => showSkillTip(btn.dataset.skill, e.clientX, e.clientY));
    btn.addEventListener('mousemove', e => moveTooltip(e.clientX, e.clientY));
    btn.addEventListener('mouseleave', hideTooltip);
  });
}

/* ---------------- 命令 ---------------- */
function handleCommand(act) {
  if (G.screen !== 'game') return;
  switch (act) {
    case 'autoAtk':
      AUTO.atk = !AUTO.atk;
      toast(AUTO.atk ? '自动攻击：开' : '自动攻击：关');
      break;
    case 'autoSkill':
      AUTO.skill = !AUTO.skill;
      toast(AUTO.skill ? '自动技能：开' : '自动技能：关');
      if (AUTO.skill && !AUTO.atk) { AUTO.atk = true; toast('自动技能已开启（同时开启自动攻击）'); }
      break;
    case 'potion': usePotion(); break;
    case 'bag': toggleModal('bag', '背包 · 装备', () => bagHtml()); break;
    case 'char': toggleModal('char', '角色', () => charHtml()); break;
    case 'skill': toggleModal('skill', '技能', () => skillHtml()); break;
    case 'map': toggleModal('map', '传送 / 回城', () => townMapHtml()); break;
    case 'town': goTown(); break;
    case 'quest': toggleModal('quest', '任务官 · 罗兰', questHtml); break;
    case 'craft': toggleModal('craft', '锻造台', craftHtml); break;
    case 'tower': toggleModal('tower', '爬塔 · 试炼之塔', towerHtml); break;
    case 'enhance': toggleModal('enhance', '铁匠 · 装备强化', enhanceHtml); break;
    case 'sellWorse': {
      const r = sellAllWorse(G.player);
      toast(r.n ? `已出售 ${r.n} 件低战力装备，+${fmt(r.gold)} 金` : '没有需要出售的装备');
      if (r.n) { logMsg(`一键出售 ${r.n} 件，+${fmt(r.gold)} 金`, 'loot'); saveGame(); }
      if (isModalOpen('bag')) openModal('bag', '背包 · 装备', bagHtml());
      break;
    }
    case 'autoSell':
      G.autoSell = !G.autoSell;
      toast(G.autoSell ? '自动出售：开（低战力装备直接折现）' : '自动出售：关');
      break;
    case 'save': saveGame() ? toast('已存档') : toast('存档失败'); break;
    case 'export': exportSave(); break;
    case 'settings': toggleModal('settings', '设置', () => settingsHtml()); break;
  }
}

/* 喝药：优先红药（血少时），否则蓝药 */
function usePotion() {
  const p = G.player;
  const needHp = p.hp < p.stats.hpMax * 0.6;
  let idx = -1, best = null;
  p.bag.forEach((it, i) => {
    if (it.type !== 'potion') return;
    if (needHp && it.hp) { if (!best || it.hp > best.hp) { best = it; idx = i; } }
    else if (!needHp && it.mp) { if (!best || it.mp > best.mp) { best = it; idx = i; } }
  });
  if (!best && !needHp) {
    // 血少但没红药 → 找蓝药
    p.bag.forEach((it, i) => { if (it.type === 'potion' && it.mp) { best = it; idx = i; } });
  }
  if (!best) { toast('没有药水了'); return; }
  if (best.hp) p.hp = Math.min(p.stats.hpMax, p.hp + best.hp);
  if (best.mp) p.mp = Math.min(p.stats.mpMax, p.mp + best.mp);
  consumePotion(p, best.key, 1);
  toast(`喝下 ${best.name}（剩 ${(p.bag.find(x=>x.key===best.key)?.count)||0}）`);
  if (isModalOpen('bag')) openModal('bag', '背包 · 装备', bagHtml());
}

/* ---------------- 背包 ---------------- */
function bagHtml() {
  const p = G.player;
  const page = clamp(p.bagPage || 0, 0, BAG_PAGES - 1);
  const start = page * BAG_PAGE_SIZE, end = start + BAG_PAGE_SIZE;
  const idx = DATA.QUALITY.findIndex(q => q.key === (p.equip.weapon?.qKey || ''));

  let html = `<div class="bag-toolbar">
    <button class="sm-btn danger" data-act="sellWorse">一键出售低战力</button>
    <label class="auto-toggle">
      <input type="checkbox" data-toggle-autosell ${G.autoSell ? 'checked' : ''}>
      <span>自动出售低战力</span>
    </label>
    <span class="bag-count">${p.bag.length} / ${BAG_MAX}</span>
  </div>`;

  html += '<div class="bag-pager">';
  for (let i = 0; i < BAG_PAGES; i++) {
    html += `<button class="pg-btn ${i === page ? 'on' : ''}" data-bag-page="${i}">${i + 1}</button>`;
  }
  html += '<span class="pg-tip">背包 ' + BAG_PAGES + ' 页 · 每页 ' + BAG_PAGE_SIZE + ' 格</span></div>';

  html += '<div class="bag-grid">';
  for (let i = start; i < end; i++) {
    const it = p.bag[i];
    if (!it) { html += '<div class="bag-cell empty">—</div>'; continue; }
    if (it.type === 'potion') {
      html += `<div class="bag-cell potion" data-potion="${it.key}">
        <div class="ic" style="color:${it.color}">⚗</div>
        <div class="nm" style="color:${it.color}">${it.name}</div>
        <span class="stack">×${it.count || 1}</span></div>`;
    } else {
      const dCP = equipDeltaPower(p, it);
      const locked = it.reqLv > p.level;
      html += `<div class="bag-cell${locked ? ' locked' : ''}" data-item="${it.id}">
        ${iconTag(it.slot, 30)}
        <div class="nm" style="color:${it.color}">${it.name}</div>
        ${!locked && dCP > 0 ? '<span class="up">▲</span>' : ''}
        <span class="cp-mini">${dCP > 0 ? '+' : ''}${dCP}</span>
        ${locked ? `<span class="lock-tag">需 Lv.${it.reqLv}</span>` : ''}</div>`;
    }
  }
  html += '</div>';
  html += `<div style="margin-top:10px;font-size:11px;color:#8f8570">
    左键装备 · 右键出售　|　战力 <b style="color:#ffd24a">${fmt(combatPower(p))}</b></div>`;
  return html;
}

function charHtml() {

function skillHtml() {
  const p = G.player;
  const all = DATA.CLASSES[p.cls].skills;
  const km = p.keymap;
  const actives = all.filter(k => DATA.SKILLS[k].type === 'active');
  const passives = all.filter(k => DATA.SKILLS[k].type === 'passive');
  const keyOf = k => (k === p.dash ? 'D' : Object.keys(km).find(x => km[x] === k)?.toUpperCase() || '·');

  let html = `<div style="display:flex;gap:16px;font-size:12px;margin-bottom:10px;padding:6px 10px;
    background:rgba(60,48,28,.4);border:1px solid rgba(138,109,59,.5);border-radius:3px">
    <span style="color:#3fd45a">技能强化券 ×${p.materials.skillT||0}</span>
    <span style="color:#b45cff">技能突破券 ×${p.materials.breakT||0}</span>
    <span style="color:#8f8570">杀怪 +${DATA.SKILL_TIER.killProf}%／只　强化券 +${DATA.SKILL_TIER.ticketProf}%</span>
  </div><div class="skill-section"><h4>主动技能</h4>`;
  for (const k of actives) {
    const sp = DATA.SKILLS[k], lv = p.skills[k] || 0;
    const pf = skillProfOf(p, k);
    const pct = (pf.prof / DATA.SKILL_TIER.needProf * 100).toFixed(0);
    const full = pf.prof >= DATA.SKILL_TIER.needProf;
    const canBreak = full && pf.tier < DATA.SKILL_TIER.maxTier;
    const dmgUp = Math.round((DATA.SKILL_TIER.tierDmg * (pf.tier - 1)) * 100);
    const cdDown = Math.round((DATA.SKILL_TIER.tierCd * (pf.tier - 1)) * 100);
    html += `<div class="skill-row ${lv?'learned':''}">
      <div class="sk-ic">${keyOf(k)}</div>
      ${skillIconTag(k, 30)}
      <div class="sk-main"><div class="sk-name">${sp.name}
        <small>Lv.${lv}</small>
        <small style="color:#ffd24a">${pf.tier} 层</small>
        ${dmgUp||cdDown ? `<small style="color:#5fdc4a">+${dmgUp}%伤害 / -${cdDown}%CD</small>` : ''}</div>
      <div class="sk-desc">${sp.desc}　冷却 ${sp.cd}s${sp.cost?'　法力 '+sp.cost:''}</div>
      <div class="prof-bar"><i style="width:${pct}%;background:${full?'#ffd24a':'#5b3fa8'}"></i>
        <span>${pf.prof.toFixed(0)} / ${DATA.SKILL_TIER.needProf}</span></div>
      </div>
      ${canBreak
        ? `<button class="sk-btn ${(p.materials.breakT||0)>0?'':'lack'}" data-break-skill="${k}">
             突破 → ${pf.tier+1} 层<br><small>突破券 ${p.materials.breakT||0}/1</small></button>`
        : (pf.tier >= DATA.SKILL_TIER.maxTier
            ? `<button class="sk-btn" disabled>已满 5 层</button>`
            : `<button class="sk-btn" disabled>熟练度未满</button>`)}
    </div>`;
  }
  html += '</div><div class="skill-section"><h4>被动技能（最多 3 个）</h4>';
  for (const k of passives) {
    const sp = DATA.SKILLS[k], lv = p.skills[k] || 0;
    const eq = p.passive.indexOf(k);
    html += `<div class="skill-row ${lv?'learned':''}">
      <div class="sk-ic">${lv?lv:'?'}</div>
      <div class="sk-main"><div class="sk-name">${sp.name}${lv?`<small>Lv.${lv}</small>`:'<small style="color:#8f8570">未学习</small>'}
        ${eq>=0?'<small style="color:#3fd45a">已装备</small>':''}</div>
      <div class="sk-desc">${sp.desc}</div></div>
      ${lv?`<button class="sk-btn" data-equip-passive="${k}" ${eq>=0?'disabled':''}>${eq>=0?'已装备':'装备'}</button>`:''}
    </div>`;
  }
  return html + '</div><div style="font-size:11px;color:#8f8570">技能书由怪物掉落，或在兑换员处购买</div>';
}

/* ---------------- NPC ---------------- */
function nearestNPC() {
  const w = G.world, p = G.player;
  if (!w || !w.npcs.length) return null;
  let best = null, bd = 95;
  for (const n of w.npcs) {
    const d = Math.hypot(n.x - p.x, (n.y - p.y) * 0.9);
    if (d < bd) { bd = d; best = n; }
  }
  return best;
}

/* 点击位置附近（40px 内）的 NPC */
function npcAt(wx, wy) {
  const w = G.world;
  if (!w) return null;
  for (const n of w.npcs) {
    if (Math.hypot(n.x - wx, (n.y - wy) * 0.9) < 46) return n;
  }
  return null;
}

function interactNPC(target) {
  const n = target || nearestNPC();
  if (!n) return;
  switch (n.kind) {
    case 'teleport': openTownMap(); break;
    case 'merchant': toggleModal('merchant', '商人 · 地精', merchantHtml); break;
    case 'exchange': toggleModal('exchange', '兑换员 · 凯恩', exchangeHtml); break;
    case 'blacksmith': toggleModal('smith', '铁匠 · 格罗姆', smithHtml); break;
    case 'save': saveGame() ? toast('进度已保存') : toast('保存失败'); break;
    case 'quest': toggleModal('quest', '任务官 · 罗兰', questHtml); break;
    case 'craft': toggleModal('craft', '锻造台', craftHtml); break;
  }
}

/* 等级警告 */
function warnHtml(room, diff) {
  const p = G.player, r = DATA.ROOMS[room], d = DATA.DIFFICULTY[diff];
  const gap = r.lv - p.level;
  const danger = gap >= 10 ? '极度危险' : gap >= 5 ? '危险' : '稍有挑战';
  const dc = gap >= 10 ? '#ff3b3b' : gap >= 5 ? '#ff9a2e' : '#ffd24a';
  const boss = DATA.BOSSES[r.boss];
  const estHp = Math.round(boss.hp * d.hpMul);
  const myDps = Math.round(p.stats.power * p.stats.as);
  const secs = Math.round(estHp / Math.max(1, myDps));
  const survive = Math.round(p.stats.hpMax / Math.max(1, boss.atk * d.atkMul * 1.4));

  return `<div style="text-align:center;margin-bottom:14px">
    <div style="font-family:var(--serif);font-size:22px;color:${dc};letter-spacing:.1em">${danger}</div>
    <div style="font-size:13px;color:#b8ad93;margin-top:6px">你的等级 <b style="color:#fff">${p.level}</b>　本图推荐 <b style="color:#ff9a6a">${r.lv}+</b></div>
  </div>
  <div class="enh-line"><span>房间</span><b>${r.name}（${d.name}难度）</b></div>
  <div class="enh-line"><span>BOSS</span><b>${boss.name} · 生命 ${fmt(estHp)}</b></div>
  <div class="enh-line"><span>你的输出</span><b>约 ${fmt(myDps)} DPS</b></div>
  <div class="enh-line"><span>预计击杀耗时</span><b class="${secs>90?'bad':secs>45?'warn':'ok'}">${secs} 秒</b></div>
  <div class="enh-line"><span>可承受伤害</span><b class="${survive<secs?'bad':'ok'}">${survive} 秒</b></div>
  ${survive < secs ? '<div style="text-align:center;color:#ff6b5a;font-size:12px;margin-top:10px">⚠ 按当前装备，你可能打不过这个 BOSS</div>' : ''}
  <div class="enh-btns">
    <button class="big-btn primary" data-enter-confirm="1" data-room="${room}" data-diff="${diff}">仍然进入</button>
    <button class="big-btn" data-enter-cancel="1">返回</button>
  </div>`;
}

  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

  if (!G.tower) G.tower = { active:false, floor:1, best:0, date:todayStr(), attempts:DATA.TOWER.dailyAttempts };
  if (G.tower.date !== todayStr()) {
    G.tower.date = todayStr();
    G.tower.attempts = DATA.TOWER.dailyAttempts;
  }
}

  html += `<div class="npc-row"><div><div class="nr-name">从第 1 层重来</div>
    <div class="nr-info">重新挑战，消耗 1 次机会</div></div>
    <button data-tower-start="1" ${t.attempts > 0 ? '' : 'disabled'}>重来</button></div>`;
  html += '</div>';
  html += '<div style="font-size:11px;color:#8f8570;margin-top:10px">每层奖励：金币 · 强化石 · 强化保护券(每5层) · 技能强化券(每3层) · 技能突破券(每10层)</div>';
  return html;
}
function enterTower(floor, free) {
  towerInit();
  const t = G.tower;
  if (!free) {
    if (t.attempts <= 0) { toast('今日爬塔次数已用完'); return; }
    t.attempts--;
  }
  t.active = true;
  t.floor = floor || 1;
  G.diff = 'normal';
  closeModal();
  enterRoom((t.floor - 1) % DATA.ROOMS.length);
  toast(`爬塔 · 第 ${t.floor} 层`);
}
function clearTowerFloor() {
  const t = G.tower;
  if (!t || !t.active) return;
  const p = G.player;
  const r = DATA.TOWER.reward(t.floor);
  p.gold += r.gold;
  p.materials.stone = (p.materials.stone || 0) + r.stone;
  if (r.protect) p.materials.protect = (p.materials.protect || 0) + r.protect;
  if (r.skillT) p.materials.skillT = (p.materials.skillT || 0) + r.skillT;
  if (r.breakT) p.materials.breakT = (p.materials.breakT || 0) + r.breakT;
  t.best = Math.max(t.best || 0, t.floor);
  toast(`✅ 第 ${t.floor} 层通过：+${fmt(r.gold)} 金 · 强化石×${r.stone}`);
  saveGame();
  if (t.floor >= DATA.TOWER.maxFloor) {
    t.active = false;
    toast('🎉 通关全部 20 层！');
    logMsg('🎉 爬塔通关 20 层', 'level');
    const p2 = G.player;
    if (!p2.reviveRingGot) {
      p2.reviveRingGot = true;
      const ring = makeRing(DATA.SPECIAL_RINGS.revive, 'revive');
      equipSpecialRing(p2, ring);
      toast('🎁 获得【复活之戒】！');
      logMsg('🎁 通关奖励：复活之戒（死亡时原地复活）', 'level');
    }
    saveGame();
    return;
  }
  t.floor++;
  setTimeout(() => { if (t.active) enterTower(t.floor, true); }, 900);
}

/* 第二步：选中某件装备 → 强化详情 */
function enhanceItemHtml(id) {
  const p = G.player;
  const it = findItem(id);
  if (!it) return enhanceHtml();

  const lv = it.enh || 0;
  const maxed = lv >= DATA.ENHANCE.max;
  const gold = DATA.ENHANCE.goldCost(lv);
  const stone = DATA.ENHANCE.stoneCost(lv);
  const rate = Math.round(DATA.ENHANCE.rate(lv) * 100);
  const curMul = DATA.ENHANCE.statMul(lv);
  const nextMul = DATA.ENHANCE.statMul(Math.min(lv + 1, DATA.ENHANCE.max));
  const delta = Math.round((nextMul - curMul) * 100);
  const onBody = Object.values(p.equip).some(e => e && e.id === it.id);

  let html = matBar(p);
  html += `<div class="enh-head">
    ${iconTag(it.slot, 56)}
    <div>
      <div class="enh-name" style="color:${it.color}">+${lv} ${it.name}</div>
      <div class="enh-sub">${DATA.QUALITY.find(q => q.key === it.qKey).name} · ${DATA.SLOTS[it.slot].name} · 物品等级 ${it.ilvl}
        ${onBody ? '<span style="color:#5fdc4a">· 已穿戴</span>' : '<span style="color:#8f8570">· 在背包</span>'}</div>
    </div>
  </div>`;

  // 属性变化
  html += '<div class="enh-attrs">';
  if (it.effect) {
    for (const k in it.effect) {
      const v0 = it.effect[k] * curMul, v1 = it.effect[k] * nextMul;
      const nm = (typeof RING_COLORS !== 'undefined' && RING_COLORS[k]) ? RING_COLORS[k].name : k;
      html += `<div class="enh-attr"><span>${nm}效果</span>
        <b>${(v0 * 100).toFixed(1)}%</b><i>→</i><b class="up">${maxed ? '—' : (v1 * 100).toFixed(1) + '%'}</b></div>`;
    }
  }
  for (const k in it.stats) {
    const v0 = it.stats[k] * curMul, v1 = it.stats[k] * nextMul;
    const pct = PCT_KEYS.includes(k);
    const f = x => pct ? (x * 100).toFixed(1) + '%' : Math.round(x);
    html += `<div class="enh-attr"><span>${AFFIX_NAMES[k] || k}</span>
      <b>${f(v0)}</b><i>→</i><b class="up">${maxed ? '—' : f(v1)}</b></div>`;
  }
  html += '</div>';

  if (maxed) {
    html += '<div class="enh-big" style="color:#ffd24a">已达最高强化等级 +15</div>';
  } else {
    html += `<div class="enh-lv">强化等级 <b>+${lv}</b> → <b style="color:#5fdc4a">+${lv + 1}</b></div>`;
    html += `<div class="enh-line"><span>成功率</span><b class="${rate >= 100 ? 'ok' : rate >= 70 ? 'warn' : 'bad'}">${rate}%</b></div>`;
    html += `<div class="enh-line"><span>属性提升</span><b>+${delta}%</b></div>`;
    html += `<div class="enh-line"><span>消耗金币</span><b class="${p.gold >= gold ? '' : 'bad'}">${fmt(gold)} / ${fmt(p.gold)}</b></div>`;
    html += `<div class="enh-line"><span>消耗强化石</span><b class="${(p.materials.stone||0) >= stone ? '' : 'bad'}">${stone} / ${p.materials.stone||0}</b></div>`;
    if (lv >= 11) {
      html += `<div class="enh-line"><span>失败惩罚</span><b class="bad">掉 1 级（用保护券可免）</b></div>`;
    }
    html += '<div class="enh-btns">';
    html += `<button class="big-btn primary" data-enh-do="${it.id}" data-protect="0">强化</button>`;
    if (lv >= 11) {
      html += `<button class="big-btn" data-enh-do="${it.id}" data-protect="1"
        ${(p.materials.protect||0) > 0 ? '' : 'disabled'}>用保护券强化（${p.materials.protect||0}）</button>`;
    }
    html += '<button class="big-btn" data-enh-back="1">返回</button>';
    html += '</div>';
  }
  return html;
}

      </div>`;
    });

  }

    html += '<div style="color:#6b6558;font-size:12px;padding:8px">已接完所有悬赏</div>';
  }
  avail.forEach(q => {
    const unlocked = p.unlocked.includes(q.room);
    html += `<div class="npc-row"><div>
      <div class="nr-name" style="${unlocked ? '' : 'color:#5a5348'}">${q.name}</div>
      <div class="nr-info">${DATA.ROOMS[q.room].name} · 击杀 ${q.need} 只</div>
      <div class="nr-info" style="color:#ffd98a">${q.exp} 经验 · ${q.gold} 金 · ${DATA.MATERIALS[q.mat].name} ×${q.matN}</div>
      </div><button data-quest-accept="${q.id}" ${unlocked ? '' : 'disabled'}>${unlocked ? '接取' : '未解锁'}</button></div>`;
  });

}

function acceptQuest(id) {
  const p = G.player;
  if (!Array.isArray(p.quests)) p.quests = [];
  const q = DATA.QUEST_POOL.find(x => x.id === id);
  if (!q) return;
  if (p.quests.some(x => x.id === id)) { toast('已接取该任务'); return; }
  if (!p.unlocked.includes(q.room)) { toast('该房间尚未解锁'); return; }
  p.quests.push({ ...q, have: 0 });
  toast(`接取任务：${q.name}`);
  QT_SIG = '';
  openModal('quest', '任务官 · 罗兰', questHtml());
}

function acceptAllQuests() {
  const p = G.player;
  if (!Array.isArray(p.quests)) p.quests = [];
  let n = 0;
  DATA.QUEST_POOL.forEach(q => {
    if (p.quests.some(x => x.id === q.id)) return;
    if (!p.unlocked.includes(q.room)) return;
    p.quests.push({ ...q, have: 0 });
    n++;
  });
  toast(n ? `一键接取 ${n} 个任务` : '没有可接取的任务');
  QT_SIG = '';
  openModal('quest', '任务官 · 罗兰', questHtml());
}

function claimQuest(id) {
  const p = G.player;
  const i = (p.quests || []).findIndex(q => q.id === (id || ''));
  if (i < 0) return;
  const q = p.quests[i];
  if (q.have < q.need) { toast('任务尚未完成'); return; }
  gainExp(p, q.exp);
  p.gold += q.gold;
  p.materials[q.mat] = (p.materials[q.mat] || 0) + q.matN;
  p.questDone++;
  p.quests.splice(i, 1);
  toast(`任务完成：+${q.exp} 经验 +${q.gold} 金 +${DATA.MATERIALS[q.mat].name}×${q.matN}`);
  logMsg(`✔ 完成委托「${q.name}」`, 'level');
  saveGame();
  openModal('quest', '任务官 · 罗兰', questHtml());
}

function dropQuest(id) {
  const p = G.player;
  const i = (p.quests || []).findIndex(q => q.id === id);
  if (i < 0) return;
  const q = p.quests.splice(i, 1)[0];
  toast(`已放弃「${q.name}」`);
  openModal('quest', '任务官 · 罗兰', questHtml());
}

    const n = p.materials[k] || 0;
    html += `<span style="color:${n > 0 ? m.color : '#5a5348'}">${m.name} ×${n}</span>`;
  });
  html += `<span style="margin-left:auto;color:#ffd24a">金币 ${fmt(p.gold)}</span></div>`;

  // ---- 配方 ----
  html += '<div class="npc-list">';
  DATA.CRAFT.forEach((c, i) => {
    const q = DATA.QUALITY.find(x => x.key === c.quality);
    const okMat = Object.keys(c.need).every(k => (p.materials[k] || 0) >= c.need[k]);
    const okGold = p.gold >= c.gold;
    const can = okMat && okGold;

    let needTxt = Object.keys(c.need).map(k => {
      const have = p.materials[k] || 0, need = c.need[k];
      const ok = have >= need;
      return `<span style="color:${ok ? '#7fd4a8' : '#ff8a7a'}">${DATA.MATERIALS[k].name} ${have}/${need}</span>`;

          <span style="color:${okGold ? '#ffd24a' : '#ff8a7a'}">+ ${c.gold} 金</span></div>
        <div class="nr-info" style="color:#6b6558">产出：${q.name}品质随机部位（武器/头盔/胸甲/护腿/战靴/项链/戒指/饰品）</div>
      </div>
      <button data-craft="${i}" ${can ? '' : 'disabled'}>${can ? '锻造' : '材料不足'}</button>
    </div>`;
