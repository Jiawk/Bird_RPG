}

function doCraft(i) {
  const p = G.player, c = DATA.CRAFT[i];
  if (!c) return;
  if (!Object.keys(c.need).every(k => (p.materials[k]||0) >= c.need[k])) { toast('材料不足'); return; }
  if (p.gold < c.gold) { toast('金币不足'); return; }
  Object.keys(c.need).forEach(k => { p.materials[k] -= c.need[k]; });
  p.gold -= c.gold;
  const slot = pick(Object.keys(DATA.SLOTS));
  const lvl = Math.max(6, Math.min(28, p.level + 4));
  const it = makeItem(slot, lvl, c.quality, p.stats.isMagic);
  if (!addToBag(p, it)) { p.gold += 30; }
  toast(`锻造出 ${it.name}`);
  logMsg(`⚒ 锻造：${it.name}`, 'loot');
  saveGame();
  openModal('craft', '锻造台', craftHtml());
}

/* ---------------- 弹窗事件 ---------------- */
function bindModal() {
  const body = $('modalBody');

  body.querySelectorAll('[data-pick-room]').forEach(b => b.onclick = () => {
    const i = +b.dataset.pickRoom;
    if (!G.player.unlocked.includes(i)) { toast('尚未解锁'); return; }
    openModal('map', '选择难度 · ' + DATA.ROOMS[i].name, diffPickHtml(i));
  });

  body.querySelectorAll('[data-pick-diff]').forEach(b => b.onclick = () => {
    const diff = b.dataset.pickDiff, room = +b.dataset.room;
    if (!G.player.unlocked.includes(room)) { toast('尚未解锁'); return; }
    const r = DATA.ROOMS[room], p = G.player;
    // 等级不足 → 警告
    if (p.level < r.lv) {
      openModal('warn', '⚠ 等级警告', warnHtml(room, diff));
      return;
    }
    doEnterRoom(room, diff);
  });
  body.querySelectorAll('[data-enter-confirm]').forEach(b => b.onclick = () => {
    doEnterRoom(+b.dataset.room, b.dataset.diff);
  });
  body.querySelectorAll('[data-enter-cancel]').forEach(b => b.onclick = () => {
    openModal('map', '传送 / 回城', townMapHtml());
  });

  body.querySelectorAll('[data-buy-potion]').forEach(b => b.onclick = () => {
    const po = DATA.POTIONS.find(x => x.key === b.dataset.buyPotion);
    const p = G.player;
    if (p.gold < po.price) return;
    p.gold -= po.price;
    p.bag.push({ ...po, type:'potion' });
    toast(`购买 ${po.name}`);
    openModal('merchant', '商人 · 地精', merchantHtml());
  });

  body.querySelectorAll('[data-buy-skill]').forEach(b => b.onclick = () => {
    const k = b.dataset.buySkill, p = G.player;
    const lv = p.skills[k] || 0, price = 220 + lv * 380;
    if (p.gold < price || lv >= 5) return;
    p.gold -= price;
    const r = learnSkill(p, k);
    toast(r === 'new' ? `学会 ${DATA.SKILLS[k].name}` : `${DATA.SKILLS[k].name} 升级`);
    openModal('exchange', '兑换员 · 凯恩', exchangeHtml());
  });

  body.querySelectorAll('[data-sell]').forEach(b => b.onclick = () => {
    const it = G.player.bag.find(x => x.id === b.dataset.sell);
    if (it) { sellItem(G.player, it); openModal('smith', '铁匠 · 格罗姆', smithHtml()); }
  });

  body.querySelectorAll('[data-equip-passive]').forEach(b => b.onclick = () => {
    const k = b.dataset.equipPassive, p = G.player;
    const idx = p.passive.indexOf(null);
    if (idx < 0) { toast('被动栏已满'); return; }
    p.passive[idx] = k; recalcStats(p);
    openModal('skill', '技能', skillHtml());
  });

  body.querySelectorAll('[data-item]').forEach(el => {
    const it = findItem(el.dataset.item);
    if (!it) return;
    el.onmouseenter = e => showTooltip(it, e.clientX, e.clientY);
    el.onmousemove = e => moveTooltip(e.clientX, e.clientY);
    el.onmouseleave = hideTooltip;
    el.onclick = () => {
      if (el.dataset.slot) { unequipItem(G.player, el.dataset.slot); openModal('bag','背包 · 装备', bagHtml()); return; }
      if (it.reqLv > G.player.level) { toast(`等级不足：需要 Lv.${it.reqLv}（当前 ${G.player.level}）`); return; }
      equipItem(G.player, it); openModal('bag','背包 · 装备', bagHtml());
    };
    el.oncontextmenu = e => {
      e.preventDefault();
      if (!el.dataset.slot) { sellItem(G.player, it); openModal('bag','背包 · 装备', bagHtml()); }
    };
  });

  body.querySelectorAll('[data-potion]').forEach(el => el.onclick = () => {
    const p = G.player;
    const po = p.bag.find(x => x.type === 'potion' && x.key === el.dataset.potion);
    if (!po) return;
    if (po.hp) p.hp = Math.min(p.stats.hpMax, p.hp + po.hp);
    if (po.mp) p.mp = Math.min(p.stats.mpMax, p.mp + po.mp);
    consumePotion(p, po.key, 1);
    openModal('bag','背包 · 装备', bagHtml());
  });

  body.querySelectorAll('[data-act-town]').forEach(b => b.onclick = () => { closeModal(); goTown(); });
  body.querySelectorAll('[data-act-enhance]').forEach(b => b.onclick = () => openModal('enhance', '铁匠 · 装备强化', enhanceHtml()));
  body.querySelectorAll('[data-tower-start]').forEach(b => b.onclick = () => enterTower(+b.dataset.towerStart));
  body.querySelectorAll('[data-set-info]').forEach(b => b.onclick = () => {
    openModal('setinfo', '套装图鉴', setDetailHtml(b.dataset.setInfo));
  });
  body.querySelectorAll('[data-enh-pick]').forEach(b => b.onclick = () => {
    openModal('enhance', '锻造台 · 强化', enhanceItemHtml(b.dataset.enhPick));
  });
  body.querySelectorAll('[data-enh-back]').forEach(b => b.onclick = () => {
    openModal('enhance', '锻造台 · 装备强化', enhanceHtml());
  });
  body.querySelectorAll('[data-enh-do]').forEach(b => b.onclick = () => {
    const it = findItem(b.dataset.enhDo);
    if (!it) return;
    const res = enhanceItem(G.player, it, b.dataset.protect === '1');
    toast(res.msg);
    recalcStats(G.player);
    saveGame();
    openModal('enhance', '锻造台 · 强化', enhanceItemHtml(it.id));
  });
  body.querySelectorAll('[data-break-skill]').forEach(b => b.onclick = () => {
    const k = b.dataset.breakSkill;
    const r = breakthrough(G.player, k);
    toast(r === 'ok' ? `✅ 突破成功！${DATA.SKILLS[k].name} 升到第 ${skillProfOf(G.player,k).tier} 层`
        : r === 'max' ? '已是最高层（5 层）'
        : r === 'prof' ? `熟练度未满（${skillProfOf(G.player,k).prof.toFixed(0)}/${DATA.SKILL_TIER.needProf}）`
        : `❌ 缺少技能突破券（现有 ${G.player.materials.breakT||0} 张）`);
    openModal('skill', '技能', skillHtml());
  });
  body.querySelectorAll('[data-bag-page]').forEach(b => b.onclick = () => {
    G.player.bagPage = +b.dataset.bagPage;
    openModal('bag', '背包 · 装备', bagHtml());
  });
  body.querySelectorAll('[data-act="sellWorse"]').forEach(b => b.onclick = () => handleCommand('sellWorse'));
  body.querySelectorAll('[data-toggle-autosell]').forEach(cb => cb.onchange = () => {
    G.autoSell = cb.checked; toast(G.autoSell ? '自动出售：开' : '自动出售：关');
  });
  body.querySelectorAll('[data-quest-accept]').forEach(b => b.onclick = () => acceptQuest(b.dataset.questAccept));
  body.querySelectorAll('[data-quest-accept-all]').forEach(b => b.onclick = acceptAllQuests);
  body.querySelectorAll('[data-quest-drop]').forEach(b => b.onclick = () => dropQuest(b.dataset.questDrop));
  body.querySelectorAll('[data-quest-claim]').forEach(b => b.onclick = () => claimQuest(b.dataset.questClaim));
  body.querySelectorAll('[data-craft]').forEach(b => b.onclick = () => doCraft(+b.dataset.craft));
  body.querySelectorAll('[data-act-save]').forEach(b => b.onclick = () => { saveGame(); toast('已保存'); });
  body.querySelectorAll('[data-act-export]').forEach(b => b.onclick = exportSave);
  body.querySelectorAll('[data-act-reset]').forEach(b => b.onclick = () => {
    if (!confirm('确定删除当前角色重新开始吗？')) return;
    clearSave(); location.reload();
  });
}

function findItem(id) {
  const p = G.player;
  for (const s in p.equip) if (p.equip[s] && p.equip[s].id === id) return p.equip[s];
  return p.bag.find(x => x.id === id);
}

/* ---------------- Tooltip ---------------- */
const AFFIX_NAMES = { str:'力量', agi:'敏捷', int:'智力', vit:'体质', atk:'攻击力', spell:'法术强度',
  as:'攻击速度', crit:'暴击率', critDmg:'暴击伤害', armor:'护甲', hp:'生命值',
  dodge:'闪避率', lifesteal:'吸血', hit:'命中', mp:'法力值', all:'全属性' };
const PCT_KEYS = ['as','crit','critDmg','dodge','lifesteal','hit'];

function showTooltip(it, x, y) {
  hideTooltip();
  TIP = document.createElement('div');
  TIP.className = 'tooltip';
  if (it.type === 'potion') {
    TIP.innerHTML = `<h4 style="color:${it.color}">${it.name}</h4>
      <div class="tt-desc">${it.hp ? '回复 ' + it.hp + ' 生命' : '回复 ' + it.mp + ' 法力'}</div>`;
  } else {
    const q = DATA.QUALITY.find(x => x.key === it.qKey);
    const enhTxt = it.enh ? `<span style="color:#5fdc4a">+${it.enh}</span> ` : '';
    const parts = [`<h4 style="color:${it.color}">${enhTxt}${it.name}</h4>`,
      `<div class="tt-sub">${q.name} · ${DATA.SLOTS[it.slot].name} · 物品等级 ${it.ilvl}</div>`];
    if (it.wtype && DATA.WEAPON_KINDS[it.wtype]) {
      const K = DATA.WEAPON_KINDS[it.wtype];
      const own = K.cls.includes(G.player.cls);
      parts.push(`<div style="font-size:11px;margin-top:2px;color:${own ? '#5fdc4a' : '#8f8570'}">
        ${K.label}类${own ? ` · 本命武器 攻击 +${Math.round(K.bonus * 100)}%` : ' · 非本命（无加成）'}</div>`);
    }
    if (it.effect) {
      const m = enhMul(it);
      const lines = Object.keys(it.effect).map(k => {
        const v = (it.effect[k] * m * 100).toFixed(1);
        const nm = (typeof RING_COLORS !== 'undefined' && RING_COLORS[k]) ? RING_COLORS[k].name : k;
        return `${nm} ${v}%`;
      });
      parts.push(`<div style="color:${it.color};font-size:12px;margin-top:3px;font-weight:700">【特戒】${lines.join('　')}</div>`);
      if (it.enh) parts.push(`<div style="font-size:10px;color:#8f8570">强化 +${it.enh} 已加成到效果数值</div>`);
    }
    if (it.setKey) {
      const set = (DATA.SETS[G.player.cls] || []).find(x => x.key === it.setKey);
      if (set) {
        const n = setCount(G.player, set.key);
        parts.push(`<div style="color:${set.color};font-size:11px;margin-top:2px">【${set.name}】职业套装（${n}/6）</div>`);
      }
    }
    for (const k in it.stats) {
      const v = it.stats[k];
      parts.push(`<div class="tt-stat">+${PCT_KEYS.includes(k) ? (v*100).toFixed(1)+'%' : v} ${AFFIX_NAMES[k]||k}</div>`);
    }
    if (it.reqLv > G.player.level) {
      parts.push(`<div class="tt-req" style="font-size:12px;font-weight:700">⛔ 等级不足：需要 Lv.${it.reqLv}（当前 Lv.${G.player.level}）</div>`);
    }

    // 与已装备逐条对比
    const cur = G.player.equip[it.slot];
    if (cur) {
      const keys = new Set([...Object.keys(it.stats), ...Object.keys(cur.stats)]);
      const diffs = [];
      keys.forEach(k => {
        const d = (it.stats[k] || 0) - (cur.stats[k] || 0);
        if (Math.abs(d) < 1e-9) return;
        const pct = PCT_KEYS.includes(k);
        diffs.push(`<div class="${d>0?'tt-up':'tt-down'}">${d>0?'▲':'▼'} ${pct?(Math.abs(d)*100).toFixed(1)+'%':Math.abs(d)} ${AFFIX_NAMES[k]||k}</div>`);
      });
      if (diffs.length) parts.push('<div style="margin-top:5px;border-top:1px dotted rgba(184,173,147,.25);padding-top:4px">' + diffs.join('') + '</div>');
    }
    const dCP = equipDeltaPower(G.player, it);
    if (dCP !== 0) {
      parts.push(`<div class="tt-cp ${dCP>0?'tt-up':'tt-down'}">战力 ${dCP>0?'+':''}${dCP} ${dCP>0?'▲ 更强':'▼ 更弱'}</div>`);
    } else if (cur) {
      parts.push(`<div class="tt-cp">战力持平</div>`);
    }
    parts.push(`<div class="tt-desc">左键装备 / 右键出售</div>`);
    TIP.innerHTML = parts.join('');
  }
  document.body.appendChild(TIP);
  moveTooltip(x, y);
}

function moveTooltip(x, y) {
  if (!TIP) return;
  const r = TIP.getBoundingClientRect();
  let tx = x + 16, ty = y + 16;
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 12;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 12;
  TIP.style.left = Math.max(4, tx) + 'px';
  TIP.style.top = Math.max(4, ty) + 'px';
}

function hideTooltip() {
  if (TIP) { TIP.remove(); TIP = null; }
}

</script>
<script>
/* ===== js/main.js ===== */
/* ============================================================
   主程序：输入 / 自动战斗 / 主循环
   ============================================================ */
'use strict';

const Input = {
  keys: {}, mouse: { x: 0, y: 0, down: false, right: false },
  moveStick: { x: 0, y: 0, active: false },
  aimStick: { x: 0, y: 0, active: false },
  isTouch: false
};

let prevBossKills = 0;
let autoSaveAcc = 0;
let autoSkillCd = 0;

/* ---------------- 启动 ---------------- */
function startGame() {
  const p = G.player;
  prevBossKills = p.bossKills;
  showScreen('game');
  enterRoom(p.room === undefined ? TOWN : p.room);
  updateHUD(1);
  autoSaveAcc = 0;
}

/* ---------------- 输入 ---------------- */
function initInput() {
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    Input.keys[k] = true;
    if (G.screen !== 'game') return;

    // 技能 QWER + D 冲刺
    if (['q', 'w', 'e', 'r', 'd'].includes(k)) { castSkillKey(k); e.preventDefault(); return; }

    switch (k) {
      case 'a': handleCommand('autoAtk'); e.preventDefault(); break;
      case 's': handleCommand('autoSkill'); e.preventDefault(); break;
      case 'f': handleCommand('potion'); e.preventDefault(); break;
      case 'b': case 'i': handleCommand('bag'); e.preventDefault(); break;
      case 'c': handleCommand('char'); break;
      case 'k': handleCommand('skill'); break;
      case 'm': handleCommand('map'); break;
      case 't': handleCommand('tower'); break;   // 爬塔
      case 'j': handleCommand('quest'); break;   // 任务面板
      case 'h': handleCommand('town'); break;   // H = 回城
      case 'e': interactNPC(); break;
      case 'escape':
        if (!$('modal').classList.contains('hidden')) closeModal();
        else handleCommand('settings');
        break;
      case 'f5': e.preventDefault(); handleCommand('save'); break;   // 存档
      case ' ':
      case 'arrowup': case 'arrowdown': case 'arrowleft': case 'arrowright':
        e.preventDefault(); break;
    }
  });
  window.addEventListener('keyup', e => { Input.keys[e.key.toLowerCase()] = false; });

  CV.addEventListener('mousemove', e => { Input.mouse.x = e.clientX; Input.mouse.y = e.clientY; });
  CV.addEventListener('mousedown', e => {
    if (e.button === 0) { Input.mouse.down = true; Input.mouse.right = false; G.moveTarget = null; }
    if (e.button === 2) {
      Input.mouse.right = true;
      // 右键：点 NPC 就交互，否则走过去
      const wx = e.clientX + CAM.x;
      const wy = e.clientY / YS + CAM.y;
      const npc = npcAt(wx, wy);
      if (npc) { G.moveTarget = null; interactNPC(npc); return; }
      G.moveTarget = { x: wx, y: wy };
    }
  });
  window.addEventListener('mouseup', e => {
    if (e.button === 0) Input.mouse.down = false;
    if (e.button === 2) Input.mouse.right = false;   // 松开不停，继续走
  });
  // 全局禁用右键菜单（Mac 双指点按也不会弹出来）
  document.addEventListener('contextmenu', e => e.preventDefault());
  CV.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('resize', resizeCanvas);

  if ('ontouchstart' in window) {
    Input.isTouch = true;
    $('touch').classList.remove('hidden');
    setupSticks();
    $('tBtnAtk').addEventListener('touchstart', e => { e.preventDefault(); Input.mouse.down = true; });
    $('tBtnAtk').addEventListener('touchend', e => { e.preventDefault(); Input.mouse.down = false; });
    ['q','w','e','r'].forEach((k, i) => {
      $('tBtn' + (i + 1)).addEventListener('touchstart', e => { e.preventDefault(); castSkillKey(k); });
    });
  }
}

function setupSticks() {
  const mk = (el, obj) => {
    let cx = 0, cy = 0, id = null;
    el.addEventListener('touchstart', e => {
      e.preventDefault();
      const r = el.getBoundingClientRect();
      cx = r.left + r.width / 2; cy = r.top + r.height / 2;
      id = e.changedTouches[0].identifier; obj.active = true;
    }, { passive: false });
    el.addEventListener('touchmove', e => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (t.identifier !== id) continue;
        let dx = t.clientX - cx, dy = t.clientY - cy;
        const len = Math.hypot(dx, dy) || 1, max = 44;
        if (len > max) { dx = dx / len * max; dy = dy / len * max; }
        obj.x = dx / max; obj.y = dy / max;
        el.querySelector('i').style.transform = `translate(${dx}px,${dy}px)`;
      }
    }, { passive: false });
    const end = e => {
      e.preventDefault();
      obj.active = false; obj.x = 0; obj.y = 0; id = null;
      el.querySelector('i').style.transform = 'translate(0,0)';
    };
    el.addEventListener('touchend', end, { passive: false });
    el.addEventListener('touchcancel', end, { passive: false });
  };
  mk($('stickMove'), Input.moveStick);
  mk($('stickAim'), Input.aimStick);
}

/* ---------------- 玩家 ---------------- */
function updatePlayer(dt) {
  const p = G.player, w = G.world;
  if (!p || !w) return;

  for (const k in p.cd) if (p.cd[k] > 0) p.cd[k] = Math.max(0, p.cd[k] - dt);
  if (p.attackCd > 0) p.attackCd -= dt;
  if (p.attackAnim > 0) p.attackAnim -= dt;
  if (p.castAnim > 0) p.castAnim -= dt;

  for (let i = p.buffs.length - 1; i >= 0; i--) {
    const b = p.buffs[i];
    b.t -= dt;
    if (b.t <= 0) { p.buffs.splice(i, 1); recalcStats(p); }
  }
  if (p.stats.invis > 0) p.stats.invis = Math.max(0, p.stats.invis - dt);

  p.mp = Math.min(p.stats.mpMax, p.mp + p.stats.mpMax * p.stats.mpRegen * dt);

  // 移动：方向键 / 触屏摇杆 / 按住右键跟随鼠标
  let mx = 0, my = 0;
  if (Input.keys['arrowleft'] || Input.keys['arrowright'] || Input.keys['arrowup'] || Input.keys['arrowdown']) G.moveTarget = null;
  if (Input.keys['arrowleft']) mx -= 1;
  if (Input.keys['arrowright']) mx += 1;
  if (Input.keys['arrowup']) my -= 1;
  if (Input.keys['arrowdown']) my += 1;
  if (Input.moveStick.active) { mx += Input.moveStick.x; my += Input.moveStick.y; }

  let len = Math.hypot(mx, my);
  if (len > 0.1) {
    mx /= len; my /= len;
    p.x += mx * 235 * dt;
    p.y += my * 235 * dt;
  } else if (G.moveTarget) {
    const dx = G.moveTarget.x - p.x, dy = G.moveTarget.y - p.y;
    const dd = Math.hypot(dx, dy);
    if (dd > 10) {
      p.x += (dx / dd) * 235 * dt;
      p.y += (dy / dd) * 235 * dt;
      len = 1;
    } else {
      G.moveTarget = null;   // 到达
    }
  }
  p.x = clamp(p.x, p.r, w.W - p.r);
  p.y = clamp(p.y, p.r, w.H - p.r);

  // 朝向
  if (Input.isTouch && Input.aimStick.active && Math.hypot(Input.aimStick.x, Input.aimStick.y) > 0.2) {
    p.dir = Math.atan2(Input.aimStick.y, Input.aimStick.x);
  } else if (!Input.isTouch) {
    p.dir = Math.atan2((Input.mouse.y / YS) + CAM.y - p.y, Input.mouse.x + CAM.x - p.x);
  } else if (len > 0.1) {
    p.dir = Math.atan2(my, mx);
  }

  // 手动攻击
  if (Input.mouse.down || Input.keys['j']) playerAttack();

  // 自动战斗
  autoBattleTick(dt);
}

/* ---------------- 自动战斗 ---------------- */
function autoBattleTick(dt) {
  const p = G.player, w = G.world;
  if (!w || w.isTown) return;

  if (!AUTO.atk && !AUTO.skill) return;

  const target = nearestMonster(1400);
  if (!target) { G.moveTarget = null; return; }

  // 自动转向目标
  if (AUTO.atk) p.dir = Math.atan2(target.y - p.y, target.x - p.x);

  // 自动走向目标（走到攻击距离内就停）
  if (AUTO.atk) {
    const d0 = dist(p, target);
    const reach = (p.cls === 'warrior' || p.cls === 'assassin') ? 55 : 280;
    if (d0 > reach) {
      const ang = Math.atan2(target.y - p.y, target.x - p.x);
      G.moveTarget = {
        x: target.x - Math.cos(ang) * reach * 0.8,
        y: target.y - Math.sin(ang) * reach * 0.8
      };
    } else if (G.moveTarget) {
      G.moveTarget = null;
    }
  }

  // 自动攻击
  if (AUTO.atk) playerAttack();

  // 自动技能
  if (!AUTO.skill) return;
  autoSkillCd -= dt;
  if (autoSkillCd > 0) return;

  const d = dist(p, target);
  const hpPct = p.hp / p.stats.hpMax;

  // 血少先用 D 拉开距离
  if (hpPct < 0.30 && (p.cd[p.dash] || 0) <= 0) {
    castSkillKey('d');
    autoSkillCd = 0.35;
    return;
  }

  // Q → W → E → R 依次找可用的
  for (const k of ['q', 'w', 'e', 'r']) {
    const key = p.keymap[k];
    const sp = DATA.SKILLS[key];
    if (!sp || (p.cd[key] || 0) > 0) continue;
    if (p.mp < (sp.cost || 0)) continue;
    // 距离门槛：近战/AOE 要贴脸，投射物可以远
    const need = (sp.kind === 'proj') ? 620 : (sp.kind === 'buff' ? 0 : 300);
    if (need > 0 && d > need) continue;
    castSkillKey(k);
    autoSkillCd = 0.35;
    return;
  }
}

/* ---------------- 房间 ---------------- */
function goTown() {
  enterRoom(TOWN);
  saveGame();
  logMsg('回到城镇', 'info');
}

function checkBossUnlock() {
  const p = G.player;
  if (p.bossKills > prevBossKills) {
    prevBossKills = p.bossKills;
    const cur = G.world.roomId;
    if (cur !== TOWN && cur + 1 < DATA.ROOMS.length && !p.unlocked.includes(cur + 1)) {
      p.unlocked.push(cur + 1);
      toast(`已解锁：${DATA.ROOMS[cur + 1].name}`);
      logMsg(`解锁 ${DATA.ROOMS[cur + 1].name}`, 'level');
    }
    saveGame();
  }
}

/* ---------------- 主循环 ---------------- */
function loop(ts) {
  requestAnimationFrame(loop);
  if (!G.lastTs) G.lastTs = ts;
  let dt = (ts - G.lastTs) / 1000;
  G.lastTs = ts;
  dt = Math.min(dt, 0.05);

  if (G.screen === 'game') {
    G.time += dt;
    updatePlayer(dt);
    updateWorld(dt);
    updateTimers(dt);
    updateCamera();
    updateHUD(dt);
    checkBossUnlock();

    autoSaveAcc += dt;
    if (autoSaveAcc > 5) { autoSaveAcc = 0; saveGame(); }   // 每 5 秒自动存档
  }
  render();
}

/* ---------------- 启动 ---------------- */
window.addEventListener('error', e => {
  try { toast('JS错误: ' + (e.message || e.error)); } catch (_) {}
  console.error(e.error || e.message);
});

window.addEventListener('DOMContentLoaded', () => {
  loadAssets();
  resizeCanvas();
  initInput();
  uiInit();
  showScreen('title');

  if (location.hash === '#create') showScreen('create');

  if (location.hash.startsWith('#dev')) {
    const dropTest = /d$/.test(location.hash);
    const charTest = /c$/.test(location.hash);
    const bagTest = /b$/.test(location.hash);
    const fxTest = /e$/.test(location.hash);
    const tipTest = /t$/.test(location.hash);
    const forgeTest = /[fg]$/.test(location.hash);
    const skillTest = /k$/.test(location.hash);
    const questTest = /q$/.test(location.hash);
    const setTest = /s$/.test(location.hash);
    const craftTest = /n$/.test(location.hash);
    const n = parseInt(location.hash.slice(4), 10);
    G.diff = 'normal';
    G.player = createPlayer('human', 'archer');
    G.player.unlocked = [0,1,2,3,4,5];
    G.player.level = 8;
    recalcStats(G.player);
    G.player.hp = G.player.stats.hpMax;
    G.player.mp = G.player.stats.mpMax;
    startGame();
    if (!isNaN(n)) enterRoom(n);
    if (dropTest) {
      G.autoPickup = false;
      G.world.monsters.filter(m => !m.isBoss).slice(0, 5)
        .forEach(m => damageMonster(m, 999999, 'melee'));
    }
    if (fxTest) {
      AUTO.atk = true; AUTO.skill = true;
      setInterval(() => {
        const p = G.player; if (!p) return;
        p.cd[p.keymap.q] = 0; p.mp = p.stats.mpMax;
        castSkillKey('q');
      }, 300);
    }
    if (tipTest) setTimeout(() => showSkillTip('q', 1080, 380), 900);
    if (charTest) handleCommand('char');
    if (forgeTest) {
      // 给几件装备 + 材料，方便看锻造台
      for (const sk in DATA.SLOTS) {
        if (sk === 'ring2') continue;
        G.player.equip[sk] = makeItem(sk, 10, 'rare', false);
      }
      G.player.equip.weapon.enh = 7;
      G.player.materials.stone = 40; G.player.materials.protect = 3;
      G.player.gold = 50000;
      recalcStats(G.player);
      const it = makeItem('chest', 12, 'epic', false); it.enh = 11; addToBag(G.player, it);
      if (location.hash.endsWith('g')) openModal('enhance','锻造台 · 强化', enhanceItemHtml(G.player.equip.weapon.id));
      else handleCommand('enhance');
    }
    if (craftTest) {
      G.player.materials.iron = 10; G.player.materials.mithril = 6;
      G.player.materials.scale = 3; G.player.materials.shard = 1;
      G.player.materials.stone = 25; G.player.materials.protect = 2;
      G.player.gold = 20000;
      handleCommand('craft');
    }
    if (setTest) {
      const cl = G.player.cls;
      const key = cl + '_2';
      // 给两件该套装件看看效果
      ['weapon','helm'].forEach(sl => {
        const it = makeItem(sl, 20, 'epic', false);
        it.setKey = key; it.setName = DATA.SETS[cl][2].name;
        it.name = DATA.SETS[cl][2].name + '·' + DATA.SLOTS[sl].name;
        G.player.equip[sl] = it;
      });
      recalcStats(G.player);
      openModal('setinfo', '套装图鉴', setDetailHtml(key));
    }
    if (questTest) {
      G.player.unlocked = [0,1,2,3,4,5];
      G.player.quests = [
        { ...DATA.QUEST_POOL[0], have: 7 },
        { ...DATA.QUEST_POOL[1], have: 15 },
        { ...DATA.QUEST_POOL[2], have: 3 }
      ];
      G.player.questDone = 4;
      handleCommand('quest');
    }
    if (skillTest) {
      G.player.materials.breakT = 0; G.player.materials.skillT = 4;
      const cls = DATA.CLASSES[G.player.cls];
      [cls.keymap.q, cls.keymap.w].forEach(k => { skillProfOf(G.player, k).prof = 100; });
      handleCommand('skill');
    }
    if (bagTest) {
      // 塞点测试物品：药水堆叠 + 各种品质装备
      const po = DATA.POTIONS[0];
      addToBag(G.player, { ...po, type:'potion', count: 1 });
      addToBag(G.player, { ...po, type:'potion', count: 1 });
      addToBag(G.player, { ...DATA.POTIONS[1], type:'potion', count: 1 });
      ['common','uncommon','rare','epic','legendary'].forEach((q,i) => {
        const it = makeItem(Object.keys(DATA.SLOTS)[i], 8 + i*2, q, false);
        addToBag(G.player, it);
      });
      handleCommand('bag');
    }
    logMsg('调试模式', 'level');
  }
  requestAnimationFrame(loop);
});

</script>
</body>
</html>
