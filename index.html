<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__GAME_TITLE__</title>
<link rel="stylesheet" href="css/style.css">
<script id="orc-cfg" type="application/json">{}</script>
</head>
<body>
<div id="app">

  <canvas id="view"></canvas>

  <!-- ================= HUD ================= -->
  <div id="hud" class="hidden">

    <!-- 顶部中：房间 -->
    <div class="topbar-left">
      <span class="room-name" id="roomName">贫瘠之地</span>
      <span class="room-sub" id="roomSub"></span>
    </div>

    <!-- 顶部右：资源 -->
    <div class="topbar-right">
      <div class="tr-col">
        <div class="res-box"><i class="ic-gold">金</i><b id="goldVal">0</b></div>
        <div class="res-box"><i class="ic-cp">战</i><b id="cpVal">0</b></div>
        <div class="res-box"><i class="ic-gear">装</i><b id="gearVal">未集齐</b></div>
        <div class="res-box"><i class="ic-diff">难</i><b id="diffVal">简单</b></div>
      </div>
      <div class="tr-col">
        <button class="codex-btn mail-btn" data-act="mail">📮 邮箱<span class="mail-dot hidden" id="mailDot">0</span></button>
        <button class="codex-btn settings-btn" data-act="settings">⚙ 设置</button>
        <button class="codex-btn" data-act="codexEquip">装备图鉴</button>
        <button class="codex-btn" data-act="codexCollect">收藏图鉴</button>
      </div>
    </div>

    <!-- BOSS 血条 -->
    <div id="bossBar" class="boss-bar hidden">
      <div class="bb-name" id="bossName"></div>
      <div class="bb-track"><div class="bb-fill" id="bossFill"></div></div>
    </div>

    <!-- 作者署名（顶部居中） -->
    <div class="author-tag">作者 Bird · QQ 827766702</div>

    <!-- 大字广播 -->
    <div id="bigAnnounce" class="big-announce hidden"></div>

    <!-- 左上角：当前位置 / 难度 -->
    <div class="hud-place" id="hudPlace">
      <span class="hp-room" id="placeRoom">暴风城</span>
      <span class="hp-diff" id="placeDiff">安全区</span>
    </div>

    <!-- 左侧中部：效率统计 -->
    <div class="hud-perf" id="hudPerf">
      <div class="pf-head">效率 / 分钟</div>
      <div class="pf-row"><span>击杀</span><b id="pfKill">0</b></div>
      <div class="pf-row"><span>经验</span><b id="pfExp">0</b></div>
      <div class="pf-row"><span>金币</span><b id="pfGold">0</b></div>
      <div class="pf-row"><span>装备</span><b id="pfItem">0</b></div>
    </div>

    <!-- 左上角：声音开关（头像下方） -->
    <button id="soundToggle" class="sound-toggle" title="音效开关">🔊</button>

    <!-- 左上角：头像 + 血蓝 -->
    <div class="hud-portrait">
      <div class="portrait-frame">
        <canvas id="portrait" width="80" height="80"></canvas>
        <div class="p-level" id="pLevel">1</div>
      </div>
      <div class="hp-info">
        <div class="p-name" id="pName">人族 · 战士</div>
        <div class="bar hp"><i id="hpFill"></i><span id="hpText">0/0</span></div>
        <div class="bar mp"><i id="mpFill"></i><span id="mpText">0/0</span></div>
        <div class="bar xp"><i id="xpFill"></i><span id="xpText">0%</span></div>
        <div class="p-stats" id="pStats"></div>
      </div>
    </div>

    <!-- 右下角：命令卡 -->
    <div class="hud-commands">
      <div class="cc-grid" id="commandCard">
        <button class="cc-btn skill" data-skill="q"><span class="hk">Q</span><span class="sk-ic"></span><span class="nm">—</span><span class="cd"></span></button>
        <button class="cc-btn skill" data-skill="w"><span class="hk">W</span><span class="sk-ic"></span><span class="nm">—</span><span class="cd"></span></button>
        <button class="cc-btn skill" data-skill="e"><span class="hk">E</span><span class="sk-ic"></span><span class="nm">—</span><span class="cd"></span></button>
        <button class="cc-btn skill" data-skill="r"><span class="hk">R</span><span class="sk-ic"></span><span class="nm">—</span><span class="cd"></span></button>
        <button class="cc-btn skill dash" data-skill="d"><span class="hk">D</span><span class="sk-ic"></span><span class="nm">—</span><span class="cd"></span></button>
        <button class="cc-btn toggle" data-act="autoAtk"><span class="hk">A</span><span class="sk-ic util"></span><span class="nm">自动攻击</span></button>
        <button class="cc-btn toggle" data-act="autoSkill"><span class="hk">S</span><span class="sk-ic util"></span><span class="nm">自动技能</span></button>
        <button class="cc-btn" data-act="potion"><span class="hk">F</span><span class="sk-ic util"></span><span class="nm">喝药</span></button>
        <button class="cc-btn" data-act="bag"><span class="hk">B</span><span class="sk-ic util"></span><span class="nm">背包</span></button>
        <button class="cc-btn" data-act="char"><span class="hk">C</span><span class="sk-ic util"></span><span class="nm">角色</span></button>
        <button class="cc-btn" data-act="skill"><span class="hk">K</span><span class="sk-ic util"></span><span class="nm">技能</span></button>
        <button class="cc-btn" data-act="map"><span class="hk">M</span><span class="sk-ic util"></span><span class="nm">传送/回城</span></button>
      </div>
    </div>

    <div id="questTracker" class="hidden"></div>
    <div class="msglog" id="msglog"></div>
    <div class="interact-hint hidden" id="interactHint"></div>
  </div>

  <!-- ================= 标题 ================= -->
  <div id="screen-title" class="screen">
    <div class="title-box">
      <div class="game-title">__GAME_TITLE__</div>
      <div class="game-sub">打怪 · 爆装 · 成长</div>
      <div class="title-btns">
        <button class="big-btn" id="btnContinue">继续游戏</button>
        <button class="big-btn primary" id="btnNew">新的征程</button>
        <button class="big-btn" id="btnImport">导入存档</button>
      </div>
      <div class="title-tip">方向键/右键 移动 · 左键攻击 · QWER 技能 · D 位移 · A/S 自动战斗</div>
      <div class="title-author">作者 Bird · QQ 827766702</div>
    </div>
  </div>

  <!-- ================= 建角 ================= -->
  <div id="screen-create" class="screen hidden">
    <div class="create-wrap">
      <h2 class="panel-title">选择你的种族</h2>
      <div class="race-list" id="raceList"></div>
      <h2 class="panel-title">选择你的职业</h2>
      <div class="class-list" id="classList"></div>
      <div class="create-actions">
        <button class="big-btn" id="btnBackTitle">返回</button>
        <button class="big-btn primary" id="btnStart">踏入战场</button>
      </div>
    </div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-frame">
      <div class="modal-head">
        <span id="modalTitle">背包</span>
        <button class="close-btn" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <div id="touch" class="hidden">
    <div class="stick" id="stickMove"><i></i></div>
  </div>
</div>

<script src="js/assets.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/cfg.js"></script>
<script src="js/mail.js"></script>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/combat.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
  <div id="loreBox" class="hidden"></div>
</body>
</html>
